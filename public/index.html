<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Hero — يوم يَمان · TickTick Daily Import</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f7f6ff;
      --surface: #ffffff;
      --surface-soft: #f5f4ff;
      --ink: #1f2340;
      --muted: #5b5f7a;
      --line: #dddaf3;
      --brand: #5b5bd6;
      --brand-strong: #4538c7;
      --brand-soft: #ecebff;
      --teal: #16856a;
      --teal-soft: #e8f8f3;
      --amber: #9b6600;
      --amber-soft: #fff5d9;
      --danger: #b63258;
      --danger-soft: #fff0f4;
      --navy: #231b4d;
      --shadow: 0 12px 32px rgba(49, 46, 129, 0.10);
      --shadow-action: 0 10px 22px rgba(91, 91, 214, 0.28);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --tap: 50px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #f0edff 0, #f7f6ff 320px, var(--bg) 100%);
      font-family: "Tajawal", "Noto Sans Arabic", "Geeza Pro", Tahoma, Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .52; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(21, 94, 239, .42);
      outline-offset: 2px;
    }

    .app {
      width: min(100% - 28px, 840px);
      margin: 0 auto;
      padding: 16px 0 102px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 86px;
      padding: 16px 18px;
      border-radius: var(--radius-xl);
      color: #fff;
      background: linear-gradient(135deg, #2f2a72 0%, #4f46c9 55%, #6d5ef0 100%);
      box-shadow: 0 16px 36px rgba(67, 56, 202, 0.22);
    }

    .identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 47px;
      height: 47px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 16px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .identity h1 { margin: 0; font-size: clamp(1.14rem, 4vw, 1.42rem); line-height: 1.35; font-weight: 800; }
    .identity p { margin: 3px 0 0; color: #dbe7ff; font-size: .86rem; }

    .icon-button {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: var(--tap);
      height: var(--tap);
      padding: 0;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 1.22rem;
    }

    .main-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 16px 0 22px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 22px rgba(49,46,129,.08);
    }

    .nav-button {
      min-height: 48px;
      padding: 8px 6px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-size: .87rem;
      font-weight: 700;
    }

    .nav-button[aria-current="page"] {
      background: var(--brand);
      color: #fff;
      box-shadow: var(--shadow-action);
    }

    .screen { display: none; animation: appear .18s ease; }
    .screen.active { display: block; }

    @keyframes appear {
      from { opacity: .01; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: var(--brand-strong);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    h2, h3, p { overflow-wrap: anywhere; }
    h2 { margin: 0; font-size: clamp(1.38rem, 5vw, 1.78rem); line-height: 1.45; font-weight: 800; }
    h3 { margin: 0; font-size: 1.06rem; line-height: 1.5; font-weight: 700; }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }

    .card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 5px 16px rgba(20,33,61,.045);
    }

    .stack { display: grid; gap: 15px; }

    .now-card {
      position: relative;
      overflow: hidden;
      padding: 23px;
      border: 1px solid #d4cffc;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, #ffffff 0%, #f1efff 100%);
      box-shadow: var(--shadow);
    }

    .now-card::after {
      content: "";
      position: absolute;
      left: -64px;
      bottom: -64px;
      width: 170px;
      height: 170px;
      border: 22px solid rgba(91,91,214,.09);
      border-radius: 50%;
      pointer-events: none;
    }

    .now-content { position: relative; z-index: 1; }
    .now-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.done { background: var(--teal-soft); color: #076057; }
    .status-pill.warn { background: var(--amber-soft); color: #765000; }

    .now-title { max-width: 590px; margin: 17px 0 9px; }
    .now-step { margin: 0 0 20px; color: #334155; font-size: 1.03rem; font-weight: 500; }

    .action-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 16px;
      font-weight: 700;
      letter-spacing: .005em;
      text-align: center;
      transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow-action); }
    .btn-primary:hover:not(:disabled) { background: var(--brand-strong); box-shadow: 0 10px 22px rgba(11,59,167,.24); }
    .btn-secondary { background: #fff; border-color: #b9c7da; color: var(--ink); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-soft); border-color: #8ea5c4; }
    .btn-soft { background: var(--brand-soft); color: var(--brand-strong); }
    .btn-soft:hover:not(:disabled) { background: #dfe9ff; }
    .btn-success { background: var(--teal); color: #fff; box-shadow: 0 7px 16px rgba(11,122,75,.18); }
    .btn-success:hover:not(:disabled) { background: #075f3a; }
    .btn-danger { background: #fff; border-color: #e9b8c0; color: var(--danger); }
    .btn-link { min-height: 0; padding: 4px 0; border: 0; background: transparent; color: var(--brand); }

    .progress-panel {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
    }

    .progress-number {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8e6f7;
    }

    .progress-value {
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
      transition: width .25s ease;
    }

    .mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .mini-card {
      padding: 13px 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-soft);
      text-align: center;
    }
    .mini-card strong { display: block; color: var(--ink); font-size: 1.15rem; }
    .mini-card span { display: block; margin-top: 2px; color: var(--muted); font-size: .76rem; }


    .dashboard-shell {
      position: relative;
      overflow: hidden;
      border-color: #d9d2ff;
      background: linear-gradient(145deg, #faf9ff, #ffffff);
    }
    .dashboard-shell::after {
      content: "";
      position: absolute;
      top: -34px;
      left: -34px;
      width: 110px;
      height: 110px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(91,91,214,.10), rgba(124,58,237,.06));
      pointer-events: none;
    }
    .dashboard-title {
      position: relative;
      z-index: 1;
      margin-top: 3px;
    }
    .dashboard-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .dashboard-metric {
      padding: 12px;
      border: 1px solid #dfdbf8;
      border-radius: 16px;
      background: rgba(255,255,255,.88);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .dashboard-metric strong {
      display: block;
      color: var(--navy);
      font-size: 1.08rem;
      font-weight: 700;
    }
    .dashboard-metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .78rem;
    }
    .dashboard-metric.primary {
      border-color: #cac3fb;
      background: linear-gradient(145deg, #ecebff, #ffffff);
    }
    .dashboard-progress {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(91,91,214,.05);
      border: 1px solid rgba(91,91,214,.10);
    }
    .dashboard-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .dashboard-progress-head strong {
      color: var(--navy);
      font-size: .95rem;
    }
    .dashboard-progress-head span {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }
    .dashboard-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .dashboard-badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: #f0eeff;
      color: var(--brand-strong);
      font-size: .76rem;
      font-weight: 700;
    }

    .quiet-card {
      border-color: #c9e9e2;
      background: linear-gradient(145deg, #f3fcfa, #fff);
    }
    .quiet-card p { margin: 7px 0 0; color: #32645c; }

    .list-card { padding: 0; overflow: hidden; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 19px 14px;
      border-bottom: 1px solid var(--line);
    }

    .task-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .task-row {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row.active { background: #f3f1ff; }
    .task-row.done { background: #f2fbf8; }

    .task-index {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 1px solid #ccd8f0;
      border-radius: 50%;
      background: #fff;
      color: var(--brand-strong);
      font-size: .82rem;
      font-weight: 700;
    }
    .task-row.done .task-index { border-color: #a9ddd2; background: var(--teal); color: #fff; }
    .task-copy { min-width: 0; }
    .task-copy h3 { font-size: .96rem; }
    .task-copy p { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
    .task-actions { display: flex; align-items: center; gap: 7px; }
    .task-icon-btn {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #c9d4e6;
      border-radius: 11px;
      background: #fff;
      color: var(--brand-strong);
      font-size: .9rem;
      font-weight: 700;
    }
    .task-icon-btn.danger { color: var(--danger); border-color: #f0ccd0; }
    .task-icon-btn.success { color: #fff; background: var(--teal); border-color: var(--teal); }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state p { margin: 6px 0 16px; }

    .timer-card { border-color: #bad6ff; background: linear-gradient(145deg, #f0eeff, #fff); }
    .timer-value {
      direction: ltr;
      margin: 13px 0 4px;
      color: var(--navy);
      font-family: "IBM Plex Mono", "Tajawal", ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .01em;
      font-size: clamp(2.5rem, 11vw, 4rem);
      font-weight: 700;
      letter-spacing: -.05em;
      text-align: center;
    }
    .timer-note { margin: 0 0 17px; color: var(--muted); text-align: center; }

    .intro-card { padding: 25px; border-color: #c9d6ff; background: linear-gradient(140deg, #f1efff, #fff); }
    .intro-card h2 { max-width: 540px; }
    .intro-card p { max-width: 590px; margin: 10px 0 19px; color: #41506b; }

    .steps-indicator { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 15px 0 22px; }
    .step-dot {
      height: 8px;
      border-radius: 999px;
      background: #dce4ef;
    }
    .step-dot.active { background: var(--brand); }
    .step-dot.complete { background: var(--teal); }

    .option-grid { display: grid; gap: 10px; }
    .option-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 12px 15px;
      border: 1px solid #cbd5e5;
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      text-align: right;
    }
    .option-button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); box-shadow: inset 0 0 0 1px rgba(21,94,239,.16); }
    .option-button .sub { display: block; margin-top: 2px; color: var(--muted); font-size: .8rem; font-weight: 700; }


    .ticktick-list-option {
      align-items: center;
    }
    .ticktick-list-option .list-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 3px rgba(91, 91, 214, .10);
      vertical-align: middle;
    }
    .ticktick-scope {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-top: 8px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-size: .77rem;
      font-weight: 700;
    }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .choice-button {
      min-height: 72px;
      padding: 11px;
      border: 1px solid #cbd5e5;
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      text-align: right;
    }
    .choice-button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); box-shadow: inset 0 0 0 1px rgba(21,94,239,.16); }

    .form-grid { display: grid; gap: 13px; }
    label { display: grid; gap: 7px; color: var(--ink); font-weight: 700; }
    input, textarea, select {
      width: 100%;
      min-height: var(--tap);
      padding: 11px 12px;
      border: 1px solid #c8d3e2;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 98px; resize: vertical; }

    .idea-card {
      min-height: 220px;
      padding: 23px;
      border: 1px solid #cddcff;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, #f4f1ff, #fff);
    }
    .idea-card p { margin: 9px 0 0; color: #40516d; }

    .script-box {
      padding: 15px;
      border-right: 4px solid var(--brand);
      border-radius: 12px;
      background: var(--surface-soft);
      color: #384861;
    }

    .review-card { border-color: #f0dba8; background: #fffdf8; }
    .review-card p { margin-top: 6px; }

    .modal-root:empty { display: none; }
    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(15, 25, 45, .62);
    }
    .modal {
      position: relative;
      width: min(100%, 590px);
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 84px rgba(10,18,35,.35);
    }
    .modal-close {
      position: absolute;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 1.2rem;
    }
    .modal-head { padding-left: 46px; }
    .modal-head h2 { font-size: 1.35rem; }
    .modal-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

    .toast {
      position: fixed;
      left: 16px;
      bottom: 17px;
      z-index: 70;
      max-width: min(420px, calc(100% - 32px));
      padding: 13px 15px;
      border-radius: 14px;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow);
      transform: translateY(150%);
      opacity: 0;
      transition: .22s ease;
      font-weight: 700;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .footer-note { margin: 20px 0 0; color: var(--muted); font-size: .78rem; text-align: center; }

    @media (min-width: 700px) {
      .app { padding-top: 28px; }
      .content-grid { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(260px,.85fr); gap: 16px; align-items: start; }
      .mini-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .dashboard-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 840px); padding-top: 10px; }
      .topbar { border-radius: 20px; padding: 14px; }
      .identity p { display: none; }
      .main-nav { gap: 3px; padding: 5px; }
      .nav-button { font-size: .78rem; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .now-card, .intro-card, .idea-card { padding: 19px; border-radius: 20px; }
      .task-row { grid-template-columns: 30px minmax(0,1fr) auto; padding: 13px; gap: 8px; }
      .task-actions { gap: 4px; }
      .task-icon-btn { width: 35px; height: 35px; }
      .modal { padding: 20px 17px 17px; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* Action-first visual system: one strong action colour, clear success state, low-noise surfaces. */
    .identity h1, h2, h3, .task-copy h3 { letter-spacing: 0; }
    .identity h1 { font-weight: 700; }
    .identity p { font-weight: 500; }
    .nav-button { font-weight: 700; }
    .eyebrow { color: var(--brand-strong); font-weight: 700; }
    .status-pill { font-weight: 700; }
    .status-pill.done { color: #05613c; }
    .status-pill.warn { color: #754600; }
    .progress-number { font-weight: 700; }
    .task-row.active { background: #f1efff; box-shadow: inset 4px 0 0 var(--brand); }
    .task-row.done { background: #f1fbf6; }
    .task-copy h3 { font-weight: 700; }
    .task-copy p, .mini-card span, .small { font-weight: 500; }
    .task-icon-btn { color: var(--brand-strong); }
    .task-icon-btn.success { background: var(--teal); border-color: var(--teal); }
    .quiet-card { border-color: #bce4d5; background: linear-gradient(145deg, #f0fbf6, #fff); }
    .quiet-card p { color: #245c45; }
    .intro-card { border-color: #d6cffc; background: linear-gradient(140deg, #f3f0ff, #fff); }
    .idea-card { border-color: #d8d2ff; background: linear-gradient(145deg, #f5f2ff, #fff); }
    .timer-card { border-color: #d2cbff; background: linear-gradient(145deg, #f2efff, #fff); }
    .review-card { border-color: #ecd6a2; background: #fffdf8; }
    .script-box { color: #3f4663; background: #f7f5ff; }
    input::placeholder, textarea::placeholder { color: #64748b; opacity: 1; }
    input, textarea, select { font-weight: 500; }
    .modal { border: 1px solid #dce5f2; }
    .footer-note { color: #5e6281; }



    /* Tajawal typographic rhythm: soft, readable, calm, and age-appropriate. */
    .identity h1,
    h2,
    .task-copy h3,
    .modal-head h2,
    .progress-number {
      font-family: "Tajawal", "Noto Sans Arabic", Tahoma, sans-serif;
      letter-spacing: 0;
    }

    h2,
    .modal-head h2,
    .task-copy h3 {
      font-weight: 700;
    }

    .identity p,
    .task-copy p,
    .small,
    .footer-note {
      font-weight: 400;
    }


    /* Plan tools: events and AI idea builder */
    .plan-tools-grid { display: grid; gap: 15px; }
    .agenda-card { border-color: #d9d3fb; background: linear-gradient(145deg, #fbfaff, #fff); }
    .agenda-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .event-list { display:grid; gap:9px; margin-top:14px; }
    .event-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; padding:11px 12px; border:1px solid #e1ddf9; border-radius:15px; background:#fff; }
    .event-time { min-width:54px; padding:7px 8px; border-radius:11px; background:#ecebff; color:var(--brand-strong); font-size:.82rem; font-weight:700; text-align:center; direction:ltr; }
    .event-copy strong { display:block; color:var(--ink); font-size:.94rem; }
    .event-copy span { display:block; margin-top:2px; color:var(--muted); font-size:.78rem; }
    .event-remove { width:34px; height:34px; padding:0; border:1px solid #f0c4d0; border-radius:10px; background:#fff; color:var(--danger); font-weight:700; }
    .idea-builder-card { border-color:#d5d0ff; background:linear-gradient(145deg, #f7f5ff, #fff); }
    .idea-builder-card textarea { min-height:94px; }
    .idea-help { margin:9px 0 0; color:var(--muted); font-size:.82rem; line-height:1.7; }
    .idea-results { display:grid; gap:10px; margin-top:15px; }
    .idea-result { padding:14px; border:1px solid #dcd7fb; border-radius:16px; background:#fff; }
    .idea-result h3 { color:var(--navy); }
    .idea-result p { margin:6px 0 0; color:var(--muted); font-size:.89rem; }
    .idea-first-step { margin-top:10px; padding:9px 10px; border-radius:12px; background:#f4f2ff; color:#45406f; font-size:.84rem; }
    .idea-source { display:inline-flex; margin-top:11px; padding:5px 8px; border-radius:999px; background:#eeecff; color:var(--brand-strong); font-size:.72rem; font-weight:700; }
    .ai-note { margin-top:11px; padding:10px 12px; border-radius:14px; background:#fffbeb; border:1px solid #f3dda0; color:#735a17; font-size:.8rem; line-height:1.65; }
    @media (min-width: 700px) { .plan-tools-grid { grid-template-columns: repeat(2, minmax(0,1fr)); align-items:start; } }

  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">Y</div>
        <div>
          <h1>Hero <span aria-hidden="true">—</span> يوم يَمان</h1>
          <p id="headerDate">خطوة واحدة واضحة في كل مرة.</p>
        </div>
      </div>
      <button class="icon-button" type="button" id="settingsBtn" aria-label="إعدادات التطبيق">⚙</button>
    </header>

    <nav class="main-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button" type="button" data-screen="now" aria-current="page">الآن</button>
      <button class="nav-button" type="button" data-screen="plan">خطتي</button>
      <button class="nav-button" type="button" data-screen="creative">الإبداع</button>
      <button class="nav-button" type="button" data-screen="progress">تقدمي</button>
    </nav>

    <main>
      <section class="screen active" id="screenNow" aria-labelledby="nowTitle"></section>
      <section class="screen" id="screenPlan" aria-labelledby="planTitle"></section>
      <section class="screen" id="screenCreative" aria-labelledby="creativeTitle"></section>
      <section class="screen" id="screenProgress" aria-labelledby="progressTitle"></section>
    </main>

    <p class="footer-note">Hero يحفظ الخطة على هذا الجهاز. ربط TickTick اختياري ومخصص لمهام Hero فقط.</p>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "hero-yaman-app-v5";
      const LEGACY_KEYS = ["hero-yaman-app-v4", "hero-yaman-app-v3", "hero-yaman-app-v2", "hero-yaman-app-v1", "yamanHeroTasks"];
      const MAX_TASKS = 3;
      const FOCUS_MINUTES = 20;

      const TASK_TEMPLATES = {
        study: { label: "دراسة", points: 15, duration: "20 دقيقة" },
        home: { label: "مسؤولية منزلية", points: 10, duration: "10 دقائق" },
        creative: { label: "إبداع", points: 15, duration: "15 دقيقة" },
        movement: { label: "حركة", points: 10, duration: "15 دقيقة" },
        social: { label: "مهارة اجتماعية", points: 10, duration: "5 دقائق" },
        routine: { label: "روتين", points: 5, duration: "5 دقائق" },
        other: { label: "مهمة أخرى", points: 5, duration: "10 دقائق" }
      };

      const GUIDES = {
        study: {
          intro: "ليس المطلوب إنهاء كل الدرس. المطلوب أن تبدأ بجزء صغير وواضح.",
          steps: ["حضّر الدفتر والقلم والكتاب.", "اختر سؤالاً واحداً أو فقرة قصيرة.", "ركّز حتى ينتهي المؤقت.", "ضع علامة على الشيء الصعب لتسأل عنه لاحقاً."],
          tip: "ابدأ بالسؤال الأسهل؛ البداية أهم من الكمال."
        },
        home: {
          intro: "المسؤولية أسهل عندما نعرف أول خطوة فقط.",
          steps: ["حدد شيئاً واحداً مطلوباً الآن.", "حضّر ما تحتاجه.", "أنجز الجزء الصغير بهدوء.", "رتّب المكان وأخبر أحد الوالدين عند الانتهاء."],
          tip: "اطلب المساعدة في أي جهاز أو مادة لست متأكداً منها."
        },
        creative: {
          intro: "المطلوب تجربة قصيرة، لا نتيجة كاملة من أول مرة.",
          steps: ["اختر شخصية أو فكرة واحدة.", "جرّب جملة واحدة بصوت عادي.", "قل الجملة بصوت الشخصية مرتين أو ثلاثاً.", "سجّل نسخة قصيرة واستمع لشيء أعجبك فيها."],
          tip: "لا تحذف المحاولة الأولى بسرعة؛ قد تسمع فيها فكرة جميلة."
        },
        movement: {
          intro: "الحركة القصيرة تساعد الجسم والذهن على العودة للتركيز.",
          steps: ["اشرب قليلاً من الماء.", "ابدأ بحركة خفيفة لدقيقتين.", "اختر تمريناً تحبه.", "خذ نفساً هادئاً عند الانتهاء."],
          tip: "المهم أن تتحرك، وليس أن تكون الأسرع."
        },
        social: {
          intro: "نتدرّب على جملة واحدة فقط. هذا يكفي اليوم.",
          steps: ["اختر الجملة التي ستقولها.", "قلها ببطء.", "جرّبها مع شخص تثق به.", "لاحظ ما نجح."],
          tip: "التحية أو سؤال بسيط بداية ممتازة."
        },
        routine: {
          intro: "روتين قصير يساعدك أن تبدأ اليوم بهدوء.",
          steps: ["اختر أول شيء فقط.", "حضّر ما تحتاجه.", "أنجزه بهدوء.", "تأكد أن المكان مرتب."],
          tip: "خمس دقائق بداية ممتازة."
        },
        other: {
          intro: "نقسم المهمة إلى خطوات صغيرة حتى تكون سهلة للبدء.",
          steps: ["حدد المطلوب بدقة.", "ابدأ أول خطوة لمدة خمس دقائق.", "خذ استراحة قصيرة إن احتجت.", "ارجع لإكمال الجزء التالي."],
          tip: "قل لنفسك: سأبدأ فقط بخمس دقائق."
        }
      };

      const CREATIVE_IDEAS = [
        ["روبوت يتعلم المشاعر", "روبوت مضحك يكتشف أن الناس لا يقولون دائماً ما يشعرون به، فيتعلم أن يسأل: «هل أنت بخير؟»"],
        ["آلة تبديل الأصوات", "مخترع صغير يصنع آلة تغيّر الأصوات، ثم تصبح أصوات الحيوانات غريبة ومضحكة."],
        ["مدرسة الكواكب", "كوكب صغير يبدأ في مدرسة خيالية ويكتشف طريقة سهلة للتعرّف إلى صديق جديد."],
        ["القطة المحققة", "قطة متكلمة تبحث عن الصوت المفقود من مدينة الأصوات، وكل شخصية تعطيها دليلاً."],
        ["البطل الهادئ", "شخصية تساعد صديقين مختلفين على الحديث بهدوء وفهم كل واحد للآخر."]
      ];

      const SOCIAL_SCRIPTS = [
        ["بدء محادثة", "مرحباً، ما الشخصية التي تحبها أكثر؟"],
        ["طلب المساعدة", "هل يمكنك أن تساعدني في هذه الخطوة؟ أنا لا أفهمها بعد."],
        ["استراحة محترمة", "أحتاج استراحة قصيرة، ثم أعود وأكمل."],
        ["الانضمام إلى نشاط", "هل يمكن أن أنضم إليكم؟ أحب أن أشارك."]
      ];

      let state = loadState();
      let activeScreen = "now";
      let wizard = null;
      let timerInterval = null;
      let ticktickState = { configured: false, connected: false, projectName: "Hero – Yaman" };
      let ticktickImportSession = null;
      let ticktickProjectSelectionSession = null;

      function dateKey(date = new Date()) {
        return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
      }

      function newId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function defaultState() {
        return {
          date: dateKey(),
          profile: { ready: false, energy: "", commitments: [], focus: "" },
          tasks: [],
          activeTaskId: null,
          timer: { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null },
          pointsByDate: {},
          activeStrengths: [],
          review: null,
          creativeIdeaIndex: 0,
          socialSkillIndex: 0,
          ticktickImportPromptDate: "",
          ticktickImportProjectIds: null,
          calendarEvents: [],
          ideaDraft: "",
          ideaSuggestions: [],
          ideaSuggestionMode: ""
        };
      }

      function normalizeType(value) {
        const map = {
          studySession: "study",
          studyStart: "study",
          home: "home",
          creative: "creative",
          movement: "movement",
          social: "social",
          routine: "routine",
          tomorrow: "routine",
          video: "creative"
        };
        return TASK_TEMPLATES[value] ? value : (map[value] || "other");
      }

      function normalizeTask(task) {
        const type = normalizeType(task.type || task.category || "other");
        return {
          id: task.id || newId(),
          title: String(task.title || "مهمة قصيرة"),
          type,
          points: Number(task.points) || TASK_TEMPLATES[type].points,
          done: Boolean(task.done || task.completed),
          ticktickTaskId: task.ticktickTaskId || null,
          ticktickProjectId: task.ticktickProjectId || null,
          ticktickCompleted: Boolean(task.ticktickCompleted),
          ticktickImported: Boolean(task.ticktickImported),
          ticktickDueDate: task.ticktickDueDate || null,
          ticktickProjectName: task.ticktickProjectName || "",
          generated: Boolean(task.generated) || /^(دراسة لمدة|مسؤولية منزلية قصيرة|نشاط إبداعي|حركة خفيفة أو مشي)/.test(String(task.title || ""))
        };
      }


      function normalizeCalendarEvent(event) {
        const rawDate = String(event?.date || dateKey()).slice(0, 10);
        const safeDate = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate : dateKey();
        const rawTime = String(event?.time || "").slice(0, 5);
        const safeTime = /^\d{2}:\d{2}$/.test(rawTime) ? rawTime : "";
        return {
          id: event?.id || newId(),
          title: String(event?.title || "موعد").trim().slice(0, 100),
          date: safeDate,
          time: safeTime,
          note: String(event?.note || "").trim().slice(0, 220)
        };
      }

      function loadState() {
        let raw = null;
        try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch {}

        if (!raw) {
          for (const key of LEGACY_KEYS) {
            try {
              const previous = JSON.parse(localStorage.getItem(key) || "null");
              if (Array.isArray(previous)) { raw = { tasks: previous }; break; }
              if (previous && typeof previous === "object") { raw = previous; break; }
            } catch {}
          }
        }

        const base = defaultState();
        if (!raw || typeof raw !== "object") return base;

        return {
          ...base,
          ...raw,
          profile: { ...base.profile, ...(raw.profile || {}) },
          timer: { ...base.timer, ...(raw.timer || {}) },
          tasks: Array.isArray(raw.tasks) ? raw.tasks.map(normalizeTask) : [],
          activeStrengths: Array.isArray(raw.activeStrengths) ? raw.activeStrengths : [],
          pointsByDate: raw.pointsByDate || {},
          ticktickImportProjectIds: Array.isArray(raw.ticktickImportProjectIds)
            ? [...new Set(raw.ticktickImportProjectIds.map(id => String(id).trim()).filter(Boolean))]
            : null,
          calendarEvents: Array.isArray(raw.calendarEvents)
            ? raw.calendarEvents.map(normalizeCalendarEvent)
            : [],
          ideaDraft: typeof raw.ideaDraft === "string" ? raw.ideaDraft.slice(0, 600) : "",
          ideaSuggestions: Array.isArray(raw.ideaSuggestions) ? raw.ideaSuggestions.slice(0, 3) : [],
          ideaSuggestionMode: typeof raw.ideaSuggestionMode === "string" ? raw.ideaSuggestionMode : ""
        };
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate() {
        return new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timeout);
        showToast.timeout = setTimeout(() => toast.classList.remove("show"), 3300);
      }

      function carryForward() {
        if (state.date === dateKey()) return;
        const carry = {
          pointsByDate: state.pointsByDate || {},
          activeStrengths: state.activeStrengths || [],
          creativeIdeaIndex: state.creativeIdeaIndex || 0,
          socialSkillIndex: state.socialSkillIndex || 0,
          ticktickImportProjectIds: Array.isArray(state.ticktickImportProjectIds)
            ? [...state.ticktickImportProjectIds]
            : null,
          calendarEvents: (state.calendarEvents || []).map(normalizeCalendarEvent).filter(event => event.date >= dateKey())
        };
        state = { ...defaultState(), ...carry };
        saveState();
      }

      function completedTasks() {
        return state.tasks.filter(task => task.done);
      }

      function dailyPoints() {
        return completedTasks().reduce((sum, task) => sum + Number(task.points || 0), 0);
      }

      function saveDailyPoints() {
        state.pointsByDate[state.date] = dailyPoints();
        saveState();
      }

      function weekPoints() {
        const start = new Date();
        const day = start.getDay();
        start.setDate(start.getDate() + (day === 0 ? -6 : 1 - day));
        start.setHours(12, 0, 0, 0);
        let total = 0;
        for (let i = 0; i < 7; i += 1) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          total += Number(state.pointsByDate[dateKey(date)] || 0);
        }
        return total;
      }

      function findTask(id) {
        return state.tasks.find(task => String(task.id) === String(id));
      }

      function nextTask() {
        return state.tasks.find(task => !task.done) || null;
      }

      function taskGuide(task) {
        const title = String(task.title || "");
        if (/غسيل|ملابس|نشافة/.test(title)) {
          return {
            intro: "نرتب الغسيل خطوة خطوة حتى تبقى المهمة قصيرة وواضحة.",
            steps: ["اجمع الملابس المطلوبة في سلة واحدة.", "افصل الأبيض عن الملوّن إذا طلب منك ذلك.", "ضع الملابس في المكان الصحيح حسب تعليمات الأهل.", "رتّب المكان وأخبر أحد الوالدين عند الانتهاء."],
            tip: "اسأل قبل تشغيل جهاز لم تتعلم استخدامه."
          };
        }
        if (/زبالة|نفايات/.test(title)) {
          return {
            intro: "هذه مسؤولية مهمة تساعد العائلة.",
            steps: ["أغلق الكيس جيداً.", "تأكد أن الطريق آمن.", "خذ المفتاح إن احتجت.", "ضع الكيس في الحاوية ثم عد مباشرة."],
            tip: "لا تحمل كيساً ثقيلاً جداً وحدك."
          };
        }
        return GUIDES[task.type] || GUIDES.other;
      }

      function taskMeta(task) {
        const base = `${TASK_TEMPLATES[task.type]?.label || "مهمة"} · +${task.points} نقطة`;
        return task.ticktickImported ? `${base} · TickTick` : base;
      }

      function updateHeader() {
        document.getElementById("headerDate").textContent = `اليوم ${formatDate()} · خطوة واحدة واضحة في كل مرة.`;
      }

      function setScreen(screen) {
        activeScreen = screen;
        document.querySelectorAll(".screen").forEach(el => el.classList.toggle("active", el.id === `screen${screen[0].toUpperCase()}${screen.slice(1)}`));
        document.querySelectorAll("[data-screen]").forEach(button => {
          button.setAttribute("aria-current", button.dataset.screen === screen ? "page" : "false");
        });
        if (screen !== "now") stopVisualTimer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderAll() {
        carryForward();
        updateHeader();
        renderNow();
        renderPlan();
        renderCreative();
        renderProgress();
        renderTickTickStatus();
        setScreen(activeScreen);
      }

      function renderNow() {
        const root = document.getElementById("screenNow");
        const task = nextTask();
        const complete = completedTasks().length;
        const total = state.tasks.length;
        const progress = total ? Math.round((complete / total) * 100) : 0;
        const active = state.activeTaskId ? findTask(state.activeTaskId) : null;

        if (!state.profile.ready) {
          root.innerHTML = `
            <article class="intro-card">
              <span class="eyebrow">ابدأ بهدوء</span>
              <h2 id="nowTitle">ما الذي نفعله الآن؟ نبني خطة قصيرة لليوم.</h2>
              <p>ثلاثة اختيارات بسيطة فقط، ثم تظهر لك مهمة واحدة واضحة لتبدأ بها. لا يوجد ضغط ولا خصم نقاط.</p>
              <button class="btn btn-primary" type="button" data-action="open-wizard">بناء خطة اليوم</button>
            </article>
            <article class="card quiet-card" style="margin-top:15px">
              <h3>تذكير هادئ للصلاة</h3>
              <p>قبل الصلاة: أوقف الشاشة قليلاً، توضأ إن احتجت، وخذ نفسين هادئين.</p>
            </article>`;
          return;
        }

        if (!task) {
          root.innerHTML = `
            <article class="now-card">
              <div class="now-content">
                <span class="eyebrow">اكتمل اليوم</span>
                <h2 id="nowTitle" class="now-title">أحسنت يا يَمان. أنهيت مهامك الرئيسية.</h2>
                <p class="now-step">الآن اختر راحة حقيقية، أو افتح “تقدمي” واكتب شيئاً واحداً تفخر به.</p>
                <div class="action-row">
                  <button class="btn btn-primary" type="button" data-screen="progress">فتح تقدمي</button>
                  <button class="btn btn-secondary" type="button" data-action="open-plan">عرض الخطة</button>
                </div>
              </div>
            </article>
            ${renderSummary(progress, complete, total)}
            <article class="card quiet-card">
              <h3>وقت هادئ</h3><p>أنت لا تحتاج أن تضيف مهمة جديدة الآن. الراحة جزء مهم من اليوم.</p>
            </article>`;
          return;
        }

        const guide = taskGuide(task);
        const isActive = active && active.id === task.id;
        const mainCard = isActive
          ? `
            <article class="card timer-card">
              <span class="eyebrow">أنت تعمل الآن على</span>
              <h2 id="nowTitle">${escapeHTML(task.title)}</h2>
              <div class="timer-value" id="timerValue">${formatTime(currentTimerRemaining())}</div>

      function formatEventDate(value) {
        try {
          return new Intl.DateTimeFormat("ar", { weekday: "short", day: "numeric", month: "short" }).format(new Date(`${value}T12:00:00`));

          return value;
