<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Hero — مساعد يَمان</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="hero-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🦸</div>
        <div>
          <h1>Hero — المساعد الشخصي ليَمان</h1>
          <p id="headerDate">نرتب اليوم بهدوء وخطوة خطوة.</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-light" id="startDayBtn" type="button">ابدأ أسئلة الصباح</button>
        <button class="btn btn-outline" id="resetDayBtn" type="button">بداية يوم جديد</button>
      </div>
    </header>

    <nav class="tabs" aria-label="التنقل بين أقسام التطبيق">
      <button class="tab active" data-view-target="todayView" type="button">اليوم</button>
      <button class="tab" data-view-target="creativeView" type="button">الإبداع وYouTube</button>
      <button class="tab" data-view-target="weeklyView" type="button">الأسبوع ونقاط القوة</button>
    </nav>

    <section class="view active" id="todayView"></section>
    <section class="view" id="creativeView"></section>
    <section class="view" id="weeklyView"></section>

    <footer class="footer">
      هذا التطبيق يحفظ المعلومات على هذا الجهاز فقط. لا يطلب نشر أي معلومات شخصية عن يَمان.
    </footer>
  </main>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
