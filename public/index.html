<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" id="themeColor" />
  <title>Hero Family — يَمان وجودي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f7f6ff;--surface:#fff;--soft:#f1efff;--line:#dfdbf4;--ink:#1f2340;--muted:#60647e;--brand:#5b5bd6;--brand-strong:#4137bc;--brand-soft:#ebeaff;--success:#16856a;--success-soft:#e8f8f3;--warning-soft:#fff4d7;--danger:#b63258;--shadow:0 14px 38px rgba(58,49,150,.10);--header-a:#2e286f;--header-b:#5147cc;--header-c:#6d5ef0;--glow:rgba(120,96,240,.12);--top-bg:#f1efff;--radius:22px;--tap:50px}
    body[data-area="judy"]{--bg:#fff7fa;--surface:#fff;--soft:#fff0f5;--line:#f0d7e1;--ink:#3a1f2d;--muted:#765566;--brand:#c74478;--brand-strong:#9e2859;--brand-soft:#ffe6ef;--success:#16856a;--success-soft:#e8f8f3;--warning-soft:#fff2e5;--danger:#b63258;--shadow:0 14px 38px rgba(174,51,103,.12);--header-a:#7c1f54;--header-b:#bd3f74;--header-c:#ef7f9f;--glow:rgba(239,127,159,.18);--top-bg:#fff0f5}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:radial-gradient(circle at top left,var(--glow),transparent 30rem),linear-gradient(180deg,var(--top-bg),var(--bg) 350px);font-family:Tajawal,"Noto Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(91,91,214,.38);outline-offset:2px}
    .app{width:min(100% - 24px,1000px);margin:0 auto;padding:16px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--header-a),var(--header-b) 57%,var(--header-c));box-shadow:0 18px 38px rgba(64,50,192,.22)}.brand{display:flex;gap:12px;align-items:center;min-width:0}.brand-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:17px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:1.15rem;font-weight:800}.brand h1{margin:0;font-size:clamp(1.18rem,4vw,1.55rem);line-height:1.25;font-weight:800}.brand p{margin:3px 0 0;color:#e6e5ff;font-size:.86rem}.date-chip{flex:0 0 auto;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.10);color:#fff;font-size:.79rem;font-weight:700}
    .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;padding:7px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.9);box-shadow:0 10px 22px rgba(49,46,129,.07)}.area{min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:800}.area.active{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(91,91,214,.22)}.area small{display:block;margin-top:1px;font-size:.73rem;font-weight:500;opacity:.86}
    .stack{display:grid;gap:16px}.grid2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:0 6px 18px rgba(31,35,64,.04)}.card.soft{background:linear-gradient(145deg,#f8f7ff,#fff);border-color:#d9d3ff}.card.success{background:linear-gradient(145deg,#f0fbf7,#fff);border-color:#c6eadf}.card.warning{background:linear-gradient(145deg,#fffaf0,#fff);border-color:#f0dcaa}.card h2{margin:0;font-size:clamp(1.35rem,4.8vw,1.75rem);line-height:1.35;font-weight:800}.card h3{margin:0;font-size:1.05rem;line-height:1.45;font-weight:800}.eyebrow{display:block;margin-bottom:6px;color:var(--brand-strong);font-size:.78rem;font-weight:800}.muted{color:var(--muted)}.small{font-size:.88rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:10px 16px;border:1px solid transparent;border-radius:16px;font-weight:800;text-align:center;transition:transform .15s ease,background .15s ease}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn-primary{color:#fff;background:var(--brand);box-shadow:0 10px 20px rgba(91,91,214,.25)}.btn-primary:hover:not(:disabled){background:var(--brand-strong)}.btn-soft{color:var(--brand-strong);background:var(--brand-soft)}.btn-success{color:#fff;background:var(--success);box-shadow:0 8px 16px rgba(22,133,106,.18)}.btn-secondary{color:var(--ink);background:#fff;border-color:#c8cce0}.btn-danger{color:var(--danger);background:#fff;border-color:#e8bdc8}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .metric{padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}.metric strong{display:block;color:var(--ink);font-size:1.45rem;line-height:1.1;font-weight:800}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:.79rem}.metric.yaman{border-color:#d6d0ff;background:linear-gradient(145deg,#efedff,#fff)}.metric.judy{border-color:#f4d7b9;background:linear-gradient(145deg,#fff6ed,#fff)}
    .next{position:relative;overflow:hidden;padding:24px;border:1px solid #d4cffc;border-radius:24px;background:linear-gradient(145deg,#fff,#efedff);box-shadow:var(--shadow)}.next::after{content:"";position:absolute;left:-60px;bottom:-60px;width:155px;height:155px;border:20px solid rgba(91,91,214,.08);border-radius:50%}.next>*{position:relative;z-index:1}.task-title{margin:12px 0 7px;font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.35;font-weight:800}.pill{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);font-size:.76rem;font-weight:800}.pill.done{background:var(--success-soft);color:#076057}.pill.judy{background:#fff0df;color:#a34c00}
    body[data-area="judy"] .next{border-color:#efb7ca;background:linear-gradient(145deg,#fff,#fff0f5)}
    body[data-area="judy"] .next::after{border-color:rgba(199,68,120,.10)}
    body[data-area="judy"] .card.soft{border-color:#f0cbd8;background:linear-gradient(145deg,#fff6f9,#fff)}
    body[data-area="judy"] .task-index{border-color:#efbfd1;color:var(--brand-strong)}
    body[data-area="judy"] .event-time{color:var(--brand-strong)}
    body[data-area="judy"] .notice.info{background:var(--brand-soft);border-color:#f1cada;color:var(--brand-strong)}
    body[data-area="judy"] .brand-mark{background:rgba(255,255,255,.18)}
    .ai-status{padding:14px 16px;border-radius:18px;border:1px solid #d7d1ff;background:linear-gradient(145deg,#f3f1ff,#fff)}
    .ai-status.ready{border-color:#c5e8db;background:linear-gradient(145deg,#effbf7,#fff)}
    .ai-status h3{margin:0 0 4px}.ai-status p{margin:0}.ai-status strong{color:var(--brand-strong)}

    .list{padding:0;overflow:hidden}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px 14px;border-bottom:1px solid var(--line)}ul{margin:0;padding:0;list-style:none}.task-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line)}.task-row:last-child,.event-row:last-child{border-bottom:0}.task-row.done{background:#f1fbf6}.task-index{display:grid;place-items:center;width:32px;height:32px;border:1px solid #c8c6ed;border-radius:50%;background:#fff;color:var(--brand-strong);font-size:.84rem;font-weight:800}.task-row.done .task-index{color:#fff;background:var(--success);border-color:var(--success)}.task-copy{min-width:0}.task-copy h3{font-size:1rem}.task-copy p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.task-actions{display:flex;gap:7px;align-items:center}.mini{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid #cbd0e4;border-radius:13px;background:#fff;color:var(--brand-strong);font-weight:800}.mini.success{color:#fff;background:var(--success);border-color:var(--success)}.mini.danger{color:var(--danger);border-color:#efc5ce}.event-row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}.event-time{font-size:.84rem;font-weight:800;color:var(--brand-strong)}.event-copy strong,.event-copy span{display:block}.event-copy span{margin-top:2px;color:var(--muted);font-size:.8rem}.empty{padding:28px 18px;color:var(--muted);text-align:center}.empty p{margin:6px 0 0}.notice{padding:13px 15px;border-radius:16px;background:var(--warning-soft);color:#765200;border:1px solid #f3dfad;font-size:.9rem}.notice.info{background:var(--brand-soft);border-color:#d9d3ff;color:var(--brand-strong)}
    .form{display:grid;gap:13px}label{display:grid;gap:7px;color:var(--ink);font-weight:800}input,textarea,select{width:100%;min-height:var(--tap);padding:11px 12px;border:1px solid #cdd0e1;border-radius:14px;background:#fff;color:var(--ink)}textarea{min-height:96px;resize:vertical}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .modal-root:empty{display:none}.modal-root{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:14px;background:rgba(21,18,48,.58)}.modal{position:relative;width:min(100%,650px);max-height:calc(100vh - 28px);overflow:auto;padding:24px;border-radius:24px;background:#fff;box-shadow:0 28px 84px rgba(16,14,38,.34)}.close{position:absolute;top:12px;left:12px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-size:1.25rem}.modal-head{padding-left:48px}.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.idea{padding:14px;border:1px solid #dcd7fb;border-radius:17px;background:#faf9ff}.idea+.idea{margin-top:10px}.idea p{margin:6px 0 9px;color:var(--muted)}.idea-step{padding:10px 12px;border-right:4px solid var(--brand);border-radius:12px;background:#f0efff;color:#3f3a80}.toast{position:fixed;left:16px;bottom:18px;z-index:50;max-width:min(420px,calc(100% - 32px));padding:13px 15px;border-radius:15px;background:#282250;color:#fff;box-shadow:var(--shadow);transform:translateY(150%);opacity:0;transition:.22s ease;font-weight:700}.toast.show{transform:translateY(0);opacity:1}.footer{margin:22px 0 0;color:var(--muted);text-align:center;font-size:.8rem}
    @media(min-width:760px){.child-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:16px;align-items:start}}@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.date-chip{display:none}}@media(max-width:520px){.app{width:min(100% - 18px,1000px);padding-top:9px}.topbar{border-radius:21px;padding:15px}.brand p{display:none}.areas{gap:4px;padding:5px}.area{font-size:.82rem}.task-row{grid-template-columns:31px minmax(0,1fr) auto;padding:13px;gap:8px}.mini{width:37px;height:37px}.event-row{grid-template-columns:48px minmax(0,1fr);padding:13px}.event-row .mini{grid-column:2;justify-self:end}.modal{padding:22px 17px 17px;border-radius:20px}.two{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark" id="mark" aria-hidden="true">H</div><div><h1 id="title">Hero Family</h1><p id="subtitle">مساحة هادئة لتنظيم مهام العائلة.</p></div></div><div class="date-chip" id="dateChip"></div></header>
    <nav class="areas" aria-label="اختيار المنطقة"><button class="area" type="button" data-area="parent">الوالدان<small>إدارة العائلة</small></button><button class="area active" type="button" data-area="yaman">يَمان<small>خطتي وابداعي</small></button><button class="area" type="button" data-area="judy">جودي<small>مهامي اليوم</small></button></nav>
    <main id="root" class="stack" aria-live="polite"></main>
    <p class="footer">مهام العائلة محفوظة في قاعدة بيانات المشروع. TickTick اتصال اختياري للأهل.</p>
  </div>
  <div class="modal-root" id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{"use strict";
const AREA_KEY="hero-family-current-area",LIST_KEY="hero-family-ticktick-projects";
const TYPES={study:{label:"دراسة",points:15},home:{label:"مسؤولية منزلية",points:10},creative:{label:"إبداع",points:15},movement:{label:"حركة",points:10},social:{label:"مهارة اجتماعية",points:10},routine:{label:"روتين",points:5},other:{label:"مهمة أخرى",points:5}};
const PEOPLE={yaman:{name:"يَمان",icon:"Y",subtitle:"خطوة واحدة واضحة في كل مرة."},judy:{name:"جودي",icon:"J",subtitle:"نختار مهمة صغيرة وننجزها بهدوء."}};
let area=localStorage.getItem(AREA_KEY)||"yaman",family={databaseConfigured:false,parentPinConfigured:false,parentAuthenticated:false},tick={configured:false,connected:false},ai={configured:false,mode:"local",model:null},child={yaman:null,judy:null},dashboard=null,importSession=null,listSession=null,lastIdeas=[];
const key=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
const arDate=()=>new Intl.DateTimeFormat("ar",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
async function api(url,opts={}){const r=await fetch(url,{...opts,credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json",...(opts.headers||{})}});const t=await r.text();let b=null;try{b=t?JSON.parse(t):null}catch{}if(!r.ok){const e=new Error(b?.error||"تعذر تنفيذ العملية الآن.");e.status=r.status;throw e}return b}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3400)}
function close(){document.getElementById("modalRoot").innerHTML=""}function modal(html){document.getElementById("modalRoot").innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}<button class="close" type="button" data-action="close" aria-label="إغلاق">×</button></section>`;const e=document.querySelector("#modalRoot input,#modalRoot button,#modalRoot select");if(e)setTimeout(()=>e.focus(),0)}
function selectedLists(){try{const x=JSON.parse(localStorage.getItem(LIST_KEY)||"null");return Array.isArray(x)?x.map(String).filter(Boolean):[]}catch{return[]}}function saveLists(ids){localStorage.setItem(LIST_KEY,JSON.stringify([...new Set(ids.map(String))]))}
async function load(){const [f,t,a]=await Promise.all([api("/api/family/status").catch(()=>null),api("/api/ticktick/status").catch(()=>null),api("/api/ai/status").catch(()=>null)]);if(f)family=f;if(t)tick=t;if(a)ai=a;child.yaman=await api(`/api/family/child/yaman?date=${key()}`);child.judy=await api(`/api/family/child/judy?date=${key()}`);dashboard=family.parentAuthenticated?await api(`/api/family/dashboard?date=${key()}`):null}
function top(){document.body.dataset.area=area;const theme=document.getElementById("themeColor");if(theme)theme.setAttribute("content",area==="judy"?"#c74478":"#5b5bd6");document.getElementById("dateChip").textContent=arDate();const mark=document.getElementById("mark"),title=document.getElementById("title"),sub=document.getElementById("subtitle");if(area==="parent"){mark.textContent="⌂";title.textContent="Hero Family";sub.textContent="منطقة الوالدين: تنظيم واضح وعدل بين الجميع."}else{mark.textContent=PEOPLE[area].icon;title.textContent=`Hero — ${PEOPLE[area].name}`;sub.textContent=PEOPLE[area].subtitle}document.querySelectorAll("[data-area]").forEach(b=>b.classList.toggle("active",b.dataset.area===area))}
function typeLabel(t){return TYPES[t.type]?.label||"مهمة"}
function tasksRows(tasks,member,parent=false){if(!tasks.length)return `<li class="empty"><h3>لا توجد مهام لهذا اليوم</h3><p>${parent?"يمكنك إضافة مهمة واضحة لكل طفل.":"خذ وقتاً للراحة أو اطلب من أحد الوالدين مهمة صغيرة."}</p></li>`;return tasks.map((t,i)=>`<li class="task-row ${t.done?"done":""}"><span class="task-index">${t.done?"✓":i+1}</span><div class="task-copy"><h3>${esc(t.title)}</h3><p>${esc(typeLabel(t))} · ${t.points} نقطة${t.note?` · ${esc(t.note)}`:""}${t.source==="ticktick"?" · TickTick":""}</p></div><div class="task-actions">${t.done?`<span class="pill done">تم</span>`:`<button class="mini success" type="button" data-action="complete" data-id="${t.id}" data-member="${member}" aria-label="أنجزتها">✓</button>`}${parent?`<button class="mini danger" type="button" data-action="delete-task" data-id="${t.id}" aria-label="حذف المهمة">×</button>`:""}</div></li>`).join("")}
function eventRows(events,parent=false){if(!events.length)return `<li class="empty"><h3>لا توجد مواعيد اليوم</h3><p>الموعد القادم سيظهر هنا بوضوح.</p></li>`;return events.map(e=>`<li class="event-row"><span class="event-time">${esc(e.time||"—")}</span><div class="event-copy"><strong>${esc(e.title)}</strong><span>${esc(e.note||"موعد في خطة اليوم")}</span></div>${parent?`<button class="mini danger" type="button" data-action="delete-event" data-id="${e.id}" aria-label="حذف الموعد">×</button>`:""}</li>`).join("")}
function childView(member){const d=child[member];if(!d)return `<article class="card soft"><span class="eyebrow">جاري التحميل</span><h2>نجهز خطة اليوم…</h2></article>`;const open=d.tasks.filter(t=>!t.done),done=d.tasks.filter(t=>t.done),next=open[0],points=done.reduce((s,t)=>s+Number(t.points||0),0),pct=d.tasks.length?Math.round(done.length/d.tasks.length*100):0;const primary=next?`<article class="next"><span class="eyebrow">المهمة التالية</span><span class="pill ${member==="judy"?"judy":""}">${esc(typeLabel(next))}</span><h2 class="task-title">${esc(next.title)}</h2><p class="muted">${next.note?esc(next.note):"ابدأ بخمس دقائق فقط، ثم قرر إن كنت ستكمل."}</p><div class="btn-row"><button class="btn btn-success" type="button" data-action="complete" data-id="${next.id}" data-member="${member}">أنجزتها</button></div></article>`:`<article class="next"><span class="eyebrow">اليوم هادئ</span><h2 class="task-title">أحسنت. أنهيت مهامك لليوم.</h2><p class="muted">الراحة جزء مهم من الخطة. يمكنك الآن اختيار نشاط تحبه أو قضاء وقت مع العائلة.</p></article>`;const ideas=member==="yaman"?`<article class="card soft"><span class="eyebrow">فكرتي مع Hero</span><h3>اكتب فكرة صغيرة للدبلجة أو الرسوم</h3><p class="muted small">سنحوّلها إلى ثلاث أفكار آمنة مع خطوة أولى واضحة.</p><form class="form" id="ideaForm" style="margin-top:12px"><textarea id="ideaText" maxlength="600" placeholder="مثال: روبوت صغير يحاول أن يقلد أصوات الحيوانات"></textarea><button class="btn btn-primary" type="submit">اقترح لي أفكاراً</button></form><div id="ideasOut"></div></article>`:`<article class="card warning"><span class="eyebrow">شيء جميل اليوم</span><h3>اختاري نشاطاً تحبينه بعد المهام</h3><p class="muted">رسم، قصة قصيرة، لعبة هادئة أو مساعدة في شيء بسيط بالبيت.</p></article>`;return `<div class="child-layout"><div class="stack">${primary}<article class="card list"><div class="list-head"><div><span class="eyebrow">خطة اليوم</span><h3>مهام ${PEOPLE[member].name}</h3></div><span class="pill">${done.length}/${d.tasks.length||0} مكتمل</span></div><ul>${tasksRows(d.tasks,member)}</ul></article>${ideas}</div><div class="stack"><article class="card success"><span class="eyebrow">تقدمي اليوم</span><div class="grid3"><div class="metric"><strong>${points}</strong><span>نقاط اليوم</span></div><div class="metric"><strong>${pct}%</strong><span>تقدم اليوم</span></div><div class="metric"><strong>${open.length}</strong><span>مهام متبقية</span></div></div></article><article class="card list"><div class="list-head"><div><span class="eyebrow">مواعيدي</span><h3>ماذا لدي اليوم؟</h3></div></div><ul>${eventRows(d.events)}</ul></article><article class="card soft"><span class="eyebrow">تذكير هادئ</span><h3>التركيز على شيء واحد يكفي.</h3><p class="muted">لا نحتاج أن ننجز كل شيء دفعة واحدة. نبدأ، نرتاح، ثم نعود.</p></article></div></div>`}
function parentLogin(){if(!family.databaseConfigured)return `<article class="card warning"><span class="eyebrow">خطوة مطلوبة</span><h2>قاعدة بيانات العائلة غير مفعّلة بعد.</h2><p class="muted">في Railway أضف متغير <strong>DATABASE_URL</strong> من خدمة PostgreSQL إلى خدمة التطبيق، ثم أعد النشر.</p></article>`;if(!family.parentPinConfigured)return `<article class="card warning"><span class="eyebrow">خطوة مطلوبة</span><h2>أضف رمز الوالدين أولاً.</h2><p class="muted">في Railway Variables أضف <strong>PARENT_PIN</strong> واختر رمزاً من 4 أرقام أو أكثر. الرمز لا يكتب داخل الكود.</p></article>`;return `<article class="card soft"><span class="eyebrow">منطقة الوالدين</span><h2>إدارة مهام يَمان وجودي</h2><p class="muted">هذا الجزء مخصص لإضافة المهام والمواعيد ومتابعة التقدم. أدخل رمز الوالدين.</p><form class="form" id="loginForm" style="margin-top:16px"><label>رمز الوالدين<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" required placeholder="••••"></label><button class="btn btn-primary" type="submit">فتح منطقة الوالدين</button></form></article>`}
function parentView(){if(!family.parentAuthenticated)return parentLogin();if(!dashboard)return `<article class="card soft"><span class="eyebrow">جاري التحميل</span><h2>نجهّز لوحة العائلة…</h2></article>`;const y=dashboard.summary.yaman,j=dashboard.summary.judy;const aiCard=ai.configured?`<article class="ai-status ready"><span class="eyebrow">مساعد Hero AI</span><h3>متصل بـ OpenAI API</h3><p class="muted small">اقتراحات يَمان الإبداعية تعمل عبر الخادم. المفتاح لا يظهر في التطبيق.</p></article>`:`<article class="ai-status"><span class="eyebrow">مساعد Hero AI</span><h3>وضع الاقتراحات الأساسية</h3><p class="muted small">أضف OPENAI_API_KEY في Railway لتفعيل اقتراحات AI من حساب OpenAI الخاص بك.</p></article>`;return `<div class="stack"><article class="card soft"><span class="eyebrow">لوحة العائلة</span><h2>نظرة سريعة على اليوم</h2><p class="muted">مهام قليلة وواضحة، مواعيد ظاهرة، وتشجيع على الجهد لا على الضغط.</p><div class="grid2" style="margin-top:14px"><div class="metric yaman"><strong>${y.done}/${y.total}</strong><span>يَمان — مهام مكتملة</span><p class="small muted" style="margin:7px 0 0">المتبقي: ${y.open}</p></div><div class="metric judy"><strong>${j.done}/${j.total}</strong><span>جودي — مهام مكتملة</span><p class="small muted" style="margin:7px 0 0">المتبقي: ${j.open}</p></div></div><div class="btn-row"><button class="btn btn-primary" type="button" data-action="add-task">إضافة مهمة</button><button class="btn btn-soft" type="button" data-action="add-event">إضافة موعد</button><button class="btn btn-secondary" type="button" data-action="import">استيراد TickTick</button><button class="btn btn-secondary" type="button" data-action="lists">قوائم TickTick</button><button class="btn btn-danger" type="button" data-action="logout">خروج</button></div></article>${aiCard}<div class="grid2"><article class="card list"><div class="list-head"><div><span class="eyebrow">يَمان</span><h3>مهام اليوم</h3></div><button class="btn btn-soft" type="button" data-area="yaman">فتح منطقته</button></div><ul>${tasksRows(child.yaman?.tasks||[],"yaman",true)}</ul></article><article class="card list"><div class="list-head"><div><span class="eyebrow">جودي</span><h3>مهام اليوم</h3></div><button class="btn btn-soft" type="button" data-area="judy">فتح منطقتها</button></div><ul>${tasksRows(child.judy?.tasks||[],"judy",true)}</ul></article></div><article class="card list"><div class="list-head"><div><span class="eyebrow">مواعيد قادمة</span><h3>لוח המשפחה</h3></div><span class="pill">${dashboard.events.length}</span></div><ul>${eventRows(dashboard.events,true)}</ul></article><article class="notice info">الاستيراد من TickTick يعمل من المتصفح الذي تم فيه ربط TickTick. المهام العائلية نفسها تُحفظ في قاعدة البيانات وتظهر في مناطق يَمان وجودي.</article></div>`}
function render(){top();document.getElementById("root").innerHTML=area==="parent"?parentView():childView(area)}
async function refresh(){try{await load()}catch(e){toast(e.message||"تعذر تحديث البيانات.")}render()}
function setArea(a){area=a;localStorage.setItem(AREA_KEY,a);render();window.scrollTo({top:0,behavior:"smooth"})}
function addTaskModal(){modal(`<div class="modal-head"><span class="eyebrow">مهمة واضحة</span><h2>إضافة مهمة لأحد الأطفال</h2><p class="muted">اكتب مهمة يمكن بدءها فوراً، مع تاريخ واضح.</p></div><form class="form" id="taskForm" style="margin-top:18px"><label>لمن هذه المهمة؟<select id="taskMember"><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>اسم المهمة<input id="taskTitle" maxlength="160" required placeholder="مثال: حل 3 أسئلة رياضيات"></label><div class="two"><label>نوع المهمة<select id="taskType">${Object.entries(TYPES).map(([k,x])=>`<option value="${k}">${x.label} · ${x.points} نقطة</option>`).join("")}</select></label><label>التاريخ<input id="taskDate" type="date" value="${key()}" required></label></div><label>ملاحظة قصيرة (اختياري)<input id="taskNote" maxlength="400" placeholder="مثال: ابدأ بالسؤال الأسهل"></label><div class="modal-foot"><button class="btn btn-secondary" type="button" data-action="close">إلغاء</button><button class="btn btn-primary" type="submit">حفظ المهمة</button></div></form>`)}
function addEventModal(){modal(`<div class="modal-head"><span class="eyebrow">موعد جديد</span><h2>إضافة موعد للعائلة</h2><p class="muted">يمكن أن يظهر ليَمان، لجودي، أو للجميع.</p></div><form class="form" id="eventForm" style="margin-top:18px"><label>لمن يظهر الموعد؟<select id="eventMember"><option value="family">كل العائلة</option><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>اسم الموعد<input id="eventTitle" maxlength="140" required placeholder="مثال: رياضة / علاج / زيارة عائلية"></label><div class="two"><label>التاريخ<input id="eventDate" type="date" value="${key()}" required></label><label>الوقت (اختياري)<input id="eventTime" type="time"></label></div><label>ملاحظة (اختياري)<input id="eventNote" maxlength="350" placeholder="مثال: خذ زجاجة ماء"></label><div class="modal-foot"><button class="btn btn-secondary" type="button" data-action="close">إلغاء</button><button class="btn btn-primary" type="submit">حفظ الموعد</button></div></form>`)}
function listsModal(){if(!tick.connected){toast("اربط TickTick أولاً من نفس الدومين عبر /auth/ticktick.");return}modal(`<div class="modal-head"><span class="eyebrow">TickTick</span><h2>جاري تحميل القوائم…</h2></div>`);api("/api/ticktick/projects").then(r=>{const p=r.projects||[],s=selectedLists();listSession={projects:p,selected:new Set(s.length?s:p.map(x=>String(x.id)))};drawLists()}).catch(e=>{close();toast(e.message)})}
function drawLists(){const s=listSession;if(!s)return;const all=s.projects.length&&s.projects.every(p=>s.selected.has(String(p.id)));modal(`<div class="modal-head"><span class="eyebrow">قوائم TickTick</span><h2>اختر القوائم التي نقرأ منها</h2><p class="muted">لن تظهر في الاستيراد اليومي إلا مهام القوائم المحددة.</p></div><div class="btn-row" style="margin-top:14px"><button class="btn btn-soft" type="button" data-action="all-lists">${all?"إلغاء تحديد الكل":"تحديد الكل"}</button></div><div class="stack" style="margin-top:14px">${s.projects.map(p=>`<button class="btn btn-secondary" type="button" data-action="toggle-list" data-id="${p.id}" style="justify-content:space-between">${esc(p.name)}<span>${s.selected.has(String(p.id))?"✓":""}</span></button>`).join("")||`<div class="empty">لا توجد قوائم نشطة في TickTick.</div>`}</div><div class="modal-foot"><button class="btn btn-secondary" type="button" data-action="close">إلغاء</button><button class="btn btn-primary" type="button" data-action="save-lists">حفظ الاختيار</button></div>`)}
function importModal(){if(!tick.connected){toast("اربط TickTick أولاً من نفس الدومين عبر /auth/ticktick.");return}modal(`<div class="modal-head"><span class="eyebrow">استيراد TickTick</span><h2>جاري تحميل مهام اليوم…</h2></div>`);const ids=selectedLists(),q=ids.length?`?projectIds=${encodeURIComponent(ids.join(","))}`:"";api(`/api/ticktick/today-tasks${q}`).then(r=>{importSession={tasks:r.tasks||[],selected:new Set()};drawImport()}).catch(e=>{close();toast(e.message)})}
function drawImport(){const s=importSession;if(!s)return;modal(`<div class="modal-head"><span class="eyebrow">استيراد اليوم</span><h2>اختر مهمة ثم عيّنها</h2><p class="muted">تظهر فقط المهام المفتوحة التي موعدها اليوم.</p></div><div class="stack" style="margin-top:14px">${s.tasks.length?s.tasks.map(t=>`<button class="btn btn-secondary" type="button" data-action="toggle-import" data-id="${t.projectId}:${t.id}" style="justify-content:space-between;text-align:right"><span>${esc(t.title)}<small style="display:block;color:var(--muted);margin-top:2px">${esc(t.projectName)}</small></span><span>${s.selected.has(`${t.projectId}:${t.id}`)?"✓":""}</span></button>`).join(""):`<div class="empty"><h3>لا توجد مهام TickTick لليوم.</h3><p>أعطِ المهمة تاريخ اليوم ثم حاول مرة أخرى.</p></div>`}</div><div class="modal-foot"><button class="btn btn-secondary" type="button" data-action="close">إغلاق</button><button class="btn btn-primary" type="button" data-action="assign-import" ${s.selected.size?"":"disabled"}>تعيين المهام المختارة</button></div>`)}
function assignModal(){const n=importSession?.selected.size||0;if(!n)return;modal(`<div class="modal-head"><span class="eyebrow">استيراد TickTick</span><h2>لمن نضيف ${n} مهمة؟</h2><p class="muted">ستضاف المهام المختارة إلى خطة اليوم في منطقة الطفل.</p></div><form class="form" id="assignForm" style="margin-top:17px"><label>اختر الطفل<select id="importMember"><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><div class="modal-foot"><button class="btn btn-secondary" type="button" data-action="import">رجوع</button><button class="btn btn-primary" type="submit">إضافة إلى الخطة</button></div></form>`)}
function ideasOut(ideas){const e=document.getElementById("ideasOut");if(!e)return;lastIdeas=ideas;e.innerHTML=`<div class="stack" style="margin-top:14px">${ideas.map((x,i)=>`<article class="idea"><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="idea-step"><strong>ابدأ بهذا فقط:</strong> ${esc(x.firstStep)}</div><div class="btn-row"><button class="btn btn-soft" type="button" data-action="idea-task" data-index="${i}">أضف خطوة إلى خطتي</button></div></article>`).join("")}</div>`}
async function ideaRequest(){const input=document.getElementById("ideaText"),idea=input?.value.trim()||"";if(idea.length<4){toast("اكتب فكرة من عدة كلمات أولاً.");return}const b=document.querySelector("#ideaForm button[type='submit']");if(b){b.disabled=true;b.textContent="جارٍ التفكير…"}try{const r=await api("/api/ideas",{method:"POST",body:JSON.stringify({idea})});ideasOut(r.ideas||[])}catch(e){toast(e.message)}finally{if(b){b.disabled=false;b.textContent="اقترح لي أفكاراً"}}}
async function complete(id,member){try{await api(`/api/family/tasks/${encodeURIComponent(id)}/complete`,{method:"PATCH",body:JSON.stringify({assignee:member})});toast("أحسنت. تم تسجيل الإنجاز.");await refresh()}catch(e){toast(e.message)}}async function delTask(id){if(!confirm("حذف هذه المهمة؟"))return;try{await api(`/api/family/tasks/${encodeURIComponent(id)}`,{method:"DELETE"});toast("تم حذف المهمة.");await refresh()}catch(e){toast(e.message)}}async function delEvent(id){if(!confirm("حذف هذا الموعد؟"))return;try{await api(`/api/family/events/${encodeURIComponent(id)}`,{method:"DELETE"});toast("تم حذف الموعد.");await refresh()}catch(e){toast(e.message)}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-action],[data-area]");if(!b)return;if(b.dataset.area){setArea(b.dataset.area);return}const a=b.dataset.action;if(a==="close")close();if(a==="add-task")addTaskModal();if(a==="add-event")addEventModal();if(a==="complete")complete(b.dataset.id,b.dataset.member);if(a==="delete-task")delTask(b.dataset.id);if(a==="delete-event")delEvent(b.dataset.id);if(a==="logout"){try{await api("/api/family/parent/logout",{method:"POST"});toast("تم قفل منطقة الوالدين.");await refresh()}catch(x){toast(x.message)}}if(a==="lists")listsModal();if(a==="import")importModal();if(a==="toggle-list"){const id=String(b.dataset.id);listSession.selected.has(id)?listSession.selected.delete(id):listSession.selected.add(id);drawLists()}if(a==="all-lists"){const ids=listSession.projects.map(p=>String(p.id)),all=ids.every(id=>listSession.selected.has(id));listSession.selected=new Set(all?[]:ids);drawLists()}if(a==="save-lists"){saveLists([...listSession.selected]);listSession=null;close();toast("تم حفظ قوائم الاستيراد.")}if(a==="toggle-import"){const id=b.dataset.id;importSession.selected.has(id)?importSession.selected.delete(id):importSession.selected.add(id);drawImport()}if(a==="assign-import")assignModal();if(a==="idea-task"){const x=lastIdeas[Number(b.dataset.index)];if(!x)return;try{await api("/api/family/tasks",{method:"POST",body:JSON.stringify({assignee:"yaman",title:x.taskTitle,type:x.category||"creative",points:TYPES[x.category]?.points||15,date:key(),note:x.firstStep,source:"idea"})});toast("أُضيفت الخطوة الإبداعية إلى خطة يَمان.");await refresh()}catch(z){toast(z.message)}}});
document.addEventListener("submit",async e=>{if(e.target.id==="loginForm"){e.preventDefault();try{await api("/api/family/parent/login",{method:"POST",body:JSON.stringify({pin:document.getElementById("pin").value})});toast("تم فتح منطقة الوالدين.");await refresh()}catch(x){toast(x.message)}}if(e.target.id==="taskForm"){e.preventDefault();const t=document.getElementById("taskType").value;try{await api("/api/family/tasks",{method:"POST",body:JSON.stringify({assignee:document.getElementById("taskMember").value,title:document.getElementById("taskTitle").value,type:t,points:TYPES[t].points,date:document.getElementById("taskDate").value,note:document.getElementById("taskNote").value})});close();toast("تمت إضافة المهمة.");await refresh()}catch(x){toast(x.message)}}if(e.target.id==="eventForm"){e.preventDefault();try{await api("/api/family/events",{method:"POST",body:JSON.stringify({assignee:document.getElementById("eventMember").value,title:document.getElementById("eventTitle").value,date:document.getElementById("eventDate").value,time:document.getElementById("eventTime").value,note:document.getElementById("eventNote").value})});close();toast("تم حفظ الموعد.");await refresh()}catch(x){toast(x.message)}}if(e.target.id==="assignForm"){e.preventDefault();const member=document.getElementById("importMember").value,chosen=[...importSession.selected].map(k=>importSession.tasks.find(t=>`${t.projectId}:${t.id}`===k)).filter(Boolean);try{for(const t of chosen)await api("/api/family/tasks",{method:"POST",body:JSON.stringify({assignee:member,title:t.title,type:"other",points:5,date:key(),note:t.content||"مستورد من TickTick",source:"ticktick",ticktickTaskId:t.id,ticktickProjectId:t.projectId,ticktickProjectName:t.projectName})});importSession=null;close();toast(`تمت إضافة ${chosen.length} مهام إلى خطة ${PEOPLE[member].name}.`);await refresh()}catch(x){toast(x.message)}}if(e.target.id==="ideaForm"){e.preventDefault();ideaRequest()}});
document.getElementById("modalRoot").addEventListener("click",e=>{if(e.target===e.currentTarget)close()});refresh();
})();
</script>
</body>
</html>
