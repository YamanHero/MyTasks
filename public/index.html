<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Hero — مساعد يَمان</title>

  <style>
    :root {
      --bg: #f5f8ff;
      --card: #ffffff;
      --ink: #1f2a44;
      --muted: #64748b;
      --line: #e6ebf5;
      --primary: #5b5bd6;
      --primary-dark: #4343b8;
      --success: #199473;
      --soft-success: #e9fbf5;
      --soft-purple: #f0efff;
      --soft-yellow: #fff7e6;
      --danger: #d45353;
      --accent: #f7b94f;
      --shadow: 0 12px 35px rgba(38, 50, 88, 0.09);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(91, 91, 214, 0.13), transparent 28rem),
        radial-gradient(circle at bottom left, rgba(247, 185, 79, 0.17), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .hero-header {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #5b5bd6, #7e67d9);
      color: white;
      padding: 24px;
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.17);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 18px;
      font-size: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
    }

    .brand p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.95rem;
    }

    .header-actions,
    .ticktick-actions,
    .inline-actions,
    .prayer-actions,
    .choice-row,
    .guide-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      font-weight: 700;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .btn-light {
      color: var(--primary-dark);
      background: white;
    }

    .btn-primary {
      color: white;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-soft {
      color: var(--primary-dark);
      background: var(--soft-purple);
    }

    .btn-success {
      color: white;
      background: var(--success);
    }

    .btn-outline {
      color: var(--primary-dark);
      background: transparent;
      border: 1px solid #cfcdf7;
    }

    .hidden {
      display: none !important;
    }

    .ticktick-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      padding: 17px 20px;
      border: 1px solid #ccefe5;
      border-radius: 18px;
      background: linear-gradient(135deg, #effaf7, #ffffff);
    }

    .ticktick-copy {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticktick-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      color: white;
      background: var(--success);
      font-size: 20px;
      font-weight: 900;
    }

    .ticktick-copy h2,
    .ticktick-copy p {
      margin: 0;
    }

    .ticktick-copy h2 {
      font-size: 1rem;
    }

    .ticktick-copy p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      background: white;
      color: var(--muted);
      font-weight: 700;
    }

    .tab.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(230, 235, 245, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 21px;
    }

    .card h2,
    .card h3 {
      margin: 0 0 12px;
    }

    .card h2 {
      font-size: 1.2rem;
    }

    .card h3 {
      font-size: 1.02rem;
    }

    .muted {
      color: var(--muted);
      line-height: 1.75;
    }

    .small {
      font-size: 0.87rem;
    }

    .morning-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid #d9d4ff;
      background: linear-gradient(135deg, #f1efff, #fbfaff);
      border-radius: 18px;
    }

    .morning-banner strong {
      display: block;
      margin-bottom: 5px;
    }

    .score-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #fff8e9, #fffdf8);
    }

    .score-card::before {
      content: "★";
      position: absolute;
      left: -10px;
      bottom: -35px;
      font-size: 120px;
      color: rgba(247, 185, 79, 0.16);
    }

    .score-number {
      font-size: 2.8rem;
      color: #bd7c08;
      font-weight: 900;
      line-height: 1;
      margin: 10px 0 8px;
    }

    .mini-stat {
      padding: 15px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .mini-stat strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 4px;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      border-style: hidden;
      box-shadow: 0 0 0 1px var(--line);
    }

    .schedule th,
    .schedule td {
      padding: 12px 11px;
      text-align: right;
      border: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.55;
    }

    .schedule th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 11px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fbfcff;
    }

    .task.done {
      background: var(--soft-success);
      border-color: #b6eadb;
    }

    .task-copy {
      min-width: 0;
      flex: 1;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      text-align: right;
    }

    .task-copy:hover {
      cursor: pointer;
    }

    .task-title {
      margin: 0 0 5px;
      font-weight: 800;
      line-height: 1.55;
    }

    .task.done .task-title {
      text-decoration: line-through;
      color: #418474;
    }

    .task-meta {
      color: var(--muted);
      font-size: 0.83rem;
    }

    .task-guide-link {
      display: inline-block;
      margin-top: 5px;
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      color: #976000;
      background: #fff0c9;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .task-complete {
      flex: 0 0 auto;
      border: 0;
      background: var(--success);
      color: white;
      border-radius: 11px;
      padding: 9px 11px;
      font-weight: 800;
    }

    .task-remove {
      border: 0;
      color: var(--danger);
      background: transparent;
      font-size: 1.1rem;
      padding: 7px;
    }

    .add-task-form {
      display: grid;
      grid-template-columns: 1.7fr 1fr auto;
      gap: 10px;
      margin-top: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d8dfeb;
      border-radius: 12px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.12);
    }

    textarea {
      min-height: 98px;
      resize: vertical;
      line-height: 1.6;
    }

    .note {
      border-radius: 14px;
      padding: 13px;
      line-height: 1.7;
      background: #f8fafc;
      color: var(--muted);
    }

    .note.spiritual {
      background: #effaf7;
      border: 1px solid #ccefe5;
      color: #326859;
    }

    .note.warning {
      background: var(--soft-yellow);
      border: 1px solid #ffe3a4;
      color: #825b13;
    }

    .choice-chip,
    .strength-toggle {
      border: 1px solid #dfe4f1;
      border-radius: 999px;
      padding: 9px 12px;
      color: var(--ink);
      background: white;
      font-weight: 700;
    }

    .choice-chip.selected,
    .strength-toggle.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      gap: 11px;
      margin-bottom: 13px;
    }

    .form-row label {
      font-weight: 800;
    }

    .idea-box {
      padding: 18px;
      background: linear-gradient(135deg, #eef6ff, #fafcff);
      border: 1px solid #d6e8ff;
      border-radius: 16px;
      min-height: 150px;
      line-height: 1.85;
    }

    .idea-title {
      color: var(--primary-dark);
      font-weight: 900;
      margin-bottom: 9px;
    }

    .social-script {
      padding: 15px;
      border-radius: 15px;
      color: #244463;
      background: #eef7ff;
      border: 1px solid #d3eaff;
      line-height: 1.8;
    }

    .strength-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .review-output {
      margin-top: 15px;
      padding: 16px;
      border-radius: 16px;
      background: #f9fbff;
      border: 1px solid var(--line);
      line-height: 1.9;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #d9e0eb;
      border-radius: 16px;
      background: #fcfdff;
    }

    .modal-root:empty {
      display: none;
    }

    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 26, 45, 0.52);
    }

    .modal {
      width: min(650px, 100%);
      max-height: min(770px, calc(100vh - 40px));
      overflow: auto;
      border-radius: 25px;
      background: white;
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.3);
      padding: 26px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .step-pill {
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--primary-dark);
      background: var(--soft-purple);
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .wizard-options {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .wizard-option {
      width: 100%;
      text-align: right;
      color: var(--ink);
      background: white;
      border: 1px solid #dfe4f1;
      border-radius: 15px;
      padding: 14px;
      font-weight: 700;
    }

    .wizard-option.selected {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .wizard-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .guide-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .guide-meta-item {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
    }

    .guide-meta-item span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .guide-steps-box {
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fc;
    }

    .guide-steps {
      margin: 0;
      padding-right: 22px;
      line-height: 2;
    }

    .guide-tip {
      margin-top: 14px;
      padding: 15px;
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      background: #fff9e8;
      color: #67511b;
      line-height: 1.75;
    }

    .toast {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 20;
      max-width: min(420px, calc(100% - 44px));
      transform: translateY(150%);
      opacity: 0;
      color: white;
      background: #1f2a44;
      border-radius: 14px;
      padding: 13px 16px;
      box-shadow: var(--shadow);
      transition: 0.25s ease;
      line-height: 1.65;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.75;
    }

    @media (max-width: 860px) {
      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .hero-header,
      .morning-banner,
      .ticktick-panel {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-task-form {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        width: min(100% - 20px, 1180px);
        padding-top: 10px;
      }

      .hero-header,
      .card,
      .modal {
        padding: 17px;
        border-radius: 18px;
      }

      .task {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .task-complete {
        width: 100%;
      }

      .schedule {
        font-size: 0.86rem;
      }

      .guide-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="hero-header">
      <div class="brand">
        <div class="brand-mark">🦸</div>

        <div>
          <h1>Hero — المساعد الشخصي ليَمان</h1>
          <p id="headerDate">نرتب اليوم بهدوء وخطوة خطوة.</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-light" id="startDayBtn" type="button">
          ابدأ أسئلة الصباح
        </button>

        <button class="btn btn-outline" id="resetDayBtn" type="button">
          بداية يوم جديد
        </button>
      </div>
    </header>

    <section class="ticktick-panel">
      <div class="ticktick-copy">
        <div class="ticktick-icon">✓</div>

        <div>
          <h2>TickTick</h2>
          <p id="ticktickStatus">جارٍ التحقق من الاتصال...</p>
        </div>
      </div>

      <div class="ticktick-actions">
        <button class="btn btn-primary" id="ticktickConnectBtn" type="button">
          ربط TickTick
        </button>

        <button class="btn btn-success hidden" id="ticktickSyncBtn" type="button">
          مزامنة المهام الآن
        </button>

        <button class="btn btn-outline hidden" id="ticktickDisconnectBtn" type="button">
          فصل الاتصال
        </button>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-view-target="todayView" type="button">
        اليوم
      </button>

      <button class="tab" data-view-target="creativeView" type="button">
        الإبداع وYouTube
      </button>

      <button class="tab" data-view-target="weeklyView" type="button">
        الأسبوع ونقاط القوة
      </button>
    </nav>

    <section class="view active" id="todayView"></section>
    <section class="view" id="creativeView"></section>
    <section class="view" id="weeklyView"></section>

    <footer class="footer">
      هذا التطبيق يحفظ البيانات على الجهاز. ربط TickTick اختياري ومخصص لمهام Hero فقط.
    </footer>
  </main>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "hero-yaman-app-v2";
      const LEGACY_KEYS = ["hero-yaman-app-v1", "yamanHeroTasks"];

      const TASK_TEMPLATES = {
        routine: { label: "روتين وعناية شخصية", points: 5 },
        home: { label: "مسؤولية منزلية", points: 10 },
        studyStart: { label: "بدء الدراسة", points: 10 },
        studySession: { label: "جلسة دراسة", points: 15 },
        movement: { label: "حركة أو رياضة", points: 10 },
        creative: { label: "دبلجة أو رسم أو YouTube", points: 15 },
        social: { label: "تدريب اجتماعي", points: 10 },
        tomorrow: { label: "تجهيز الغد", points: 5 },
        video: { label: "مشروع فيديو أو تسجيل", points: 25 },
        other: { label: "مهمة يومية", points: 5 }
      };

      const STRENGTHS = [
        "الدبلجة وتقليد الأصوات",
        "الخيال والقصص",
        "ابتكار شخصيات",
        "الاهتمام بالتفاصيل",
        "التركيز في المواضيع التي يحبها",
        "استخدام الأجهزة والتطبيقات",
        "حس الفكاهة",
        "التعلم عندما يكون الشرح واضحاً",
        "التطور في المسؤولية والاستقلالية"
      ];

      const SOCIAL_SCRIPTS = {
        "بدء محادثة": "يمكنك أن تقول: «مرحباً، ما الشخصية التي تحبها أكثر؟» وإذا لم يرد الشخص، انتظر قليلاً ثم قل: «لا بأس، نتكلم لاحقاً.»",
        "طلب المساعدة": "يمكنك أن تقول: «هل يمكنك أن تساعدني في هذه الخطوة؟ أنا لا أفهمها بعد.»",
        "الانضمام إلى نشاط": "يمكنك أن تقول: «هل يمكن أن أنضم إليكم؟ أحب أن أشارك.»",
        "انتظار الدور": "يمكنك أن تقول لنفسك: «سأنتظر قليلاً، وبعدها يأتي دوري.»",
        "التعامل مع المزاح": "إذا كان المزاح يزعجك، قل بهدوء: «هذا الكلام لا يعجبني، أرجوك توقف.»",
        "قول لا يناسبني باحترام": "يمكنك أن تقول: «شكراً، لكن هذا لا يناسبني الآن.»",
        "الاعتذار عند الحاجة": "يمكنك أن تقول: «آسف، لم أقصد أن أزعجك. سأحاول أن أصلح الأمر.»",
        "التعامل مع الخلاف": "يمكنك أن تقول: «نحن نختلف، لكن يمكن أن نتكلم بهدوء ونفهم بعضنا.»",
        "معرفة وقت الاستراحة": "يمكنك أن تقول: «أحتاج استراحة قصيرة، ثم أعود وأكمل.»"
      };

      const CREATIVE_IDEAS = [
        {
          title: "روبوت يتعلم المشاعر",
          text: "روبوت مضحك يكتشف أن الناس لا يقولون دائماً ما يشعرون به. في النهاية يتعلم أن يسأل بلطف: «هل أنت بخير؟»"
        },
        {
          title: "القطة المحققة",
          text: "قطة تتكلم تبحث عن الصوت المفقود من مدينة الأصوات. كل شخصية تعطيها دليلاً بصوت مختلف."
        },
        {
          title: "مدرسة الكواكب",
          text: "كوكب صغير ينتقل إلى مدرسة خيالية ويخاف من التعارف، ثم يجد صديقاً يساعده على بدء حديث."
        },

      function loadState() {
        const base = defaultState();

        try {
          raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        } catch {}

        if (!raw) {
          for (const key of LEGACY_KEYS) {
            try {
              const old = JSON.parse(localStorage.getItem(key) || "null");

              if (Array.isArray(old)) {
                raw = { tasks: old };
                break;
              }

              if (old && typeof old === "object") {
                raw = old;
                break;
              }
            } catch {}
          }
        }

        if (!raw || typeof raw !== "object") {
          return base;
        }

        return {
          ...base,
          ...raw,
          profile: {
            ...base.profile,
            ...(raw.profile || {})
          },
          tasks: Array.isArray(raw.tasks)
            ? raw.tasks.map(normalizeTask)
            : [],
          activeStrengths: Array.isArray(raw.activeStrengths)
            ? raw.activeStrengths
            : [],
          pointsByDate: raw.pointsByDate || {}
        };

        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

        state = {

          socialSkill: old.socialSkill || "بدء محادثة",
          activeStrengths: old.activeStrengths || [],

          lastCreativeIdea: old.lastCreativeIdea || CREATIVE_IDEAS[0]

      function getDailyPoints() {
        return state.tasks
          .filter((task) => task.done)
          .reduce((sum, task) => sum + Number(task.points || 0), 0) +
          (state.bonusClaimed ? 10 : 0);
      }

      function getWeekStart() {
        const date = new Date();
        const day = date.getDay();

        date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
        date.setHours(12, 0, 0, 0);

        return date;
      }

      function dateToKey(date) {
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function getWeeklyPoints() {
        const start = getWeekStart();
        let total = 0;

        for (let i = 0; i < 7; i += 1) {
          const day = new Date(start);

          day.setDate(start.getDate() + i);

          total += Number(state.pointsByDate[dateToKey(day)] || 0);
        }

        return total;
      }

      function syncPoints() {
        state.pointsByDate[state.date] = getDailyPoints();
        saveState();
      }

      function findTask(id) {
        return state.tasks.find(
          (task) => String(task.id) === String(id)

      function patchTask(id, updates) {
        state.tasks = state.tasks.map((task) =>
          String(task.id) === String(id)
            ? { ...task, ...updates }
            : task
        );

        saveState();

        return findTask(id);
      }

      async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        });

        const text = await response.text();
        let body = null;

        try {
          body = text ? JSON.parse(text) : null;
        } catch {}

        if (!response.ok) {
          const error = new Error(
            body?.error || "تعذر الاتصال بـ TickTick."
          );

          error.status = response.status;

          throw error;
        }

        return body;
      }

      async function refreshTickTickStatus() {
        try {
          const response = await fetch("/api/ticktick/status", {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error();
          }

          ticktickState = await response.json();
        } catch {
          ticktickState = {
            configured: false,
            connected: false,
            projectName: "Hero – Yaman"
          };
        }

        renderTickTick();
      }

      function renderTickTick() {
        const status = document.getElementById("ticktickStatus");
        const connect = document.getElementById("ticktickConnectBtn");
        const sync = document.getElementById("ticktickSyncBtn");
        const disconnect = document.getElementById("ticktickDisconnectBtn");

        if (!ticktickState.configured) {
          status.textContent =
            "لم يتم إعداد TickTick بعد. أضف مفاتيح الاتصال في Railway أولاً.";

          connect.textContent = "إعداد TickTick";
          sync.classList.add("hidden");
          disconnect.classList.add("hidden");
          return;
        }

        if (!ticktickState.connected) {
          status.textContent =
            "غير متصل. اضغط ربط TickTick للموافقة مرة واحدة.";

          connect.textContent = "ربط TickTick";
          sync.classList.add("hidden");
          disconnect.classList.add("hidden");
          return;
        }

        status.textContent =
          `متصل ✓ المهام الجديدة تتزامن مع قائمة ${ticktickState.projectName}.`;

        connect.textContent = "إعادة ربط";
        sync.classList.remove("hidden");
        disconnect.classList.remove("hidden");
      }

      async function sendTaskToTickTick(task) {
        if (!ticktickState.connected || task.ticktickTaskId) {
          return task;
        }

        const result = await apiRequest("/api/ticktick/task", {
          method: "POST",
          body: JSON.stringify({
            title: task.title,
            category: task.type,
            points: task.points,
            completed: task.done
          })
        });

        return patchTask(task.id, {
          ticktickTaskId: result.task.id,
          ticktickProjectId: result.task.projectId,
          ticktickCompleted: Boolean(result.task.completed)
        });
      }

      async function completeTaskInTickTick(task) {
        if (
          !ticktickState.connected ||
          !task.done ||
          task.ticktickCompleted
        ) {
          return task;
        }

        let current = task;

        if (!current.ticktickTaskId) {
          current = await sendTaskToTickTick(current);

          if (current.ticktickCompleted) {
            return current;
          }
        }

        await apiRequest("/api/ticktick/task/complete", {
          method: "POST",
          body: JSON.stringify({
            projectId: current.ticktickProjectId,
            taskId: current.ticktickTaskId
          })
        });

        return patchTask(current.id, {
          ticktickCompleted: true
        });
      }

      async function syncTask(id) {
        let task = findTask(id);

        if (!task) {
          return;
        }

        if (!task.ticktickTaskId) {
          task = await sendTaskToTickTick(task);
        }

        if (task.done && !task.ticktickCompleted) {
          await completeTaskInTickTick(task);
        }
      }

      async function syncAllTasks() {
        if (!ticktickState.connected) {
          showToast("اربط TickTick أولاً، ثم جرّب المزامنة.");
          return;
        }

        const button = document.getElementById("ticktickSyncBtn");

        button.disabled = true;
        button.textContent = "جارٍ المزامنة...";

        let success = 0;
        let failed = 0;

        for (const task of [...state.tasks]) {
          try {
            await syncTask(task.id);
            success += 1;
          } catch (error) {
            failed += 1;

            if (error.status === 401) {
              await refreshTickTickStatus();
              break;
            }
          }
        }

        button.disabled = false;
        button.textContent = "مزامنة المهام الآن";

        renderAll();

        showToast(
          failed === 0
            ? `تمت مزامنة ${success} مهام مع TickTick.`
            : `تمت مزامنة ${success} مهام. تعذرت مزامنة ${failed} مهمة.`
        );
      }

      async function markTaskDone(id) {
        let task = findTask(id);

        if (!task || task.done) {
          return;
        }

        task = patchTask(id, { done: true });

        syncPoints();
        renderAll();

        if (ticktickState.connected) {
          try {
            await syncTask(task.id);
          } catch (error) {
            if (error.status === 401) {
              await refreshTickTickStatus();
            }

            showToast(
              "تم حفظ الإنجاز في Hero، لكن لم يكتمل التحديث في TickTick."
            );

            return;
          }
        }

        showToast(
          `أحسنت يا يَمان. أنهيت المهمة وحصلت على ${task.points} نقطة.`
        );
      }

                <input id="weeklyGoodAt" value="${state.weeklyReview ? escapeHTML(state.weeklyReview.goodAt) : ""}">
              </div>

              <div class="form-row">
                <label for="weeklyEasy">ما المهمة التي أصبحت أسهل؟</label>
                <input id="weeklyEasy" value="${state.weeklyReview ? escapeHTML(state.weeklyReview.easy) : ""}">
              </div>

              <div class="form-row">
                <label for="weeklyCompliment">ما الذي مدحك عليه شخص آخر؟</label>
                <input id="weeklyCompliment" value="${state.weeklyReview ? escapeHTML(state.weeklyReview.compliment) : ""}">
              </div>

              <div class="form-row">
                <label for="weeklyNext">ما المهارة التي تريد تطويرها الأسبوع القادم؟</label>
                <input id="weeklyNext" value="${state.weeklyReview ? escapeHTML(state.weeklyReview.next) : ""}">
              </div>

              <div style="display:flex;align-items:end">
                <button class="btn btn-success" type="submit">
                  حفظ تقييم الأسبوع
                </button>
              </div>
            </form>

            ${weeklyOutput}
          </article>
        `;

        document.querySelectorAll("[data-strength]").forEach((button) => {
          button.addEventListener("click", () => {
            const strength = button.dataset.strength;

            state.activeStrengths = state.activeStrengths.includes(strength)
              ? state.activeStrengths.filter((item) => item !== strength)
              : [...state.activeStrengths, strength];

            saveState();
            renderWeekly();
          });
        });

        document.getElementById("weeklyForm").addEventListener("submit", (event) => {
          event.preventDefault();

          state.weeklyReview = {
            fun: document.getElementById("weeklyFun").value.trim(),
            goodAt: document.getElementById("weeklyGoodAt").value.trim(),
            easy: document.getElementById("weeklyEasy").value.trim(),
            compliment: document.getElementById("weeklyCompliment").value.trim(),
            next: document.getElementById("weeklyNext").value.trim()
          };

          saveState();
          renderWeekly();

          showToast("تم حفظ تقييم الأسبوع. أحسنت لأنك لاحظت تقدمك.");
        });
      }

      function bindTodayEvents() {
        document.getElementById("openMorningBtn")?.addEventListener(
          "click",
          openMorningWizard
        );

        document.getElementById("restartMorningBtn")?.addEventListener(
          "click",
          openMorningWizard
        );

        document.getElementById("bonusBtn")?.addEventListener("click", () => {
          state.bonusClaimed = true;

          syncPoints();
          renderAll();

          showToast("أحسنت يا يَمان. المحاولة رغم الصعوبة قوة حقيقية.");
        });

        document.querySelectorAll("[data-open-guide]").forEach((button) => {
          button.addEventListener("click", () => {
            const task = findTask(button.dataset.openGuide);

            if (task) {
              openTaskGuide(task);
            }
          });
        });

        document.querySelectorAll("[data-complete-task]").forEach((button) => {
          button.addEventListener("click", () => {
            markTaskDone(button.dataset.completeTask);
          });
        });

        document.querySelectorAll("[data-remove-task]").forEach((button) => {
          button.addEventListener("click", () => {
            const task = findTask(button.dataset.removeTask);

            if (!task || task.done) {
              return;
            }

            state.tasks = state.tasks.filter(
              (item) => String(item.id) !== String(task.id)
            );

            saveState();
            renderAll();

            showToast("تم حذف المهمة غير المكتملة.");
          });
        });

        document.getElementById("addTaskForm").addEventListener("submit", async (event) => {
          event.preventDefault();

          if (state.tasks.length >= 3) {
            showToast("نحتفظ بثلاث مهام رئيسية فقط اليوم.");
            return;
          }

          const title = document.getElementById("taskTitle").value.trim();
          const type = document.getElementById("taskCategory").value;

          if (!title) {
            showToast("اكتب المهمة بجملة قصيرة وواضحة.");
            return;
          }

          const task = {
            id: newId(),
            title,
            type,
            points: TASK_TEMPLATES[type].points,
            done: false
          };

          state.tasks.push(task);

          saveState();
          renderAll();

          if (ticktickState.connected) {
            try {
              await syncTask(task.id);
              showToast("تمت إضافة المهمة إلى Hero وTickTick.");
            } catch {
              showToast("تمت إضافة المهمة إلى Hero، لكن لم تُرسل إلى TickTick.");
            }
          } else {
            showToast("تمت إضافة المهمة. خطوة صغيرة وواضحة.");
          }
        });

        document.querySelectorAll("[data-prayer]").forEach((button) => {
          button.addEventListener("click", () => {
            state.prayerMessage = button.dataset.prayer === "ready"
              ? "رائع. أوقف الشاشة قبل الصلاة بدقائق، وخذ نفسين هادئين."
              : "نذهب للوضوء بهدوء، ثم نأخذ نفساً ونستعد للصلاة.";

            saveState();
            renderToday();
          });
        });

        document.querySelectorAll("[data-focus]").forEach((button) => {
          button.addEventListener("click", () => {
            state.spiritualFocus = button.dataset.focus;

            saveState();
            renderToday();
          });
        });

        document.getElementById("middayForm").addEventListener("submit", (event) => {
          event.preventDefault();

          state.midday = {
            done: document.getElementById("middayDone").value.trim(),
            easy: document.getElementById("middayEasy").value.trim(),
            hard: document.getElementById("middayHard").value.trim(),
            adjustment: document.getElementById("middayAdjustment").value
          };

          saveState();
          renderToday();

          showToast("تم حفظ المتابعة. نكمل بهدوء.");
        });

        document.getElementById("endDayForm").addEventListener("submit", (event) => {
          event.preventDefault();

          state.review = {
            best: document.getElementById("reviewBest").value.trim(),
            hard: document.getElementById("reviewHard").value.trim(),
            learned: document.getElementById("reviewLearned").value.trim(),
            proud: document.getElementById("reviewProud").value.trim(),
            tomorrow: document.getElementById("reviewTomorrow").value.trim()
          };

          saveState();
          renderToday();

          showToast("تم حفظ تقييم اليوم. أحسنت لأنك لاحظت ما تعلمته.");
        });
      }

      function openMorningWizard() {
        wizard = {
          step: 0,
          answers: {
            sleep: state.profile.sleep || "",
            energy: state.profile.energy || "",
            schedule: state.profile.schedule || [],
            priority: state.profile.priority || "",
            fun: state.profile.fun || ""
          }
        };

        renderWizard();
      }

      function renderWizard() {
        const question = MORNING_QUESTIONS[wizard.step];
        const isLast = wizard.step === MORNING_QUESTIONS.length - 1;

        let inputHTML = "";

        if (question.type === "single") {
          inputHTML = `
            <div class="wizard-options">
              ${question.options
                .map(
                  (option) => `
                    <button
                      class="wizard-option ${wizard.answers[question.key] === option ? "selected" : ""}"
                      type="button"
                      data-wizard-single="${escapeHTML(option)}"
                    >
                      ${escapeHTML(option)}
                    </button>
                  `
                )
                .join("")}
            </div>
          `;
        }

        if (question.type === "multiple") {
          inputHTML = `
            <div class="wizard-options">
              ${question.options
                .map(
                  (option) => `
                    <button
                      class="wizard-option ${(wizard.answers.schedule || []).includes(option) ? "selected" : ""}"
                      type="button"
                      data-wizard-multi="${escapeHTML(option)}"
                    >
                      ${escapeHTML(option)}
                    </button>
                  `
                )
                .join("")}
            </div>

            <div class="muted small">
              يمكنك اختيار أكثر من موعد.
            </div>
          `;
        }

        if (question.type === "text") {
          inputHTML = `
            <div style="margin-top:18px">
              <textarea
                id="wizardText"
                placeholder="${escapeHTML(question.placeholder)}"
              >${escapeHTML(wizard.answers.priority || "")}</textarea>

              <div class="muted small" style="margin-top:8px">
                يمكن أن تكتب كلمة واحدة فقط. لا نحتاج جواباً مثالياً.
              </div>
            </div>
          `;
        }

        document.getElementById("modalRoot").innerHTML = `
          <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-top">
              <div>
                <h2 style="margin:0 0 8px">صباح الخير يا يَمان</h2>

                <p class="muted" style="margin:0">
                  اليوم لا نحتاج أن نفعل كل شيء بشكل كامل. سنختار أشياء مهمة وشيئاً ممتعاً.
                </p>
              </div>

              <span class="step-pill">
                ${wizard.step + 1} من ${MORNING_QUESTIONS.length}
              </span>
            </div>

            <h3 style="margin-top:24px">${question.title}</h3>

            ${inputHTML}

            <div class="wizard-footer">
              <button
                class="btn btn-outline"
                id="wizardBackBtn"
                type="button"
                ${wizard.step === 0 ? "disabled" : ""}
              >
                رجوع
              </button>

              <button class="btn btn-primary" id="wizardNextBtn" type="button">
                ${isLast ? "إنشاء خطة اليوم" : "التالي"}
              </button>
            </div>
          </section>
        `;

        document.querySelectorAll("[data-wizard-single]").forEach((button) => {
          button.addEventListener("click", () => {
            wizard.answers[question.key] = button.dataset.wizardSingle;
            renderWizard();
          });
        });

        document.querySelectorAll("[data-wizard-multi]").forEach((button) => {
          button.addEventListener("click", () => {
            const value = button.dataset.wizardMulti;
            let selected = [...(wizard.answers.schedule || [])];

            if (value === "لا يوجد موعد مهم") {
              selected = selected.includes(value) ? [] : [value];
            } else {
              selected = selected.filter(
                (item) => item !== "لا يوجد موعد مهم"
              );

              selected = selected.includes(value)
                ? selected.filter((item) => item !== value)
                : [...selected, value];
            }

            wizard.answers.schedule = selected;
            renderWizard();
          });
        });

        document.getElementById("wizardBackBtn").addEventListener("click", () => {
          if (question.type === "text") {
            wizard.answers.priority =
              document.getElementById("wizardText").value.trim();
          }

          if (wizard.step > 0) {
            wizard.step -= 1;
            renderWizard();
          }
        });

        document.getElementById("wizardNextBtn").addEventListener("click", () => {
          if (question.type === "text") {
            wizard.answers.priority =
              document.getElementById("wizardText").value.trim();
          }

          if (
            question.type === "single" &&
            !wizard.answers[question.key]
          ) {
            showToast("اختر جواباً بسيطاً، ثم نكمل.");
            return;
          }

          if (
            question.type === "multiple" &&
            (!wizard.answers.schedule || wizard.answers.schedule.length === 0)
          ) {
            wizard.answers.schedule = ["لا يوجد موعد مهم"];
          }

          if (isLast) {
            createDailyPlanFromWizard();
            return;
          }

          wizard.step += 1;
          renderWizard();
        });
      }

      async function createDailyPlanFromWizard() {
        const priority = wizard.answers.priority || "مراجعة درس مهم";
        const creativeActivity =
          wizard.answers.fun || "نشاط إبداعي قصير";

        state.profile = {
          ready: true,
          sleep: wizard.answers.sleep,
          energy: wizard.answers.energy,
          schedule: wizard.answers.schedule,
          priority,
          fun: creativeActivity
        };

        state.tasks = [
          {
            id: newId(),
            type: "studySession",
            title: `دراسة لمدة 20 دقيقة: ${priority}`,
            points: TASK_TEMPLATES.studySession.points,
            done: false
          },
          {
            id: newId(),
            type: "home",
            title: "مهمة منزلية قصيرة: ترتيب المكتب أو الملابس",
            points: TASK_TEMPLATES.home.points,
            done: false
          },
          {
            id: newId(),
            type: "creative",
            title: `نشاط إبداعي: ${creativeActivity}`,
            points: TASK_TEMPLATES.creative.points,
            done: false
          }
        ];

        state.bonusClaimed = false;
        state.midday = null;
        state.review = null;

        saveState();
        closeModal();
        renderAll();

        if (ticktickState.connected) {
          try {
            await syncAllTasks();
          } catch {
            showToast("تم إنشاء الخطة، لكن مزامنة TickTick تحتاج محاولة أخرى.");
          }
        } else {
          showToast("أحسنت يا يَمان. هذه خطة قصيرة وواضحة.");
        }
      }

      function resetDay() {
        const confirmed = window.confirm(
          "هل تريد بدء يوم جديد؟ سيتم حفظ نقاط هذا اليوم، ثم تبدأ خطة جديدة."
        );

        if (!confirmed) {
          return;
        }

        const carry = {
          pointsByDate: state.pointsByDate || {},
          socialSkill: state.socialSkill,
          activeStrengths: state.activeStrengths,
          weeklyReview: state.weeklyReview,
          lastCreativeIdea: state.lastCreativeIdea
        };

        state = {
          ...defaultState(),
          ...carry
        };

        saveState();
        renderAll();
        openMorningWizard();
      }

      function renderAll() {
        carryForwardIfNewDay();
        renderHeader();
        renderToday();
        renderCreative();
        renderWeekly();
        renderTickTick();
      }

      function getTickTickNotice() {
        const url = new URL(window.location.href);
        const notice = url.searchParams.get("ticktick");

        if (!notice) {
          return null;
        }

        url.searchParams.delete("ticktick");

        window.history.replaceState(
          {},
          document.title,
          url.pathname + url.search
        );

        return notice;
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(
            (item) => item.classList.remove("active")
          );

          document.querySelectorAll(".view").forEach(
            (view) => view.classList.remove("active")
          );

          tab.classList.add("active");

          document
            .getElementById(tab.dataset.viewTarget)
            .classList.add("active");
        });
      });

      document
        .getElementById("startDayBtn")
        .addEventListener("click", openMorningWizard);

      document
        .getElementById("resetDayBtn")
        .addEventListener("click", resetDay);

      document
        .getElementById("ticktickConnectBtn")
        .addEventListener("click", () => {
          if (!ticktickState.configured) {
            showToast("צריך קודם להוסיף את פרטי TickTick ב-Railway Variables.");
            return;
          }

          window.location.assign("/auth/ticktick");
        });

      document
        .getElementById("ticktickSyncBtn")
        .addEventListener("click", syncAllTasks);

      document
        .getElementById("ticktickDisconnectBtn")
        .addEventListener("click", async () => {
          try {
            await apiRequest("/api/ticktick/disconnect", {
              method: "POST"
            });

            await refreshTickTickStatus();

            showToast("تم فصل TickTick من هذا المتصفح.");
          } catch {
            showToast("تعذر فصل TickTick الآن.");
          }
        });

      renderAll();

      (async () => {
        const notice = getTickTickNotice();

        await refreshTickTickStatus();

        if (notice === "connected") {
          showToast(
            "تم ربط TickTick بنجاح. يمكنك مزامنة مهام اليوم الآن."
          );
        }

        if (notice === "denied") {
          showToast("لم يتم منح Hero إذن الوصول إلى TickTick.");
        }

        if (notice === "state_error") {
          showToast(
            "انتهت جلسة الربط. اضغط ربط TickTick وحاول مرة أخرى."
          );
        }
      })();
    })();
  </script> 
  <style>
  .modal {
    position: relative;
  }

  .modal-close-x {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    color: #4343b8;
    background: #f0efff;
    font-size: 25px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
  }

  .modal-close-x:hover {
    background: #dfdcff;
    transform: scale(1.05);
  }
</style>

<script>
  (() => {
    const modalRoot = document.getElementById("modalRoot");

    if (!modalRoot) {
      return;
    }

    function closeAllModals() {
      modalRoot.innerHTML = "";
    }

    function addCloseButton() {
      const modal = modalRoot.querySelector(".modal");

      if (!modal || modal.querySelector(".modal-close-x")) {
        return;
      }

      const closeButton = document.createElement("button");

      closeButton.type = "button";
      closeButton.className = "modal-close-x";
      closeButton.setAttribute("aria-label", "إغلاق");
      closeButton.textContent = "×";

      closeButton.addEventListener("click", closeAllModals);

      modal.prepend(closeButton);
    }

    modalRoot.addEventListener("click", (event) => {
      if (event.target === modalRoot) {
        closeAllModals();
      }
    });

    const observer = new MutationObserver(addCloseButton);

    observer.observe(modalRoot, {
      childList: true,
      subtree: true
    });

    addCloseButton();
  })();
</script>
</body>
