        const questions = [
          { key: "energy", title: "كيف هي طاقتك اليوم؟", copy: "هذا يساعدنا أن نجعل الخطة مناسبة ليومك.", type: "single", options: [["منخفضة", "نختار مهاماً أقصر"], ["متوسطة", "خطة متوازنة"], ["عالية", "يمكنك اختيار تحدٍّ لطيف"]] },
          { key: "commitments", title: "هل يوجد موعد ثابت اليوم؟", copy: "يمكنك اختيار أكثر من شيء، أو تخطي الخطوة.", type: "multi", options: ["مدرسة", "رياضة", "علاج", "خروج عائلي", "لا يوجد موعد مهم"] },
          { key: "focus", title: "ما المجال الذي تريد أن تبدأ به؟", copy: "ليس التزاماً كبيراً؛ فقط بداية اليوم.", type: "single", options: [["دراسة", "رياضيات أو علوم"], ["مسؤولية", "مهمة قصيرة في البيت"], ["إبداع", "دبلجة أو رسوم"], ["توازن", "حركة وهدوء"]] }
        ];
        const question = questions[wizard.step];
        const last = wizard.step === questions.length - 1;
        const selected = wizard.answers[question.key];

        const options = question.type === "multi"
          ? `<div class="choice-grid">${question.options.map(option => `<button class="choice-button" type="button" data-wizard-multi="${escapeHTML(option)}" aria-pressed="${(selected || []).includes(option)}">${(selected || []).includes(option) ? "✓ " : ""}${escapeHTML(option)}</button>`).join("")}</div>`
          : `<div class="option-grid">${question.options.map(([title, sub]) => `<button class="option-button" type="button" data-wizard-single="${escapeHTML(title)}" aria-pressed="${selected === title}"><span>${escapeHTML(title)}<span class="sub">${escapeHTML(sub)}</span></span><span aria-hidden="true">${selected === title ? "✓" : ""}</span></button>`).join("")}</div>`;

        openModal(`
          <div class="modal-head">
            <span class="eyebrow">إعداد الخطة · ${wizard.step + 1} من 3</span>
            <div class="steps-indicator" aria-hidden="true">
              ${[0,1,2].map(i => `<span class="step-dot ${i < wizard.step ? "complete" : i === wizard.step ? "active" : ""}"></span>`).join("")}
            </div>
            <h2>${question.title}</h2>
            <p class="muted">${question.copy}</p>
          </div>
          <div style="margin-top:19px">${options}</div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="wizard-back" ${wizard.step === 0 ? "disabled" : ""}>رجوع</button>
            <button class="btn btn-primary" type="button" data-action="wizard-next">${last ? "أنشئ الخطة" : "التالي"}</button>
          </div>`);
      }

      function createPlan() {
        const energy = wizard.answers.energy || "متوسطة";
        const focus = wizard.answers.focus || "دراسة";
        const studyDuration = energy === "منخفضة" ? "15" : "20";
        const first = {
          "دراسة": { type: "study", title: `دراسة لمدة ${studyDuration} دقيقة: ابدأ بسؤال واحد` },
          "مسؤولية": { type: "home", title: "مسؤولية منزلية قصيرة: ترتيب المكتب أو الملابس" },
          "إبداع": { type: "creative", title: "تدريب دبلجة: جملة واحدة بثلاث نبرات" },
          "توازن": { type: "movement", title: "حركة خفيفة أو مشي لمدة 15 دقيقة" }
        }[focus];

        const candidates = [
          first,
          { type: "home", title: "مسؤولية منزلية قصيرة: ترتيب المكتب أو الملابس" },
          { type: "creative", title: "نشاط إبداعي: دبلجة أو رسم لمدة 15 دقيقة" },
          { type: "study", title: `دراسة لمدة ${studyDuration} دقيقة: جزء صغير وواضح` },
          { type: "movement", title: "حركة خفيفة أو مشي لمدة 15 دقيقة" }
        ];

        const tasks = [];
        for (const item of candidates) {
          if (tasks.length === MAX_TASKS) break;
          if (!tasks.some(task => task.type === item.type)) {
            tasks.push({ id: newId(), ...item, points: TASK_TEMPLATES[item.type].points, done: false, generated: true });
          }
        }

        state.profile = { ready: true, energy, commitments: wizard.answers.commitments || [], focus };
        state.tasks = tasks;
        state.activeTaskId = null;
        state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
        state.review = null;
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        showToast("أحسنت يا يَمان. أمامك الآن مهمة واحدة فقط.");
        if (ticktickState.connected) {
          syncAllTasks();
          setTimeout(() => maybeOfferDailyTickTickImport(), 350);
        }
      }

      function startTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        state.activeTaskId = task.id;
        state.timer = { taskId: task.id, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        showToast("ابدأ فقط بالخطوة الأولى. هذا يكفي الآن.");
      }

      function currentTimerRemaining() {
        if (!state.timer.running || !state.timer.startedAt) return Math.max(0, Number(state.timer.remaining) || 0);
        const elapsed = Math.floor((Date.now() - state.timer.startedAt) / 1000);
        return Math.max(0, Number(state.timer.remaining) - elapsed);
      }

      function formatTime(seconds) {
        const safe = Math.max(0, Number(seconds) || 0);
        const min = Math.floor(safe / 60);
        const sec = safe % 60;
        return `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      }

      function startVisualTimer() {
        stopVisualTimer();
        timerInterval = setInterval(() => {
          const remaining = currentTimerRemaining();
          const display = document.getElementById("timerValue");
          if (display) display.textContent = formatTime(remaining);
          if (remaining === 0 && state.timer.running) {
            state.timer.remaining = 0;
            state.timer.running = false;
            state.timer.startedAt = null;
            saveState();
            stopVisualTimer();
            renderNow();
            showToast("انتهى الوقت. اختر: استراحة قصيرة أو إكمال المهمة.");
          }
        }, 1000);
      }

      function stopVisualTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
      }

      function toggleTimer() {
        const remaining = currentTimerRemaining();
        if (remaining === 0) {
          state.timer.remaining = FOCUS_MINUTES * 60;
          state.timer.running = true;
          state.timer.startedAt = Date.now();
        } else if (state.timer.running) {
          state.timer.remaining = remaining;
          state.timer.running = false;
          state.timer.startedAt = null;
        } else {
          state.timer.remaining = remaining;
          state.timer.running = true;
          state.timer.startedAt = Date.now();
        }
        saveState();
        renderNow();
      }

      async function completeTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        task.done = true;
        if (state.activeTaskId === task.id) {
          state.activeTaskId = null;
          state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
          stopVisualTimer();
        }
        saveDailyPoints();
        renderAll();
        if (ticktickState.connected) {
          try { await syncTask(task.id); } catch {}
        }
        showToast(`أحسنت يا يَمان. أنهيت المهمة وحصلت على ${task.points} نقطة.`);
      }

      function deleteTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        state.tasks = state.tasks.filter(item => item.id !== task.id);
        if (state.activeTaskId === task.id) {
          state.activeTaskId = null;
          state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
          stopVisualTimer();
        }
        saveState();
        renderAll();
        showToast("تم حذف المهمة غير المكتملة.");
      }

      function resetDay() {
        const carry = {
          pointsByDate: state.pointsByDate || {},
          activeStrengths: state.activeStrengths || [],
          creativeIdeaIndex: state.creativeIdeaIndex || 0,
          socialSkillIndex: state.socialSkillIndex || 0,
          ticktickImportProjectIds: Array.isArray(state.ticktickImportProjectIds) ? [...state.ticktickImportProjectIds] : null,
          calendarEvents: (state.calendarEvents || []).map(normalizeCalendarEvent).filter(event => event.date >= dateKey())
        };
        state = { ...defaultState(), ...carry };
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        openMorningWizard();
      }

      function addCreativeTask() {
        if (state.tasks.length >= MAX_TASKS) {
          showToast("لديك ثلاث مهام رئيسية. لا نضيف أكثر اليوم.");
          return;
        }
        const task = {
          id: newId(),
          type: "creative",
          title: "تدريب دبلجة: جملة واحدة بثلاث نبرات",
          points: TASK_TEMPLATES.creative.points,
          done: false
        };
        state.tasks.push(task);
        saveState();
        renderAll();
        showToast("أضفنا تدريب الدبلجة إلى الخطة.");
        if (ticktickState.connected) syncTask(task.id);
      }


      function openAddCalendarEvent() {
        openModal(`
          <div class="modal-head">
            <span class="eyebrow">موعد جديد</span>
            <h2>أضف موعداً إلى الخطة</h2>
            <p class="muted">المواعيد لا تمنح نقاطاً. هي فقط تساعد يَمان أن يرى يومه بوضوح.</p>
          </div>
          <form class="form-grid" id="calendarEventForm" style="margin-top:18px">
            <label>ما الموعد؟
              <input id="eventTitle" required maxlength="100" placeholder="مثال: رياضة مع المدرب">
            </label>
            <label>التاريخ
              <input id="eventDate" type="date" required value="${escapeHTML(state.date)}">
            </label>
            <label>الوقت (اختياري)
              <input id="eventTime" type="time">
            </label>
            <label>ملاحظة قصيرة (اختياري)
              <input id="eventNote" maxlength="220" placeholder="مثال: خذ زجاجة ماء">
            </label>
            <div class="modal-foot">
              <button class="btn btn-secondary" type="button" data-action="close-modal">إلغاء</button>
              <button class="btn btn-primary" type="submit">حفظ الموعد</button>
            </div>
          </form>`);
      }

      function deleteCalendarEvent(eventId) {
        state.calendarEvents = (state.calendarEvents || []).filter(event => String(event.id) !== String(eventId));
        saveState();
        renderPlan();
        showToast("تم حذف الموعد.");
      }

      async function requestIdeaSuggestions() {
        const input = document.getElementById("ideaText");
        const submit = document.getElementById("ideaSubmitBtn");
        const idea = String(input?.value || "").trim();
        if (idea.length < 4) {
          showToast("اكتب فكرة قصيرة من عدة كلمات، ثم نساعدك في تطويرها.");
          return;
        }
        if (submit) {
          submit.disabled = true;
          submit.textContent = "جارٍ التفكير...";
        }
        try {
          const result = await apiRequest("/api/ideas", {
            method: "POST",
            body: JSON.stringify({ idea })
          });
          state.ideaDraft = idea;
          state.ideaSuggestions = Array.isArray(result?.ideas) ? result.ideas.slice(0, 3) : [];
          state.ideaSuggestionMode = result?.source === "openai" ? "openai" : "local";
          saveState();
          renderPlan();
          showToast(state.ideaSuggestionMode === "openai" ? "ظهرت 3 أفكار من AI. اختر فكرة واحدة فقط." : "ظهرت 3 أفكار أساسية. يمكنك تفعيل AI من Railway لاحقاً.");
        } catch (error) {
          showToast(error?.message || "تعذر إنشاء الأفكار الآن. جرّب مرة أخرى.");
          if (submit) {
            submit.disabled = false;
            submit.textContent = "اقترح 3 أفكار";
          }
        }
      }

      function applyIdeaSuggestion(index) {
        const ideas = Array.isArray(state.ideaSuggestions) ? state.ideaSuggestions : [];
        const idea = ideas[Number(index)];
        if (!idea) return;
        if (state.tasks.length >= MAX_TASKS) {
          showToast("خطة اليوم فيها ثلاث مهام. احذف مهمة غير مناسبة قبل إضافة فكرة جديدة.");
          return;
        }
        const type = TASK_TEMPLATES[idea.category] ? idea.category : "creative";
        const title = String(idea.taskTitle || idea.firstStep || idea.title || "فكرة إبداعية قصيرة").trim().slice(0, 180);
        state.tasks.push({
          id: newId(),
          title,
          type,
          points: TASK_TEMPLATES[type].points,
          done: false,
          generated: false
        });
        saveState();
        renderAll();
        showToast("أُضيفت الفكرة كمهمة قصيرة. ابدأ بالخطوة الأولى فقط.");
        if (ticktickState.connected) syncTask(state.tasks[state.tasks.length - 1].id);
      }

      function todayTickTickDate() {
        return dateKey();
      }

      function classifyImportedTickTickTask(task) {
        const text = `${task.title || ""} ${task.content || ""}`.toLowerCase();
        if (/رياض|علوم|واجب|درس|study|homework|math|science/.test(text)) return "study";
        if (/دبلج|رسم|صوت|فيديو|youtube|animation|record/.test(text)) return "creative";
        if (/رياضة|مشي|حركة|تمرين|sport|walk|exercise/.test(text)) return "movement";
        if (/غسيل|ملابس|ترتيب|نفايات|زبالة|بيت|laundry|clean|home/.test(text)) return "home";
        if (/صديق|حديث|اجتماع|social|friend/.test(text)) return "social";
        return "other";
      }

      function formatTickTickDueDate(value) {
        if (!value) return "اليوم";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "اليوم";
        return new Intl.DateTimeFormat("ar", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function existingTickTickTaskIds() {
        return new Set(
          state.tasks
            .map(task => String(task.ticktickTaskId || ""))
            .filter(Boolean)
        );
      }

      function importReplaceableTasks() {
        return state.tasks.filter(task =>
          task.generated &&
          !task.done &&
          String(task.id) !== String(state.activeTaskId || "")
        );
      }

      function importCapacity() {
        return Math.max(0, MAX_TASKS - state.tasks.length) + importReplaceableTasks().length;
      }

      function selectedTickTickProjectIds() {
        return Array.isArray(state.ticktickImportProjectIds)
          ? state.ticktickImportProjectIds.map(id => String(id)).filter(Boolean)
          : [];
      }

      function tickTickImportScopeLabel() {
        const selected = selectedTickTickProjectIds();
        if (!selected.length) return "كل القوائم النشطة";
        return selected.length === 1 ? "قائمة واحدة مختارة" : `${selected.length} قوائم مختارة`;
      }

      async function fetchTickTickProjects() {
        const response = await apiRequest("/api/ticktick/projects");
        return Array.isArray(response?.projects) ? response.projects : [];
      }

      async function fetchTickTickTodayTasks() {
        const params = new URLSearchParams({ date: todayTickTickDate() });
        const selectedProjects = selectedTickTickProjectIds();
        if (selectedProjects.length) params.set("projectIds", selectedProjects.join(","));
        const response = await apiRequest(`/api/ticktick/today-tasks?${params.toString()}`);
        return Array.isArray(response?.tasks) ? response.tasks : [];
      }

      async function openTickTickProjectSelector() {
        if (!(await requireActiveTickTick())) return;

        showToast("جارٍ جلب قوائم TickTick...");

        try {
          const projects = await fetchTickTickProjects();
          if (!projects.length) {
            showToast("لم نجد قوائم نشطة في TickTick.");
            return;
          }

          const saved = selectedTickTickProjectIds();
          const availableIds = new Set(projects.map(project => String(project.id)));
          const selectedIds = new Set(
            saved.length
              ? saved.filter(id => availableIds.has(String(id)))
              : projects.map(project => String(project.id))
          );

          ticktickProjectSelectionSession = { projects, selectedIds };
          renderTickTickProjectSelector();
        } catch (error) {
          if (error.status === 401) await refreshTickTickStatus();
          showToast("تعذر جلب قوائم TickTick الآن. جرّب مرة أخرى.");
        }
      }

      function renderTickTickProjectSelector() {
        if (!ticktickProjectSelectionSession) return;

        const session = ticktickProjectSelectionSession;
        const selectedCount = session.selectedIds.size;
        const allSelected = selectedCount === session.projects.length;

        openModal(`
          <div class="modal-head">
            <span class="eyebrow">مصدر الاستيراد</span>
            <h2>اختر قوائم TickTick</h2>
            <p class="muted">سيستورد Hero مهام اليوم من القوائم التي تحددها هنا فقط. يمكنك تغيير الاختيار في أي وقت.</p>
          </div>
          <div class="action-row" style="margin-top:16px">
            <button class="btn btn-soft" type="button" data-action="toggle-all-import-projects">${allSelected ? "إلغاء تحديد الكل" : "تحديد كل القوائم"}</button>
          </div>
          <div class="option-grid" style="margin-top:12px">
            ${session.projects.map(project => {
              const id = String(project.id);
              const selected = session.selectedIds.has(id);
              const color = /^#[0-9a-fA-F]{3,8}$/.test(String(project.color || "")) ? String(project.color) : "#5b5bd6";
              return `<button class="option-button ticktick-list-option" type="button" data-action="toggle-import-project" data-project-id="${escapeHTML(id)}" aria-pressed="${selected}">
                <span><span class="list-dot" style="background:${escapeHTML(color)}"></span>${selected ? "✓ " : ""}${escapeHTML(project.name)}<span class="sub">قائمة TickTick</span></span>
                <span aria-hidden="true">${selected ? "✓" : ""}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="close-project-selector">إلغاء</button>
            <button class="btn btn-primary" type="button" data-action="save-import-projects" ${selectedCount ? "" : "disabled"}>حفظ ${selectedCount} قائمة</button>
          </div>`);
      }

      function toggleTickTickProjectSelection(projectId) {
        if (!ticktickProjectSelectionSession) return;
        const id = String(projectId || "");
        const selected = ticktickProjectSelectionSession.selectedIds;
        if (selected.has(id)) selected.delete(id);
        else selected.add(id);
        renderTickTickProjectSelector();
      }

      function toggleAllTickTickProjectSelections() {
        if (!ticktickProjectSelectionSession) return;
        const session = ticktickProjectSelectionSession;
        if (session.selectedIds.size === session.projects.length) {
          session.selectedIds.clear();
        } else {
          session.selectedIds = new Set(session.projects.map(project => String(project.id)));
        }
        renderTickTickProjectSelector();
      }

      function saveTickTickProjectSelections() {
        if (!ticktickProjectSelectionSession) return;
        const session = ticktickProjectSelectionSession;
        const selectedIds = [...session.selectedIds];
        if (!selectedIds.length) {
          showToast("اختر قائمة واحدة على الأقل.");
          return;
        }

        state.ticktickImportProjectIds = selectedIds.length === session.projects.length ? null : selectedIds;
        state.ticktickImportPromptDate = "";
        saveState();
        ticktickProjectSelectionSession = null;
        closeModal();
        renderAll();
        showToast(`تم حفظ قوائم الاستيراد: ${tickTickImportScopeLabel()}.`);
      }

      async function openTickTickImport() {
        if (!(await requireActiveTickTick())) return;

        showToast("جارٍ جلب مهام TickTick لليوم...");

        try {
          const tasks = await fetchTickTickTodayTasks();
          openTickTickImportSelection(tasks, false);
        } catch (error) {
          if (error.status === 401) await refreshTickTickStatus();
          showToast("تعذر جلب مهام TickTick الآن. جرّب مرة أخرى.");
        }
      }

      async function maybeOfferDailyTickTickImport() {
        if (
          !ticktickState.connected ||
          !state.profile.ready ||
          state.ticktickImportPromptDate === state.date
        ) {
          return;
        }

        try {
          const tasks = await fetchTickTickTodayTasks();
          state.ticktickImportPromptDate = state.date;
          saveState();

          const existingIds = existingTickTickTaskIds();
          const available = tasks.filter(task => !existingIds.has(String(task.id || "")));

          if (available.length && importCapacity() > 0) {
            openTickTickImportSelection(tasks, true);
          }
        } catch {
          // Do not interrupt Yaman's daily flow if the external service is temporarily unavailable.
        }
      }

      function openTickTickImportSelection(tasks, automatic) {
        const existingIds = existingTickTickTaskIds();
        const available = tasks.filter(task =>
          task && task.id && task.title && !existingIds.has(String(task.id))
        );

        if (!available.length) {
          showToast("لا توجد مهام جديدة ومفتوحة لليوم في TickTick.");
          return;
        }

        const limit = importCapacity();
        if (limit <= 0) {
          showToast("خطة اليوم ممتلئة. احذف مهمة أو أوقف مهمة مقترحة قبل الاستيراد.");
          return;
        }

        ticktickImportSession = {
          automatic: Boolean(automatic),
          tasks: available,
          selectedIds: new Set()
        };

        renderTickTickImportSelection();
      }

      function renderTickTickImportSelection() {
        if (!ticktickImportSession) return;

        const session = ticktickImportSession;
        const capacity = importCapacity();
        const replaceable = importReplaceableTasks().length;
        const selectedCount = session.selectedIds.size;
        const replacingCopy = replaceable
          ? `إذا اخترت أكثر من الأماكن المتاحة، سيستبدل Hero ${replaceable} من اقتراحاته غير المبدوءة فقط.`
          : "لن تُحذف أي مهمة موجودة.";

        openModal(`
          <div class="modal-head">
            <span class="eyebrow">${session.automatic ? "اقتراح يومي من TickTick" : "استيراد من TickTick"}</span>
            <h2>اختر ما يناسب اليوم</h2>
            <p class="muted">وجدنا ${session.tasks.length} مهام مفتوحة لليوم. اختر فقط ما يناسب يَمان، حتى ${capacity} مهام كحد أقصى.</p>
          </div>
          <div class="note small" style="margin-top:16px">${escapeHTML(replacingCopy)}</div>
          <div class="option-grid" style="margin-top:16px">
            ${session.tasks.map(task => {
              const selected = session.selectedIds.has(String(task.id));
              const project = task.projectName ? ` · ${escapeHTML(task.projectName)}` : "";
              const due = task.dueDate ? ` · ${escapeHTML(formatTickTickDueDate(task.dueDate))}` : "";
              return `<button class="option-button" type="button" data-action="toggle-import-task" data-import-task-id="${escapeHTML(task.id)}" aria-pressed="${selected}">
                <span>${selected ? "✓ " : ""}${escapeHTML(task.title)}<span class="sub">TickTick${project}${due}</span></span>
                <span aria-hidden="true">${selected ? "✓" : ""}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="close-modal">لاحقاً</button>
            <button class="btn btn-primary" type="button" data-action="confirm-ticktick-import" ${selectedCount ? "" : "disabled"}>أضف ${selectedCount} إلى الخطة</button>
          </div>`);
      }

      function toggleTickTickImportSelection(taskId) {
        if (!ticktickImportSession) return;
        const id = String(taskId || "");
        const selected = ticktickImportSession.selectedIds;

        if (selected.has(id)) {
          selected.delete(id);
          renderTickTickImportSelection();
          return;
        }

        if (selected.size >= importCapacity()) {
          showToast("نختار عدداً صغيراً حتى تبقى خطة اليوم واضحة.");
          return;
        }

        selected.add(id);
        renderTickTickImportSelection();
      }

      function importSelectedTickTickTasks() {
        if (!ticktickImportSession) return;

        const selectedTasks = ticktickImportSession.tasks.filter(task =>
          ticktickImportSession.selectedIds.has(String(task.id))
        );

        if (!selectedTasks.length) {
          showToast("اختر مهمة واحدة على الأقل.");
          return;
        }

        const overflow = Math.max(0, state.tasks.length + selectedTasks.length - MAX_TASKS);
        const replaceable = importReplaceableTasks();

        if (overflow > replaceable.length) {
          showToast("لا توجد مساحة كافية. احذف مهمة غير مناسبة ثم جرّب مرة أخرى.");
          return;
        }

        const removeIds = new Set(replaceable.slice(0, overflow).map(task => task.id));
        state.tasks = state.tasks.filter(task => !removeIds.has(task.id));

        for (const source of selectedTasks) {
          const type = classifyImportedTickTickTask(source);
          state.tasks.push({
            id: newId(),
            title: String(source.title).trim().slice(0, 180),
            type,
            points: TASK_TEMPLATES[type].points,
            done: false,
            ticktickTaskId: String(source.id),
            ticktickProjectId: String(source.projectId || ""),
            ticktickCompleted: false,
            ticktickImported: true,
            ticktickDueDate: source.dueDate || null,
            ticktickProjectName: source.projectName || "",
            generated: false
          });
        }

        if (!state.profile.ready) {
          state.profile = { ready: true, energy: "متوسطة", commitments: [], focus: "توازن" };
        }

        saveState();
        ticktickImportSession = null;
        closeModal();
        renderAll();
        showToast(`تمت إضافة ${selectedTasks.length} مهام من TickTick إلى خطة اليوم.`);
      }

      async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          credentials: "include",
          cache: "no-store",
          headers: { "Content-Type": "application/json", ...(options.headers || {}) }
        });
        const text = await response.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch {}
        if (!response.ok) {
          const error = new Error(body?.error || "تعذر الاتصال بالخدمة الآن.");
          error.status = response.status;
          throw error;
        }
        return body;
      }

      async function refreshTickTickStatus() {
        try {
          const response = await fetch("/api/ticktick/status", {
            cache: "no-store",
            credentials: "include"
          });
          if (!response.ok) throw new Error();
          ticktickState = await response.json();
        } catch {
          ticktickState = { configured: false, connected: false, projectName: "Hero – Yaman" };
        }
        return ticktickState;
      }

      async function requireActiveTickTick() {
        await refreshTickTickStatus();
        renderAll();
        if (!ticktickState.configured) {
          showToast("يجب إعداد TickTick في Railway أولاً.");
          return false;
        }
        if (!ticktickState.connected) {
          showToast("ربط TickTick غير نشط. افتح الإعدادات واضغط ربط TickTick.");
          return false;
        }
        return true;
      }

      function renderTickTickStatus() {
        // Status is rendered in the settings sheet, where it belongs; it does not compete with the daily task.
      }

      async function sendTaskToTickTick(task) {
        if (!ticktickState.connected || task.ticktickTaskId) return task;
        const result = await apiRequest("/api/ticktick/task", {
          method: "POST",
          body: JSON.stringify({ title: task.title, category: task.type, points: task.points, completed: task.done })
        });
        task.ticktickTaskId = result.task.id;
        task.ticktickProjectId = result.task.projectId;
        task.ticktickCompleted = Boolean(result.task.completed);
        saveState();
        return task;
      }

      async function completeTaskInTickTick(task) {
        if (!ticktickState.connected || !task.done || task.ticktickCompleted) return task;
        const current = task.ticktickTaskId ? task : await sendTaskToTickTick(task);
        if (current.ticktickCompleted) return current;
        await apiRequest("/api/ticktick/task/complete", {
          method: "POST",
          body: JSON.stringify({ projectId: current.ticktickProjectId, taskId: current.ticktickTaskId })
        });
        current.ticktickCompleted = true;
        saveState();
        return current;
      }

      async function syncTask(taskId) {
        let task = findTask(taskId);
        if (!task) return;
        if (!task.ticktickTaskId) task = await sendTaskToTickTick(task);
        if (task.done && !task.ticktickCompleted) await completeTaskInTickTick(task);
      }

      async function syncAllTasks() {
        if (!(await requireActiveTickTick())) return;
        let synced = 0;
        for (const task of [...state.tasks]) {
          try { await syncTask(task.id); synced += 1; } catch {}
        }
        showToast(`تمت مزامنة ${synced} مهام مع TickTick.`);
      }

      function connectTickTick() {
        if (!ticktickState.configured) {
          showToast("يجب إعداد TickTick في Railway أولاً.");
          return;
        }
        window.location.assign("/auth/ticktick");
      }

      async function disconnectTickTick() {
        try {
          await apiRequest("/api/ticktick/disconnect", { method: "POST" });
          await refreshTickTickStatus();
          openSettings();
          showToast("تم فصل TickTick من هذا المتصفح.");
        } catch {
          showToast("تعذر فصل TickTick الآن.");
        }
      }

      function toggleStrength(strength) {
        state.activeStrengths = state.activeStrengths.includes(strength)
          ? state.activeStrengths.filter(item => item !== strength)
          : [...state.activeStrengths, strength];
        saveState();
        renderProgress();
      }

      function bindEvents() {
        document.addEventListener("click", async event => {
          const button = event.target.closest("[data-action], [data-screen], [data-wizard-single], [data-wizard-multi]");
          if (!button) return;

          if (button.dataset.screen) {
            setScreen(button.dataset.screen);
            return;
          }

          const action = button.dataset.action;
          const taskId = button.dataset.taskId;

          if (action === "open-wizard") openMorningWizard();
          if (action === "open-plan") setScreen("plan");
          if (action === "open-guide") {
            const task = findTask(taskId);
            if (task) openGuide(task);
          }
          if (action === "close-modal") closeModal();
          if (action === "start-task") startTask(taskId);
          if (action === "toggle-timer") toggleTimer();
          if (action === "complete-task") completeTask(taskId);
          if (action === "delete-task") deleteTask(taskId);
          if (action === "add-task") openAddTask();
          if (action === "add-calendar-event") openAddCalendarEvent();
          if (action === "delete-calendar-event") deleteCalendarEvent(button.dataset.eventId);
          if (action === "apply-idea") applyIdeaSuggestion(button.dataset.ideaIndex);
          if (action === "add-creative-task") addCreativeTask();
          if (action === "next-idea") {
            state.creativeIdeaIndex = (state.creativeIdeaIndex + 1) % CREATIVE_IDEAS.length;
            saveState(); renderCreative();
          }
          if (action === "next-social") {
            state.socialSkillIndex = (state.socialSkillIndex + 1) % SOCIAL_SCRIPTS.length;
            saveState(); renderCreative();
          }
          if (action === "toggle-strength") toggleStrength(button.dataset.strength);
          if (action === "reset-day") resetDay();
          if (action === "connect-ticktick") connectTickTick();
          if (action === "sync-ticktick") syncAllTasks();
          if (action === "disconnect-ticktick") disconnectTickTick();
          if (action === "import-ticktick-today") openTickTickImport();
          if (action === "choose-ticktick-lists") openTickTickProjectSelector();
          if (action === "toggle-import-project") toggleTickTickProjectSelection(button.dataset.projectId);
          if (action === "toggle-all-import-projects") toggleAllTickTickProjectSelections();
          if (action === "save-import-projects") saveTickTickProjectSelections();
          if (action === "close-project-selector") {
            ticktickProjectSelectionSession = null;
            closeModal();
          }
          if (action === "toggle-import-task") toggleTickTickImportSelection(button.dataset.importTaskId);
          if (action === "confirm-ticktick-import") importSelectedTickTickTasks();

          if (action === "wizard-back") {
            wizard.step = Math.max(0, wizard.step - 1);
            renderWizard();
          }

          if (action === "wizard-next") {
            const isMulti = wizard.step === 1;
            if (wizard.step === 0 && !wizard.answers.energy) {
              showToast("اختر مستوى طاقتك، ثم نكمل.");
              return;
            }
            if (wizard.step === 2 && !wizard.answers.focus) {
              showToast("اختر مجالاً واحداً لتبدأ به.");
              return;
            }
            if (isMulti && !wizard.answers.commitments.length) wizard.answers.commitments = ["لا يوجد موعد مهم"];
            if (wizard.step === 2) createPlan();
            else { wizard.step += 1; renderWizard(); }
          }

          if (button.dataset.wizardSingle) {
            event.preventDefault();
            const key = wizard.step === 0 ? "energy" : "focus";
            wizard.answers[key] = button.dataset.wizardSingle;
            renderWizard();
          }

          if (button.dataset.wizardMulti) {
            event.preventDefault();
            const value = button.dataset.wizardMulti;
            let selected = [...(wizard.answers.commitments || [])];
            if (value === "لا يوجد موعد مهم") {
              selected = selected.includes(value) ? [] : [value];
            } else {
              selected = selected.filter(item => item !== "لا يوجد موعد مهم");
              selected = selected.includes(value) ? selected.filter(item => item !== value) : [...selected, value];
            }
            wizard.answers.commitments = selected;
            renderWizard();
          }
        });

        document.addEventListener("submit", async event => {
          if (event.target.id === "addTaskForm") {
            event.preventDefault();
            const title = document.getElementById("newTaskTitle").value.trim();
            const type = document.getElementById("newTaskType").value;
            if (!title) {
              showToast("اكتب المهمة بجملة قصيرة وواضحة.");
              return;
            }
            if (state.tasks.length >= MAX_TASKS) {
              showToast("لديك ثلاث مهام رئيسية اليوم.");
              return;
            }
            const task = { id: newId(), title, type, points: TASK_TEMPLATES[type].points, done: false };
            state.tasks.push(task);
            saveState();
            closeModal();
            renderAll();
            showToast("أُضيفت المهمة. اخترها من شاشة “الآن” عندما تصبح جاهزاً.");
            if (ticktickState.connected) syncTask(task.id);
          }

          if (event.target.id === "calendarEventForm") {
            event.preventDefault();
            const title = document.getElementById("eventTitle").value.trim();
            const date = document.getElementById("eventDate").value;
            const time = document.getElementById("eventTime").value;
            const note = document.getElementById("eventNote").value.trim();
            if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
              showToast("اكتب اسم الموعد واختر تاريخاً صحيحاً.");
              return;
            }
            state.calendarEvents = [
              ...(state.calendarEvents || []),
              normalizeCalendarEvent({ id: newId(), title, date, time, note })
            ];
            saveState();
            closeModal();
            renderPlan();
            showToast(`تم حفظ موعد: ${title}.`);
          }

          if (event.target.id === "ideaForm") {
            event.preventDefault();
            await requestIdeaSuggestions();
          }

          if (event.target.id === "reviewForm") {
            event.preventDefault();
            state.review = {
              proud: document.getElementById("reviewProud").value.trim(),
              tomorrow: document.getElementById("reviewTomorrow").value.trim()
            };
            saveState();
            showToast("تم حفظ الملاحظة. يومك لا يحتاج أن يكون مثالياً حتى يكون جيداً.");
          }
        });

        document.getElementById("settingsBtn").addEventListener("click", openSettings);
        document.getElementById("modalRoot").addEventListener("click", event => {
          if (event.target === event.currentTarget) closeModal();
        });
      }

      function getTickTickNotice() {
        const url = new URL(window.location.href);
        const notice = url.searchParams.get("ticktick");
        if (!notice) return null;
        url.searchParams.delete("ticktick");
        window.history.replaceState({}, document.title, url.pathname + url.search);
        return notice;
      }

      bindEvents();
      renderAll();

      (async () => {
        const notice = getTickTickNotice();
        await refreshTickTickStatus();

        // The first render happens before the asynchronous TickTick status check.
        // Render again so buttons for import, list selection and sync reflect the real connection state.
        renderAll();

        if (notice === "connected") showToast("تم ربط TickTick بنجاح.");
        if (notice === "denied") showToast("لم يتم منح Hero إذن الوصول إلى TickTick.");
        if (notice === "state_error") showToast("انتهت جلسة الربط. حاول مرة أخرى.");
        if (notice === "connected") setTimeout(() => maybeOfferDailyTickTickImport(), 500);
        else maybeOfferDailyTickTickImport();
      })();
    })();
  </script>
</body>
</html>
