<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>عائلة هيرو — Mobile PIN Typing Fix</title>
  <style>
    :root {
      --bg: #f7f6ff;
      --card: rgba(255, 255, 255, 0.94);
      --ink: #20243f;
      --muted: #69708c;
      --line: #e4e3f0;
      --brand: #5b5bd6;
      --brand2: #332f85;
      --soft: #f0efff;
      --ok: #15976d;
      --danger: #c93f64;
      --gold: #f6bb50;
      --shadow: 0 12px 40px rgba(43, 38, 120, 0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { direction: rtl; }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      text-align: right;
      background: linear-gradient(180deg, #fbfbff, var(--bg));
      /* מניעת גלילה אופקית במובייל */
      overflow-x: hidden; 
      -webkit-tap-highlight-color: transparent;
    }

    /* === Mobile-First Base Styles === */
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; }
    a { color: inherit; text-decoration: none; }
    
    input, select, textarea {
      width: 100%;
      min-height: 54px;
      border: 1px solid #cdd2e7;
      border-radius: 16px;
      padding: 14px 16px;
      background: white;
      color: var(--ink);
      direction: rtl;
      text-align: right;
      font-size: 1rem;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .pin-input {
      direction: ltr !important;
      text-align: center !important;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.05rem;
      padding-inline: 18px;
      border-radius: 18px;
      caret-color: var(--brand);
      cursor: text !important;
      pointer-events: auto !important;
      touch-action: manipulation;
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      z-index: 5;
    }

    .login label {
      display: grid;
      gap: 8px;
      cursor: text;
    }

    /* Container */
    .app { 
      width: 100%; 
      padding: 12px 12px 84px; 
      margin: 0 auto; 
    }

    /* Hero Section */
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--brand2), var(--brand));
      color: white;
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: auto auto -100px -60px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
    }
    .brand { display: flex; gap: 14px; align-items: center; z-index: 1; }
    .mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .2);
      font-size: 1.5rem;
      font-weight: bold;
    }
    .hero h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; z-index: 1; }
    .hero p { margin: 4px 0 0; color: #efedff; font-size: 0.9rem; z-index: 1; }
    .status-pill { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 700; font-size: 0.85rem; z-index: 1; }

    /* Tabs (Sticky on Mobile) */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .tab { 
      min-height: 54px; 
      border-radius: 14px; 
      background: transparent; 
      color: var(--muted); 
      font-weight: 700; 
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .tab.active { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(91, 91, 214, 0.3); }
    .tab small { display: none; } /* מוסתר במובייל */

    /* Layout & Cards */
    .stack { display: grid; gap: 16px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; } /* טור 1 במובייל */
    
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(31, 35, 64, .04);
      padding: 20px;
    }
    .card.glow { background: linear-gradient(145deg, #fff, var(--soft)); }
    .card h2 { margin: 0 0 8px; font-size: 1.4rem; }
    .card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .eyebrow { display: block; color: var(--brand); font-size: .85rem; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; }
    .muted { color: var(--muted); }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px; /* ידידותי למגע */
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 1rem;
      transition: all .15s ease;
      width: 100%; /* רוחב מלא במובייל */
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-soft { background: var(--soft); color: var(--brand2); }
    .btn-ok { background: var(--ok); color: white; }
    .btn-line { background: white; border-color: #cbd0e4; color: var(--ink); }
    .btn-danger { background: #fff0f4; color: var(--danger); border-color: #ecc2cd; }
    
    .row { display: flex; flex-direction: column; gap: 12px; } /* טור במובייל */

    /* Notifications & Metrics */
    .notice { padding: 16px; border: 1px solid #f1dda6; background: #fff7dc; border-radius: 16px; color: #7a560e; font-size: 0.95rem; }
    .notice.ok { background: #ecfbf6; border-color: #bee9dd; color: #0d614f; }
    
    .metric { 
      padding: 16px; 
      border: 1px solid var(--line); 
      border-radius: 18px; 
      background: #fff; 
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .metric strong { font-size: 1.8rem; line-height: 1.2; color: var(--brand); }
    .score-orb { 
      display: grid; place-items: center; 
      width: 70px; height: 70px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, var(--gold), #ffe2a3); 
      font-size: 1.6rem; font-weight: 900; color: #6b4400; 
      box-shadow: 0 12px 24px rgba(246, 187, 80, .3); 
    }

    /* Tasks List */
    .list { padding: 0; }
    .list-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
    .timeline { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
    
    .task-card {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px;
      text-align: right;
      transition: background 0.2s;
    }
    .task-card:active { background: #f0efff; }
    .task-card.done { background: #f1fbf7; }
    
    .time-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--brand2);
      font-weight: 700;
    }
    .time-box span { background: var(--soft); padding: 4px 10px; border-radius: 8px; }
    .time-box small { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    
    .task-main h3 { margin: 0 0 4px; font-size: 1.1rem; }
    .task-main p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    
    .task-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .badge-mini { display: inline-flex; align-items: center; background: var(--soft); border-radius: 6px; padding: 4px 8px; font-size: .8rem; font-weight: 700; color: var(--brand2); }
    .status-open { background: #fff7dc; color: #79550c; }
    .status-done { background: #ecfbf6; color: #0d614f; }
    
    .task-actions { display: flex; gap: 8px; width: 100%; }
    .task-actions .btn { flex: 1; min-height: 44px; font-size: 0.95rem; }

    .empty { padding: 32px 20px; text-align: center; color: var(--muted); font-weight: 500; }
    .form { display: grid; gap: 16px; }
    .login-error { color: var(--danger); font-weight: 700; text-align: center; margin: 0; }

    /* Bottom Sheet Modal (Mobile) */
    .modal-root:empty { display: none; }
    .modal-root { 
      position: fixed; inset: 0; z-index: 100; 
      display: flex; flex-direction: column; justify-content: flex-end; /* נדבק למטה במובייל */
      background: rgba(18, 16, 44, .6); 
      backdrop-filter: blur(4px);
    }
    .modal { 
      width: 100%; 
      max-height: 90vh; 
      overflow-y: auto; 
      background: #fff; 
      border-radius: 28px 28px 0 0; /* פינות רק למעלה */
      padding: 24px; 
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); 
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .close { margin-bottom: 16px; }
    .timer-big { font-size: 3.5rem; font-weight: 900; text-align: center; margin: 20px 0; color: var(--brand2); font-variant-numeric: tabular-nums; }
    .guide-box { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: #fbfaff; }
    .guide-steps { margin: 12px 0; padding-right: 20px; line-height: 1.8; }
    .footer { margin-top: 24px; color: var(--muted); text-align: center; font-size: .85rem; padding-bottom: 20px; }

    /* ========================================================= */
    /* ================ TABLET & DESKTOP (Min-width: 768px) ==== */
    /* ========================================================= */
    @media (min-width: 768px) {
      body { background: radial-gradient(circle at top left, rgba(91, 91, 214, .1), transparent 32rem), radial-gradient(circle at bottom right, rgba(246, 187, 80, .1), transparent 34rem), var(--bg); }
      .app { max-width: 1100px; padding: 32px 24px 80px; }
      
      .hero { flex-direction: row; align-items: center; justify-content: space-between; padding: 32px; border-radius: 32px; }
      .hero h1 { font-size: 2.2rem; }
      .hero p { font-size: 1.1rem; }
      .status-pill { align-self: center; font-size: 1rem; padding: 8px 20px; }
      
      .tabs { position: relative; margin: 24px 0; padding: 12px; border-radius: 24px; }
      .tab { min-height: 70px; font-size: 1.1rem; }
      .tab small { display: block; font-weight: 500; font-size: 0.85rem; margin-top: 4px; opacity: 0.8; }
      
      .grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
      .row { flex-direction: row; align-items: center; }
      .btn { width: auto; min-width: 140px; }
      
      .list-head { flex-direction: row; justify-content: space-between; text-align: right; }
      .task-card { 
        flex-direction: row; 
        align-items: center;
        grid-template-columns: 140px 1fr auto;
        display: grid;
        padding: 20px 24px; 
      }
      .time-box { flex-direction: column; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: white; }
      .time-box span { background: none; padding: 0; }
      .task-actions { width: auto; justify-content: flex-end; }
      
      .modal-root { justify-content: center; align-items: center; padding: 24px; }
      .modal { 
        width: min(100%, 700px); 
        border-radius: 28px; 
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      .close { float: left; margin: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="mark" id="mark">✦</div>
        <div>
          <h1>عائلة هيرو</h1>
          <p id="subtitle">لوحة تحكم هادئة وخطة يومية ذكية.</p>
        </div>
      </div>
      <div class="status-pill" id="datePill">اليوم</div>
    </header>

    <nav class="tabs" aria-label="أقسام التطبيق">
      <button class="tab" data-area="parent" type="button">الآباء<small>الإدارة والتخطيط</small></button>
      <button class="tab" data-area="yaman" type="button">يمان<small>مهامي وخطواتي</small></button>
      <button class="tab" data-area="judy" type="button">جودي<small>مهامي وخطواتي</small></button>
    </nav>

    <section id="root" class="stack"></section>

    <footer class="footer">نظام هيرو يعرض اليوم بوضوح: الوقت، المهمة، المؤقت، الحالة، والخطوات للتنفيذ. v32</footer>
  </main>

  <div class="modal-root" id="modalRoot"></div>

  <script>
    (() => {
      "use strict";

      const PEOPLE = {
        parent: { name: "الآباء", mark: "✦", sub: "لوحة تحكم هادئة وخطة يومية ذكية." },
        yaman: { name: "يمان", mark: "Y", sub: "خطوة واحدة واضحة في كل مرة." },
        judy: { name: "جودي", mark: "J", sub: "ألوان مريحة وخطوات مشجعة." }
      };

      const TYPES = {
        study: ["دراسة", 15],
        home: ["مسؤولية في المنزل", 10],
        creative: ["إبداع", 15],
        movement: ["حركة", 10],
        social: ["مهارة اجتماعية", 10],
        routine: ["روتين", 5],
        other: ["مهمة", 5]
      };

      const qs = new URLSearchParams(location.search);
      let area = qs.get("area") || localStorage.getItem("hero-area") || "parent";
      let family = {};
      let tick = {};
      let dashboard = null;
      let child = { yaman: null, judy: null };
      let projects = [];
      let chosenProjects = new Set();
      let importTasks = [];
      let chosenTasks = new Set();
      let activeTimer = null;
      let timerPaused = false;

      const today = () => {
        const d = new Date();
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
      };

      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[m]));

      async function api(url, opts = {}) {
        const response = await fetch(url, {
          ...opts,
          credentials: "include",
          cache: "no-store",
          headers: { "Content-Type": "application/json", ...(opts.headers || {}) }
        });
        const text = await response.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch {}
        if (!response.ok) throw new Error(body?.error || "حدث خطأ أثناء تنفيذ العملية.");
        return body;
      }

      async function load() {
        const [familyStatus, tickStatus] = await Promise.all([
          api("/api/family/status").catch(() => ({})),
          api("/api/ticktick/status").catch(() => ({ configured: false, connected: false }))
        ]);
        family = familyStatus;
        tick = tickStatus;
        dashboard = null;
        child = { yaman: null, judy: null };
        if (family.parentAuthenticated) {
          dashboard = await api(`/api/family/dashboard?date=${today()}`).catch(() => null);
        }
        for (const member of ["yaman", "judy"]) {
          if (family.parentAuthenticated || family[`${member}Authenticated`]) {
            child[member] = await api(`/api/family/child/${member}?date=${today()}`).catch(() => null);
          }
        }
      }

      function paintTop() {
        document.body.dataset.area = area;
        document.getElementById("mark").textContent = PEOPLE[area].mark;
        document.getElementById("subtitle").textContent = PEOPLE[area].sub;
        document.getElementById("datePill").textContent = new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        document.querySelectorAll(".tab").forEach((button) => button.classList.toggle("active", button.dataset.area === area));
      }

      function tickCard() {
        if (!tick.configured) return `<article class="notice">TickTick غير مهيأ في Railway. الواجهة تعمل، لكن المزامنة لن تعمل حتى تكتمل المتغيرات.</article>`;
        if (!tick.connected) return `<article class="card"><span class="eyebrow">TickTick</span><h3>غير متصل في هذا المتصفح</h3><p class="muted">بعد الاتصال: سنقوم بالاستيراد من TickTick ونرسل إليه مهام هيرو الجديدة.</p><div class="row"><a class="btn btn-primary" href="/auth/ticktick">اتصال بـ TickTick</a></div></article>`;
        return `<article class="notice ok">TickTick متصل ✓ — الاستيراد والإرسال وإكمال المهام تعمل في هذا المتصفح.</article>`;
      }

      function parentLogin() {
        const err = qs.get("parentLogin") === "invalid" ? "رمز الآباء غير صحيح." : qs.get("parentLogin") === "not_configured" ? "PARENT_PIN غير مهيأ في Railway." : "";
        return `<div class="stack">${tickCard()}<article class="card login glow"><span class="eyebrow">منطقة الآباء</span><h2>إدارة مهام يمان وجودي</h2><p class="muted">اكتب الرمز مباشرة في المربع. التصميم متوافق مع الهاتف المحمول.</p><form class="form" action="/auth/parent/login" method="post" autocomplete="off" data-login-kind="parent"><label>رمز الآباء<input class="pin-input" id="parentPinInput" name="pin" type="text" inputmode="numeric" enterkeyhint="go" maxlength="12" required autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="اكتب الرمز"></label><button class="btn btn-primary" type="submit">فتح منطقة الآباء</button><p class="login-error">${err}</p></form></article></div>`;
      }

      function childLogin(member) {
        const key = member === "yaman" ? "YAMAN_PIN" : "JUDY_PIN";
        const err = qs.get("childLogin") === "invalid" ? "رمز الدخول غير صحيح." : qs.get("childLogin") === "not_configured" ? `${key} غير مهيأ في Railway.` : "";
        const inputId = `childPin-${member}`;
        if (!family[`${member}PinConfigured`]) return `<article class="card"><span class="eyebrow">${PEOPLE[member].name}</span><h2>رمز الدخول غير مهيأ</h2><p class="muted">أضف ${key} في Railway أولاً.</p></article>`;
        return `<article class="card login glow"><span class="eyebrow">${PEOPLE[member].name}</span><h2>أدخل رمز الدخول</h2><p class="muted">اكتب الرمز في المربع باستخدام لوحة المفاتيح.</p><form class="form" action="/auth/child/${member}/login" method="post" autocomplete="off" data-login-kind="child" data-member="${member}"><label>رمز ${PEOPLE[member].name}<input class="pin-input" id="${inputId}" name="pin" type="text" inputmode="numeric" enterkeyhint="go" maxlength="12" required autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="اكتب الرمز"></label><button class="btn btn-primary" type="submit">فتح منطقتي</button><p class="login-error">${err}</p></form></article>`;
      }

      function score(tasks = []) {
        return tasks.filter((task) => task.done).reduce((sum, task) => sum + Number(task.points || 0), 0);
      }

      function minutesFromTime(time) {
        if (!/^\d{2}:\d{2}$/.test(String(time || ""))) return null;
        const [hours, minutes] = String(time).split(":").map(Number);
        return hours * 60 + minutes;
      }

      function timeFromMinutes(total) {
        const value = ((Number(total) || 0) + 24 * 60) % (24 * 60);
        return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
      }

      function taskEndTime(task) {
        const start = minutesFromTime(task.suggestedTime);
        const duration = Math.max(0, Number(task.timerMinutes || 0));
        if (start === null || duration <= 0) return "";
        return timeFromMinutes(start + duration);
      }

      function taskTimeRange(task) {
        if (!task.suggestedTime) return "بدون وقت محدد";
        const end = taskEndTime(task);
        return end ? `${task.suggestedTime}–${end}` : `${task.suggestedTime}`;
      }

      function sortedTasks(tasks = []) {
        return [...tasks].sort((a, b) => {
          const at = minutesFromTime(a.suggestedTime);
          const bt = minutesFromTime(b.suggestedTime);
          if (at === null && bt === null) return String(a.title).localeCompare(String(b.title), "ar");
          if (at === null) return 1;
          if (bt === null) return -1;
          return at - bt || String(a.title).localeCompare(String(b.title), "ar");
        });
      }

      function taskBadges(task) {
        const parts = [];
        parts.push(`<span class="badge-mini ${task.done ? "status-done" : "status-open"}">${task.done ? "الحالة: مكتمل ✓" : "الحالة: قيد الانتظار"}</span>`);
        if (task.suggestedTime) parts.push(`<span class="badge-mini">من–إلى ${esc(taskTimeRange(task))}</span>`);
        if (Number(task.timerMinutes) > 0) parts.push(`<span class="badge-mini">⏱ ${Number(task.timerMinutes)} دقيقة</span>`);
        if (task.source === "chatgpt") parts.push(`<span class="badge-mini">ChatGPT</span>`);
        if (task.ticktickTaskId) parts.push(`<span class="badge-mini">TickTick</span>`);
        return `<div class="task-badges">${parts.join("")}</div>`;
      }

      function getTaskGuide(task) {
        const title = String(task.title || "");
        const type = task.type || "other";
        const common = [
          "اقرأ اسم المهمة مرة واحدة بهدوء.",

            tip: "استخدم المؤقت كصديق يساعدك على البدء، وليس كضغط."
          };
        }

        if (/دبلجة|صوت|تسجيل|رسم|فيديو/.test(title) || type === "creative") {
          return {
            title: "كيفية تنفيذ مهمة إبداعية",
            intro: "الإبداع يتطلب تجربة صغيرة، وليس نتيجة مثالية في المرة الأولى.",
            steps: ["اختر فكرة أو شخصية واحدة فقط.", "اكتب أو قل جملة قصيرة.", "جرب ذلك مرة بصوت عادي ومرة بصوت الشخصية.", "احتفظ بمحاولة واحدة حتى لو لم تكن مثالية."],

        if (/ترتيب|غرفة|حقيبة|منزل|مساعدة/.test(title) || type === "home" || type === "routine") {
          return {
            title: "كيفية تنفيذ مهمة منزلية أو روتين",
            intro: "سنقسم المهمة إلى زاوية صغيرة أو شيء واحد فقط.",
            steps: ["حدد المكان أو الشيء المطلوب.", "انقل شيئاً واحداً ليس في مكانه.", "رتب لفترة قصيرة فقط.", "أبلغ أحد الوالدين عند الانتهاء."],
            tip: "ترتيب صغير كل يوم أفضل من ترتيب كبير مرة واحدة."

          return {
            title: "كيفية تنفيذ مهمة حركية",
            intro: "الحركة تساعد الجسم والعقل على الاسترخاء.",
            steps: ["اشرب بعض الماء.", "ابدأ بحركة خفيفة لمدة دقيقة واحدة.", "قم بالحركة المطلوبة بدون ضغط.", "خذ نفساً هادئاً بعد الانتهاء."],
            tip: "الأهم هو التحرك بأمان، وليس السرعة."
          };
        }

        if (type === "social") {
          return {
            title: "كيفية تنفيذ مهمة اجتماعية",
            intro: "مهارة اجتماعية قصيرة تكفي. جملة واحدة جيدة تعتبر تقدماً.",
            steps: ["اختر شخصاً تثق به.", "قل الجملة بصوت هادئ.", "انتظر الإجابة بدون ضغط.", "قل شكراً أو ابتسم وأنهِ."],
            tip: "لا يجب أن تكون المحادثة طويلة. البداية الصغيرة ممتازة."
          };
        }

        return { title: "كيفية تنفيذ المهمة", intro: "لنبدأ بأصغر خطوة ممكنة.", steps: common, tip: "فقط ابدأ. بعد البداية كل شيء يصبح أسهل." };
      }

      function taskRows(tasks, member, parent = false) {
        const ordered = sortedTasks(tasks || []);
        if (!ordered.length) return `<li class="empty">لا توجد مهام اليوم. اطلب من الآباء إنشاء خطة ذكاء اصطناعي.</li>`;
        return ordered.map((task) => `
          <li>
            <button class="task-card ${task.done ? "done" : ""}" type="button" data-action="task-guide" data-member="${member}" data-id="${task.id}">
              <span class="time-box"><span>${esc(taskTimeRange(task))}</span><small>${Number(task.timerMinutes) > 0 ? `${Number(task.timerMinutes)} دقيقة` : "بدون مؤقت"}</small></span>
              <span class="task-main">
                <h3>${esc(task.title)}</h3>
                <p>${esc(TYPES[task.type]?.[0] || "مهمة")} · ${Number(task.points || 0)} نقاط</p>
                ${taskBadges(task)}
                ${task.note ? `<p style="margin-top:8px;">${esc(task.note)}</p>` : ""}
              </span>
              <span class="task-actions">
                ${Number(task.timerMinutes) > 0 && !task.done ? `<span class="btn btn-soft" data-action="timer" data-minutes="${Number(task.timerMinutes)}" data-title="${esc(task.title)}">مؤقت</span>` : ""}
                ${task.done ? `<span class="btn btn-line">مكتمل ✓</span>` : `<span class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${task.id}">انتهيت</span>`}
                ${parent ? `<span class="btn btn-danger" data-action="delete-task" data-id="${task.id}">حذف</span>` : ""}
              </span>
            </button>
          </li>
        `).join("");
      }

      function parentView() {
        if (!family.parentAuthenticated) return parentLogin();
        if (!dashboard) return `<article class="card"><h2>لا يمكن تحميل لوحة التحكم</h2><button class="btn btn-primary" data-action="reload">حاول مرة أخرى</button></article>`;
        const summary = dashboard.summary;
        const yamanTasks = child.yaman?.tasks || [];
        const judyTasks = child.judy?.tasks || [];
        return `<div class="stack">
          ${tickCard()}
          <article class="card glow">
            <span class="eyebrow">مدرب يومي ذكاء اصطناعي</span>
            <h2>خطة يومية ذكية ومشجعة</h2>
            <p class="muted">يتم عرض الخطة كجدول زمني، مع مؤقتات وحالات وتعليمات تنفيذ عند النقر على مهمة.</p>
            <div class="row"><button class="btn btn-primary" data-action="ai-plan">إنشاء خطة لليوم</button><button class="btn btn-soft" data-action="end-day-parent">ملخص يوم مشجع</button></div>
          </article>
          <article class="card">
            <span class="eyebrow">لوحة تحكم - العائلة</span>
            <h2>إدارة المهام</h2>
            <div class="grid">
              <div class="metric"><strong>${summary.yaman.done}/${summary.yaman.total}</strong><span>يمان · ${score(yamanTasks)} نقطة</span></div>
              <div class="metric"><strong>${summary.judy.done}/${summary.judy.total}</strong><span>جودي · ${score(judyTasks)} نقطة</span></div>
            </div>
            <div class="row" style="margin-top:16px">
              <button class="btn btn-primary" data-action="add-task">إضافة مهمة</button>
              <button class="btn btn-soft" data-action="add-event">إضافة حدث</button>
              <button class="btn btn-line" data-action="projects">قوائم TickTick</button>
              <button class="btn btn-line" data-action="import">استيراد من TickTick</button>

      function childView(member) {
        if (!family.parentAuthenticated && !family[`${member}Authenticated`]) return childLogin(member);
        const data = child[member];
        if (!data) return `<article class="card"><h2>جاري تحميل البيانات...</h2></article>`;
        return `<div class="stack">
          <article class="card glow">
            <span class="eyebrow">منطقة ${PEOPLE[member].name}</span>
            <h2>لوحة مهامي لليوم</h2>

      function render() {

      async function refresh() {
        await load();
        render();
      }

      function modal(html) {
        document.getElementById("modalRoot").innerHTML = `<section class="modal"><button class="btn btn-line close" data-action="close" type="button">إغلاق X</button>${html}</section>`;
      }

      function close() {
        document.getElementById("modalRoot").innerHTML = "";
      }

      function findTask(member, id) {
        return (child[member]?.tasks || []).find((task) => String(task.id) === String(id));
      }

        const task = findTask(member, id) || findTask("yaman", id) || findTask("judy", id);

        const guide = getTaskGuide(task);
        modal(`
          <h2>${esc(task.title)}</h2>
          <p class="muted">${esc(guide.intro)}</p>
          <div class="grid">
            <div class="metric"><strong>${esc(taskTimeRange(task))}</strong><span>ساعات التنفيذ</span></div>
            <div class="metric"><strong>${task.done ? "مكتمل ✓" : "قيد الانتظار"}</strong><span>الحالة</span></div>
          </div>
          <div class="guide-box" style="margin-top:16px">
            <h3>${esc(guide.title)}</h3>
            <ol class="guide-steps">${guide.steps.map((step) => `<li>${esc(step)}</li>`).join("")}</ol>

          </div>

            ${task.done ? `<span class="btn btn-line">تم بنجاح ✓</span>` : `<button class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${task.id}" type="button">انتهيت!</button>`}
          </div>

        modal(`<h2>إضافة مهمة جديدة</h2>
        <form class="form" id="taskForm">
          <label>لمن؟<select id="taskMember"><option value="yaman">يمان</option><option value="judy">جودي</option></select></label>

        modal(`<h2>إضافة حدث</h2>
        <form class="form" id="eventForm">
          <label>لمن؟<select id="eventMember"><option value="family">كل العائلة</option><option value="yaman">يمان</option><option value="judy">جودي</option></select></label>
          <label>العنوان<input id="eventTitle" required></label>

      function aiPlan() {
        modal(`<h2>إنشاء خطة يومية (الذكاء الاصطناعي)</h2>
        <p class="muted">اختر عدد المهام لكل طفل (حتى 10)، واكتب تعليمات للذكاء الاصطناعي. حدد أوقاتاً دقيقة إذا لزم الأمر (مثال: 16:00 إلى 16:20).</p>
        <form class="form" id="planForm">
          <label>عدد المهام لكل طفل (حتى 10)<input id="planTaskCount" type="number" min="1" max="10" value="3" required></label>
          <label>ماذا ستشمل الخطة؟<textarea id="planInstructions" maxlength="900" placeholder="مثال: يمان يحتاج رياضيات الساعة 16:30 لمدة 20 دقيقة. جودي قراءة 15 دقيقة."></textarea></label>
          <button class="btn btn-primary" type="submit">إنشاء الخطة الآن</button>
        </form>`);
      }

      async function generatePlan(taskCount, instructions) {
        modal(`<h2>هيرو يجهز الخطة...</h2><p class="muted">قد يستغرق هذا حتى 12 ثانية.</p><div class="timer-big">⏳</div>`);
        try {
          const result = await api("/api/ai/daily-plan", { method: "POST", body: JSON.stringify({ date: today(), taskCount, instructions }) });
          modal(`<h2>الخطة جاهزة!</h2><p class="muted">${esc(result.plan.familyMessage)} ${result.warning ? esc(result.warning) : ""}</p><p>تمت إضافة ${result.inserted.length} مهام جديدة. المصدر: ${result.source === "openai" ? "OpenAI" : "خطة محلية (Fallback)"}</p><button class="btn btn-primary" data-action="reload" type="button">عرض الجدول الزمني</button>`);
          await refresh();
        } catch (error) {
          modal(`<h2>خطأ في إنشاء الخطة</h2><p class="muted">${esc(error.message || "حدث خطأ مؤقت.")}</p><button class="btn btn-primary" data-action="reload" type="button">العودة للوحة</button>`);
        }
      }

      async function endDay(member) {
        const result = await api(`/api/ai/end-day/${member}?date=${today()}`);
        modal(`<h2>ملخص اليوم — ${PEOPLE[member].name}</h2><p class="muted">${esc(result.summary.encouragement)}</p><div class="grid"><div class="metric"><strong>${result.summary.points}</strong><span>نقاط اليوم</span></div><div class="metric"><strong>${result.summary.done}/${result.summary.total}</strong><span>مهام مكتملة</span></div></div><p>${esc(result.summary.nextStep || "")}</p>`);
      }

      async function endDayParent() {
        const yaman = await api(`/api/ai/end-day/yaman?date=${today()}`);
        const judy = await api(`/api/ai/end-day/judy?date=${today()}`);
        modal(`<h2>ملخص يوم عائلي</h2>
          <article class="notice ok" style="margin-bottom:12px"><strong>يمان</strong><br>${esc(yaman.summary.encouragement)}</article>
          <article class="notice ok"><strong>جودي</strong><br>${esc(judy.summary.encouragement)}</article>
        `);
      }

      async function projectsModal() {
        if (!tick.connected) { modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">اتصل بـ TickTick</a>`); return; }
        projects = (await api("/api/ticktick/projects")).projects || [];
        chosenProjects = new Set(JSON.parse(localStorage.getItem("hero-projects") || "[]"));
        if (!chosenProjects.size) projects.forEach((project) => chosenProjects.add(project.id));
        drawProjects();
      }

      function drawProjects() {
        modal(`<h2>اختر قوائم من TickTick للاستيراد</h2><div class="stack" style="margin-bottom:16px;">${projects.map((project) => `<button class="card row" style="justify-content:space-between; padding:12px 16px; border-color:${chosenProjects.has(project.id) ? 'var(--brand)' : 'var(--line)'}; background:${chosenProjects.has(project.id) ? 'var(--soft)' : '#fff'};" data-action="toggle-project" data-id="${project.id}" type="button"><span>${esc(project.name)}</span><strong>${chosenProjects.has(project.id) ? "✓" : ""}</strong></button>`).join("")}</div><button class="btn btn-primary" data-action="save-projects" type="button">حفظ الاختيار</button>`);
      }

      async function importModal() {
        if (!tick.connected) { modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">اتصل بـ TickTick</a>`); return; }
        const ids = JSON.parse(localStorage.getItem("hero-projects") || "[]");
        const query = ids.length ? `?projectIds=${encodeURIComponent(ids.join(","))}` : "";
        importTasks = (await api(`/api/ticktick/today-tasks${query}`)).tasks || [];
        chosenTasks = new Set();
        drawImport();
      }

      function drawImport() {
        modal(`<h2>اختر مهام لليوم من TickTick</h2><div class="stack" style="margin-bottom:16px;">${importTasks.length ? importTasks.map((task) => `<button class="card row" style="justify-content:space-between; padding:12px 16px; border-color:${chosenTasks.has(task.projectId + ":" + task.id) ? 'var(--brand)' : 'var(--line)'}; background:${chosenTasks.has(task.projectId + ":" + task.id) ? 'var(--soft)' : '#fff'}; text-align:right;" data-action="toggle-import" data-key="${task.projectId}:${task.id}" type="button"><span><strong>${esc(task.title)}</strong><br><small class="muted">${esc(task.projectName)}</small></span><b>${chosenTasks.has(task.projectId + ":" + task.id) ? "✓" : ""}</b></button>`).join("") : `<p class="empty">لا توجد مهام اليوم في TickTick.</p>`}</div><div class="row"><button class="btn btn-primary" data-action="assign-import" data-member="yaman" type="button">تعيين ليمان</button><button class="btn btn-primary" data-action="assign-import" data-member="judy" type="button">تعيين لجودي</button></div>`);
      }

      function startTaskTimer(minutes, title) {
        const total = Math.max(1, Math.round(Number(minutes) || 1)) * 60;
        let left = total;
        timerPaused = false;
        if (activeTimer) clearInterval(activeTimer);
        const fmt = (seconds) => `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        modal(`<h2>مؤقت المهمة</h2><p class="muted">${esc(title || "مهمة تركيز")}</p><div class="timer-big" id="timerDisplay">${fmt(left)}</div><p class="muted">عندما ينتهي المؤقت، خذ استراحة قصيرة واضغط على "انتهيت" إذا أنهيت المهمة.</p><div class="row"><button class="btn btn-soft" data-action="pause-timer" type="button">إيقاف مؤقت</button><button class="btn btn-line" data-action="close" type="button">إغلاق المؤقت</button></div>`);
        activeTimer = setInterval(() => {
          if (timerPaused) return;
          left -= 1;
          const el = document.getElementById("timerDisplay");
          if (el) el.textContent = fmt(Math.max(0, left));
          if (left <= 0) {
            clearInterval(activeTimer);
            activeTimer = null;
            if (el) el.textContent = "انتهى ✓";
          }
        }, 1000);
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-area],[data-action]");
        if (!button) return;

        if (button.dataset.area) {
          area = button.dataset.area;
          localStorage.setItem("hero-area", area);
          
          try {
            history.replaceState(null, "", `?area=${area}`);
          } catch (e) {
            console.warn("Could not update history state due to environment restrictions", e);
          }
          
          render();
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        const action = button.dataset.action;

        if (action === "close") {
          if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
          close();
          return;
        }
        if (action === "pause-timer") {
          timerPaused = !timerPaused;
          button.textContent = timerPaused ? "متابعة" : "إيقاف مؤقت";
          return;
        }
        if (action === "reload") { close(); await refresh(); return; }
        if (action === "task-guide") { taskGuideModal(button.dataset.member, button.dataset.id); return; }
        if (action === "timer") { startTaskTimer(button.dataset.minutes, button.dataset.title); return; }
        if (action === "ai-plan") { aiPlan(); return; }
        if (action === "end-day") { await endDay(button.dataset.member); return; }
        if (action === "end-day-parent") { await endDayParent(); return; }
        if (action === "add-task") { addTaskModal(); return; }
        if (action === "add-event") { addEventModal(); return; }
        if (action === "projects") { await projectsModal(); return; }
        if (action === "import") { await importModal(); return; }
        if (action === "toggle-project") { chosenProjects.has(button.dataset.id) ? chosenProjects.delete(button.dataset.id) : chosenProjects.add(button.dataset.id); drawProjects(); return; }
        if (action === "save-projects") { localStorage.setItem("hero-projects", JSON.stringify([...chosenProjects])); close(); return; }
        if (action === "toggle-import") { chosenTasks.has(button.dataset.key) ? chosenTasks.delete(button.dataset.key) : chosenTasks.add(button.dataset.key); drawImport(); return; }
        if (action === "assign-import") {
          const member = button.dataset.member;
          for (const key of chosenTasks) {
            const task = importTasks.find((item) => `${item.projectId}:${item.id}` === key);
            if (task) {
              await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: member, title: task.title, type: "other", points: 5, date: today(), note: task.content || "تم الاستيراد من TickTick", source: "ticktick", ticktickTaskId: task.id, ticktickProjectId: task.projectId, ticktickProjectName: task.projectName, timerMinutes: 0, suggestedTime: "" }) });
            }
          }
          close();
          await refresh();
          return;
        }
        if (action === "complete") {
          await api(`/api/family/tasks/${button.dataset.id}/complete`, { method: "PATCH", body: JSON.stringify({ assignee: button.dataset.member }) });
          close();
          await refresh();
          return;
        }
        if (action === "delete-task") {
          if (confirm("هل تريد حذف المهمة؟")) {
            await api(`/api/family/tasks/${button.dataset.id}`, { method: "DELETE" });
            await refresh();
          }
          return;
        }
        if (action === "logout-parent") { await api("/api/family/parent/logout", { method: "POST" }); await refresh(); return; }
        if (action === "logout-child") { await api(`/api/family/child/${button.dataset.member}/logout`, { method: "POST" }); await refresh(); return; }
      });

      async function submitLoginForm(form) {
        const kind = form.dataset.loginKind;
        const member = form.dataset.member || "";
        const input = form.querySelector('input[name="pin"]');
        const errorEl = form.querySelector(".login-error");
        const button = form.querySelector('button[type="submit"]');
        const pin = String(input?.value || "").replace(/[^0-9]/g, "").trim();

        if (!pin) {
          if (errorEl) errorEl.textContent = "اكتب الرمز أولاً.";
          input?.focus();
          return;
        }

        if (button) {
          button.disabled = true;
          button.textContent = "جارٍ الفتح...";
        }
        if (errorEl) errorEl.textContent = "";

        try {
          if (kind === "parent") {
            await api("/api/family/parent/login", {
              method: "POST",
              body: JSON.stringify({ pin })
            });
            area = "parent";
          } else {
            await api(`/api/family/child/${member}/login`, {
              method: "POST",
              body: JSON.stringify({ pin })
            });
            area = member;
          }

          localStorage.setItem("hero-area", area);
          try { history.replaceState(null, "", `?area=${area}&login=opened`); } catch {}
          await refresh();
        } catch (error) {
          if (errorEl) {
            errorEl.textContent = error.message || "لم يتم فتح المنطقة. تحقق من الرمز.";
          }
          if (button) {
            button.disabled = false;
            button.textContent = kind === "parent" ? "فتح منطقة الآباء" : "فتح منطقتي";
          }
          input?.focus();
        }
      }

      document.addEventListener("submit", async (event) => {
        if (event.target.matches('[data-login-kind]')) {
          event.preventDefault();
          await submitLoginForm(event.target);
          return;
        }

        if (event.target.id === "planForm") {
          event.preventDefault();
          const rawCount = Number(document.getElementById("planTaskCount").value);
          const taskCount = Math.min(10, Math.max(1, Number.isFinite(rawCount) ? Math.round(rawCount) : 3));
          const instructions = document.getElementById("planInstructions").value.trim();
          await generatePlan(taskCount, instructions);
          return;
        }

        if (event.target.id === "taskForm") {
          event.preventDefault();
          const type = document.getElementById("taskType").value;
          await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("taskMember").value, title: document.getElementById("taskTitle").value, type, points: TYPES[type][1], date: today(), note: document.getElementById("taskNote").value, suggestedTime: document.getElementById("taskSuggestedTime").value, timerMinutes: Number(document.getElementById("taskTimerMinutes").value) || 0, source: "parent" }) });
          close();
          await refresh();
          return;
        }

        if (event.target.id === "eventForm") {
          event.preventDefault();
          await api("/api/family/events", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("eventMember").value, title: document.getElementById("eventTitle").value, date: document.getElementById("eventDate").value, time: document.getElementById("eventTime").value }) });
          close();
          await refresh();
        }
      });


      function activatePinFields() {
        document.querySelectorAll(".pin-input").forEach((input) => {
          input.removeAttribute("readonly");
          input.disabled = false;
          input.tabIndex = 0;
          input.style.pointerEvents = "auto";
          input.style.touchAction = "manipulation";

          if (input.dataset.pinReady === "1") {
            return;
          }

          input.dataset.pinReady = "1";

          const focusNow = () => {
            if (document.activeElement !== input) {
              input.focus({ preventScroll: true });
            }
          };

          // חשוב למובייל: הפוקוס חייב לקרות בתוך אירוע המגע עצמו, בלי setTimeout.
          input.addEventListener("pointerdown", focusNow);
          input.addEventListener("touchstart", focusNow, { passive: true });
          input.addEventListener("mousedown", focusNow);
          input.addEventListener("click", focusNow);

          input.addEventListener("input", () => {
            input.value = input.value.replace(/[^0-9]/g, "").slice(0, 12);
          });
        });
      }

      refresh().catch((error) => {
        document.getElementById("root").innerHTML = `<article class="card"><h2>خطأ في تحميل التطبيق</h2><p class="muted">${esc(error.message)}</p></article>`;
      });
    })();
  </script>
</body>
</html>
