<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Hero Family — خطة اليوم</title>
  <style>
    :root {
      --bg: #f7f6ff;
      --card: rgba(255, 255, 255, 0.94);
      --ink: #20243f;
      --muted: #69708c;
      --line: #e4e3f0;
      --brand: #5b5bd6;
      --brand2: #332f85;
      --soft: #f0efff;
      --ok: #15976d;
      --danger: #c93f64;
      --gold: #f6bb50;
      --shadow: 0 24px 70px rgba(43, 38, 120, 0.13);
      --radius: 28px;
    }

    * { box-sizing: border-box; }
    html { direction: rtl; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.7;
      text-align: right;
      background:
        radial-gradient(circle at top left, rgba(91, 91, 214, .18), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(246, 187, 80, .16), transparent 34rem),
        linear-gradient(180deg, #fbfbff, var(--bg));
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    input, select, textarea {
      width: 100%;
      min-height: 54px;
      border: 1px solid #cdd2e7;
      border-radius: 16px;
      padding: 12px 14px;
      background: white;
      color: var(--ink);
      direction: rtl;
      text-align: right;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 3px solid rgba(91, 91, 214, .25);
      outline-offset: 2px;
    }

    .app { width: min(100% - 24px, 1160px); margin: 0 auto; padding: 16px 0 64px; }
    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 24px;
      border-radius: 34px;
      background: linear-gradient(135deg, var(--brand2), var(--brand));
      color: white;
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: auto -70px -110px auto;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
    }
    .hero > * { position: relative; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .mark {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 22px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .25);
      font-size: 1.35rem;
      font-weight: 900;
    }
    .hero h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2.05rem); }
    .hero p { margin: 5px 0 0; color: #efedff; }
    .status-pill { padding: 9px 13px; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 800; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: 16px 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 12px 28px rgba(55, 44, 142, .07);
    }
    .tab { min-height: 62px; border: 0; border-radius: 18px; background: transparent; color: var(--muted); font-weight: 900; }
    .tab.active { background: var(--brand); color: white; }
    .tab small { display: block; font-weight: 500; }

    .stack { display: grid; gap: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 26px rgba(31, 35, 64, .06);
      padding: 22px;
    }
    .card.glow { background: linear-gradient(145deg, #fff, var(--soft)); }
    .card h2 { margin: 0 0 8px; font-size: 1.55rem; }
    .card h3 { margin: 0 0 6px; }
    .eyebrow { display: block; color: var(--brand); font-size: .82rem; font-weight: 900; margin-bottom: 6px; }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 10px 16px;
      font-weight: 900;
      text-align: center;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-soft { background: var(--soft); color: var(--brand2); }
    .btn-ok { background: var(--ok); color: white; }
    .btn-line { background: white; border-color: #cbd0e4; color: var(--ink); }
    .btn-danger { background: #fff0f4; color: var(--danger); border-color: #ecc2cd; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .notice { padding: 15px 17px; border: 1px solid #f1dda6; background: #fff7dc; border-radius: 20px; color: #7a560e; }
    .notice.ok { background: #ecfbf6; border-color: #bee9dd; color: #0d614f; }
    .metric { padding: 18px; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(145deg, #fff, var(--soft)); }
    .metric strong { display: block; font-size: 2rem; line-height: 1; }
    .score-orb { display: grid; place-items: center; width: 86px; height: 86px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #ffe2a3); font-size: 1.8rem; font-weight: 900; color: #6b4400; box-shadow: 0 18px 34px rgba(246, 187, 80, .24); }

    .list { padding: 0; }
    .list-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .timeline { margin: 0; padding: 0; list-style: none; }
    .task-card {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      display: grid;
      grid-template-columns: 132px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px 20px;
      text-align: right;
    }
    .task-card:hover { background: #fbfaff; }
    .task-card.done { background: #f1fbf7; }
    .time-box {
      display: grid;
      gap: 3px;
      justify-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      padding: 10px 8px;
      color: var(--brand2);
      font-weight: 900;
    }
    .time-box small { color: var(--muted); font-weight: 700; }
    .task-main h3 { margin: 0; font-size: 1.06rem; }
    .task-main p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
    .task-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .task-badges { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
    .badge-mini { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 3px 9px; font-size: .82rem; font-weight: 800; color: var(--brand2); }
    .status-open { background: #fff7dc; color: #79550c; }
    .status-done { background: #ecfbf6; color: #0d614f; }
    .empty { padding: 26px; text-align: center; color: var(--muted); }

    .form { display: grid; gap: 13px; }
    .login { max-width: 620px; margin: 0 auto; }
    .login-error { color: var(--danger); font-weight: 800; }

    .modal-root:empty { display: none; }
    .modal-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(18, 16, 44, .58); }
    .modal { width: min(100%, 760px); max-height: calc(100vh - 28px); overflow: auto; background: #fff; border-radius: 28px; padding: 24px; box-shadow: 0 35px 100px rgba(0, 0, 0, .28); }
    .close { float: left; }
    .project-row, .import-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; min-height: 60px; margin: 8px 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; text-align: right; }
    .selected { background: var(--soft); border-color: var(--brand); }
    .ai-banner { border: 1px solid rgba(246, 187, 80, .45); background: linear-gradient(135deg, #fff8e7, #fff, #efedff); }
    .timer-big { font-size: 3rem; font-weight: 900; text-align: center; margin: 12px 0; color: var(--brand2); }
    .guide-steps { margin: 10px 0; padding-right: 22px; line-height: 2; }
    .guide-box { padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: #fbfaff; }
    .footer { margin-top: 22px; color: var(--muted); text-align: center; font-size: .83rem; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .tabs, .grid { grid-template-columns: 1fr; }
      .task-card { grid-template-columns: 1fr; }
      .time-box { justify-items: start; }
      .task-actions { justify-content: stretch; }
      .task-actions .btn, .row .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="mark" id="mark">✦</div>
        <div>
          <h1>Hero Family</h1>
          <p id="subtitle">لوحة قيادة هادئة وخطة يومية ذكية.</p>
        </div>
      </div>
      <div class="status-pill" id="datePill">اليوم</div>
    </header>

    <nav class="tabs" aria-label="مناطق التطبيق">
      <button class="tab" data-area="parent" type="button">الوالدان<small>إدارة وخطة</small></button>
      <button class="tab" data-area="yaman" type="button">يَمان<small>مهامي وخطواتي</small></button>
      <button class="tab" data-area="judy" type="button">جودي<small>مهامي وخطواتي</small></button>
    </nav>

    <section id="root" class="stack"></section>

    <footer class="footer">Hero يعرض اليوم من اليمين لليسار: وقت، مهمة، مؤقت، حالة، وخطوات تنفيذ واضحة.</footer>
  </main>

  <div class="modal-root" id="modalRoot"></div>

  <script>
    (() => {
      "use strict";

      const PEOPLE = {
        parent: { name: "الوالدان", mark: "✦", sub: "لوحة قيادة هادئة وخطة يومية ذكية." },
        yaman: { name: "يَمان", mark: "Y", sub: "خطوة واحدة واضحة في كل مرة." },
        judy: { name: "جودي", mark: "J", sub: "ألوان لطيفة وخطوات مشجعة." }
      };

      const TYPES = {
        study: ["دراسة", 15],
        home: ["مسؤولية", 10],
        creative: ["إبداع", 15],
        movement: ["حركة", 10],
        social: ["مهارة اجتماعية", 10],
        routine: ["روتين", 5],
        other: ["مهمة", 5]
      };

      const qs = new URLSearchParams(location.search);
      let area = qs.get("area") || localStorage.getItem("hero-area") || "parent";
      let family = {};
      let tick = {};
      let dashboard = null;
      let child = { yaman: null, judy: null };
      let projects = [];
      let chosenProjects = new Set();
      let importTasks = [];
      let chosenTasks = new Set();
      let activeTimer = null;
      let timerPaused = false;

      const today = () => {
        const d = new Date();
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
      };

      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[m]));

      async function api(url, opts = {}) {
        const response = await fetch(url, {
          ...opts,
          credentials: "include",
          cache: "no-store",
          headers: { "Content-Type": "application/json", ...(opts.headers || {}) }
        });
        const text = await response.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch {}
        if (!response.ok) throw new Error(body?.error || "تعذر تنفيذ العملية.");
        return body;
      }

      async function load() {
        const [familyStatus, tickStatus] = await Promise.all([
          api("/api/family/status").catch(() => ({})),
          api("/api/ticktick/status").catch(() => ({ configured: false, connected: false }))
        ]);
        family = familyStatus;
        tick = tickStatus;
        dashboard = null;
        child = { yaman: null, judy: null };
        if (family.parentAuthenticated) {
          dashboard = await api(`/api/family/dashboard?date=${today()}`).catch(() => null);
        }
        for (const member of ["yaman", "judy"]) {
          if (family.parentAuthenticated || family[`${member}Authenticated`]) {
            child[member] = await api(`/api/family/child/${member}?date=${today()}`).catch(() => null);
          }
        }
      }

      function paintTop() {
        document.body.dataset.area = area;
        document.getElementById("mark").textContent = PEOPLE[area].mark;
        document.getElementById("subtitle").textContent = PEOPLE[area].sub;
        document.getElementById("datePill").textContent = new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        document.querySelectorAll(".tab").forEach((button) => button.classList.toggle("active", button.dataset.area === area));
      }

      function tickCard() {
        if (!tick.configured) return `<article class="notice">TickTick غير مهيأ في Railway. الواجهة تعمل، لكن المزامنة لن تعمل حتى تكتمل المتغيرات.</article>`;
        if (!tick.connected) return `<article class="card"><span class="eyebrow">TickTick</span><h3>غير متصل في هذا المتصفح</h3><p class="muted">بعد الربط: نستورد من TickTick ونرسل مهام Hero الجديدة إليه.</p><div class="row"><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a></div></article>`;
        return `<article class="notice ok">TickTick متصل ✓ — الاستيراد والإرسال والإكمال تعمل من هذا المتصفح.</article>`;
      }

      function parentLogin() {
        const err = qs.get("parentLogin") === "invalid" ? "رمز الوالدين غير صحيح." : qs.get("parentLogin") === "not_configured" ? "PARENT_PIN غير مهيأ في Railway." : "";
        return `<div class="stack">${tickCard()}<article class="card login glow"><span class="eyebrow">منطقة الوالدين</span><h2>إدارة مهام يَمان وجودي</h2><p class="muted">اكتب رمز الوالدين من لوحة المفاتيح. الاتجاه RTL مضبوط.</p><form class="form" action="/auth/parent/login" method="post"><label>رمز الوالدين<input name="pin" type="tel" inputmode="numeric" minlength="4" required autocomplete="one-time-code" placeholder="اكتب الرمز هنا" autofocus></label><button class="btn btn-primary" type="submit">فتح منطقة الوالدين</button><p class="login-error">${err}</p></form></article></div>`;
      }

      function childLogin(member) {
        const key = member === "yaman" ? "YAMAN_PIN" : "JUDY_PIN";
        if (!family[`${member}PinConfigured`]) return `<article class="card"><span class="eyebrow">${PEOPLE[member].name}</span><h2>رمز الدخول غير مهيأ</h2><p class="muted">أضف ${key} في Railway أولاً.</p></article>`;
        return `<article class="card login glow"><span class="eyebrow">${PEOPLE[member].name}</span><h2>أدخل رمز الدخول</h2><form class="form" id="childLoginForm" data-member="${member}"><label>رمز ${PEOPLE[member].name}<input id="childPin" type="tel" inputmode="numeric" minlength="4" required placeholder="اكتب الرمز هنا" autofocus></label><button class="btn btn-primary" type="submit">فتح منطقتي</button><p id="childErr" class="login-error"></p></form></article>`;
      }

      function score(tasks = []) {
        return tasks.filter((task) => task.done).reduce((sum, task) => sum + Number(task.points || 0), 0);
      }

      function minutesFromTime(time) {
        if (!/^\d{2}:\d{2}$/.test(String(time || ""))) return null;
        const [hours, minutes] = String(time).split(":").map(Number);
        return hours * 60 + minutes;
      }

      function timeFromMinutes(total) {
        const value = ((Number(total) || 0) + 24 * 60) % (24 * 60);
        return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
      }

      function taskEndTime(task) {
        const start = minutesFromTime(task.suggestedTime);
        const duration = Math.max(0, Number(task.timerMinutes || 0));
        if (start === null || duration <= 0) return "";
        return timeFromMinutes(start + duration);
      }

      function taskTimeRange(task) {
        if (!task.suggestedTime) return "بدون وقت";
        const end = taskEndTime(task);
        return end ? `${task.suggestedTime}–${end}` : `${task.suggestedTime}`;
      }

      function sortedTasks(tasks = []) {
        return [...tasks].sort((a, b) => {
          const at = minutesFromTime(a.suggestedTime);
          const bt = minutesFromTime(b.suggestedTime);
          if (at === null && bt === null) return String(a.title).localeCompare(String(b.title), "ar");
          if (at === null) return 1;
          if (bt === null) return -1;
          return at - bt || String(a.title).localeCompare(String(b.title), "ar");
        });
      }

      function taskBadges(task) {
        const parts = [];
        parts.push(`<span class="badge-mini ${task.done ? "status-done" : "status-open"}">${task.done ? "الحالة: تم ✓" : "الحالة: بانتظار التنفيذ"}</span>`);
        if (task.suggestedTime) parts.push(`<span class="badge-mini">من–إلى ${esc(taskTimeRange(task))}</span>`);
        if (Number(task.timerMinutes) > 0) parts.push(`<span class="badge-mini">⏱ ${Number(task.timerMinutes)} د</span>`);
        if (task.source === "chatgpt") parts.push(`<span class="badge-mini">ChatGPT</span>`);
        if (task.ticktickTaskId) parts.push(`<span class="badge-mini">TickTick</span>`);
        return `<div class="task-badges">${parts.join("")}</div>`;
      }

      function getTaskGuide(task) {
        const title = String(task.title || "");
        const type = task.type || "other";
        const common = [
          "اقرأ اسم المهمة مرة واحدة بهدوء.",
          "حضّر الشيء المطلوب فقط لهذه المهمة.",
          Number(task.timerMinutes) > 0 ? `شغّل المؤقت لمدة ${Number(task.timerMinutes)} دقيقة.` : "ابدأ بخطوة قصيرة من 3 إلى 5 دقائق.",
          "عند الانتهاء اضغط: أنجزتها."
        ];

        if (/رياض|حساب|math|أسئلة|سؤال/.test(title) || type === "study") {
          return {
            title: "طريقة تنفيذ مهمة الدراسة",
            intro: "المطلوب ليس إنهاء كل شيء دفعة واحدة. نبدأ بسؤال أو فقرة صغيرة.",
            steps: ["جهّز الدفتر والقلم والكتاب فقط.", "ابدأ بالسؤال الأسهل أو الفقرة الأقصر.", "ضع علامة على الشيء الصعب بدلاً من التوقف.", "راجع إجابة واحدة مع أحد الوالدين إذا احتجت."],
            tip: "استخدم المؤقت كصديق يساعدك أن تبدأ، وليس كضغط."
          };
        }

        if (/دبلجة|صوت|تسجيل|رسم|فيديو/.test(title) || type === "creative") {
          return {
            title: "طريقة تنفيذ مهمة الإبداع",
            intro: "الإبداع يحتاج تجربة صغيرة، وليس نتيجة مثالية من أول مرة.",
            steps: ["اختر فكرة أو شخصية واحدة فقط.", "اكتب أو قل جملة قصيرة.", "جرّبها مرة بصوت عادي ومرة بصوت الشخصية.", "احفظ محاولة واحدة حتى لو لم تكن كاملة."],
            tip: "الأفكار الأصلية أفضل من تقليد شخصيات مشهورة."
          };
        }

        if (/ترتيب|غرفة|حقيبة|بيت|مساعدة/.test(title) || type === "home" || type === "routine") {
          return {
            title: "طريقة تنفيذ مهمة البيت أو الروتين",
            intro: "نقسم المهمة إلى زاوية صغيرة أو شيء واحد فقط.",
            steps: ["حدد المكان أو الشيء المطلوب.", "أبعد شيئاً واحداً ليس في مكانه.", "رتب لمدة قصيرة فقط.", "أخبر أحد الوالدين عند الانتهاء."],
            tip: "الترتيب الصغير كل يوم أفضل من ترتيب كبير مرة واحدة."
          };
        }

        if (/حركة|رياضة|مشي|تمدد/.test(title) || type === "movement") {
          return {
            title: "طريقة تنفيذ مهمة الحركة",
            intro: "الحركة تساعد الجسم والذهن أن يهدآ.",
            steps: ["اشرب قليلاً من الماء.", "ابدأ بحركة خفيفة لدقيقة واحدة.", "نفذ الحركة المطلوبة بدون استعجال.", "خذ نفساً هادئاً بعد الانتهاء."],
            tip: "المهم أن تتحرك بأمان، وليس أن تكون سريعاً."
          };
        }

        if (type === "social") {
          return {
            title: "طريقة تنفيذ المهمة الاجتماعية",
            intro: "مهارة اجتماعية قصيرة تكفي. جملة واحدة جيدة تعتبر تقدماً.",
            steps: ["اختر شخصاً تثق به.", "قل الجملة بصوت هادئ.", "انتظر الرد بدون استعجال.", "قل شكراً أو ابتسم وانتهِ."],
            tip: "لا يلزم أن تكون المحادثة طويلة. البداية الصغيرة ممتازة."
          };
        }

        return { title: "طريقة تنفيذ المهمة", intro: "نبدأ بأصغر خطوة ممكنة.", steps: common, tip: "ابدأ فقط. بعد البداية يصبح الأمر أسهل." };
      }

      function taskRows(tasks, member, parent = false) {
        const ordered = sortedTasks(tasks || []);
        if (!ordered.length) return `<li class="empty">لا توجد مهام اليوم. اطلب من الوالدين توليد خطة AI.</li>`;
        return ordered.map((task) => `
          <li>
            <button class="task-card ${task.done ? "done" : ""}" type="button" data-action="task-guide" data-member="${member}" data-id="${task.id}">
              <span class="time-box"><span>${esc(taskTimeRange(task))}</span><small>${Number(task.timerMinutes) > 0 ? `${Number(task.timerMinutes)} دقيقة` : "بدون مؤقت"}</small></span>
              <span class="task-main">
                <h3>${esc(task.title)}</h3>
                <p>${esc(TYPES[task.type]?.[0] || "مهمة")} · ${Number(task.points || 0)} نقطة</p>
                ${taskBadges(task)}
                ${task.note ? `<p>${esc(task.note)}</p>` : ""}
              </span>
              <span class="task-actions">
                ${Number(task.timerMinutes) > 0 && !task.done ? `<span class="btn btn-soft" data-action="timer" data-minutes="${Number(task.timerMinutes)}" data-title="${esc(task.title)}">مؤقت</span>` : ""}
                ${task.done ? `<span class="btn btn-line">تم ✓</span>` : `<span class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${task.id}">أنجزتها</span>`}
                ${parent ? `<span class="btn btn-danger" data-action="delete-task" data-id="${task.id}">حذف</span>` : ""}
              </span>
            </button>
          </li>
        `).join("");
      }

      function scheduleSummary(tasks = []) {
        const ordered = sortedTasks(tasks);
        if (!ordered.length) return `<p class="empty">لا توجد مهام مرتبة بعد.</p>`;
        return `<ul class="timeline">${ordered.map((task) => `<li><button class="task-card ${task.done ? "done" : ""}" type="button" data-action="task-guide" data-member="${task.assignee || ""}" data-id="${task.id}"><span class="time-box"><span>${esc(taskTimeRange(task))}</span><small>${task.done ? "تم" : "بانتظار"}</small></span><span class="task-main"><h3>${esc(task.title)}</h3><p>${esc(TYPES[task.type]?.[0] || "مهمة")} · ${Number(task.points || 0)} نقطة</p>${taskBadges(task)}</span><span class="task-actions">${Number(task.timerMinutes) > 0 && !task.done ? `<span class="btn btn-soft" data-action="timer" data-minutes="${Number(task.timerMinutes)}" data-title="${esc(task.title)}">مؤقت</span>` : ""}</span></button></li>`).join("")}</ul>`;
      }

      function parentView() {
        if (!family.parentAuthenticated) return parentLogin();
        if (!dashboard) return `<article class="card"><h2>تعذر تحميل لوحة العائلة</h2><button class="btn btn-primary" data-action="reload">إعادة المحاولة</button></article>`;
        const summary = dashboard.summary;
        const yamanTasks = child.yaman?.tasks || [];
        const judyTasks = child.judy?.tasks || [];
        return `<div class="stack">
          ${tickCard()}
          <article class="card ai-banner">
            <span class="eyebrow">ChatGPT Daily Coach</span>
            <h2>خطة يومية ذكية ومشجعة</h2>
            <p class="muted">الخطة تظهر الآن كجدول من ساعة إلى ساعة، مع مؤقت، حالة، وشرح تنفيذ عند الضغط على المهمة.</p>
            <div class="row"><button class="btn btn-primary" data-action="ai-plan">توليد خطة اليوم</button><button class="btn btn-soft" data-action="end-day-parent">تشجيع نهاية اليوم</button></div>
          </article>
          <article class="card">
            <span class="eyebrow">لوحة العائلة</span>
            <h2>إدارة مهام يَمان وجودي</h2>
            <div class="grid">
              <div class="metric"><strong>${summary.yaman.done}/${summary.yaman.total}</strong><span>يَمان · ${score(yamanTasks)} نقطة</span></div>
              <div class="metric"><strong>${summary.judy.done}/${summary.judy.total}</strong><span>جودي · ${score(judyTasks)} نقطة</span></div>
            </div>
            <div class="row" style="margin-top:14px"><button class="btn btn-primary" data-action="add-task">إضافة مهمة</button><button class="btn btn-soft" data-action="add-event">إضافة موعد</button><button class="btn btn-line" data-action="projects">قوائم TickTick</button><button class="btn btn-line" data-action="import">استيراد اليوم من TickTick</button><button class="btn btn-danger" data-action="logout-parent">خروج</button></div>
          </article>
          <div class="grid">
            <article class="card list"><div class="list-head"><h3>جدول يَمان من ساعة إلى ساعة</h3><span class="score-orb">${score(yamanTasks)}</span></div><ul class="timeline">${taskRows(yamanTasks, "yaman", true)}</ul></article>
            <article class="card list"><div class="list-head"><h3>جدول جودي من ساعة إلى ساعة</h3><span class="score-orb">${score(judyTasks)}</span></div><ul class="timeline">${taskRows(judyTasks, "judy", true)}</ul></article>
          </div>
        </div>`;
      }

      function childView(member) {
        if (!family.parentAuthenticated && !family[`${member}Authenticated`]) return childLogin(member);
        const data = child[member];
        if (!data) return `<article class="card"><h2>جاري تحميل المنطقة…</h2></article>`;
        return `<div class="stack">
          <article class="card ai-banner">
            <span class="eyebrow">منطقة ${PEOPLE[member].name}</span>
            <h2>جدول مهامي اليوم من ساعة إلى ساعة</h2>
            <p class="muted">اضغط على أي مهمة لتعرف كيف تنفذها خطوة بخطوة.</p>
            <div class="row"><span class="score-orb">${score(data.tasks)}</span><button class="btn btn-soft" data-action="end-day" data-member="${member}">تشجيع نهاية اليوم</button><button class="btn btn-line" data-action="logout-child" data-member="${member}">قفل المنطقة</button></div>
          </article>
          <article class="card list"><ul class="timeline">${taskRows(data.tasks, member, false)}</ul></article>
        </div>`;
      }

      function render() {
        paintTop();
        document.getElementById("root").innerHTML = area === "parent" ? parentView() : childView(area);
      }

      async function refresh() {
        await load();
        render();
      }

      function modal(html) {
        document.getElementById("modalRoot").innerHTML = `<section class="modal"><button class="btn btn-line close" data-action="close" type="button">إغلاق</button>${html}</section>`;
      }

      function close() {
        document.getElementById("modalRoot").innerHTML = "";
      }

      function findTask(member, id) {
        return (child[member]?.tasks || []).find((task) => String(task.id) === String(id));
      }

      function taskGuideModal(member, id) {
        const task = findTask(member, id) || findTask("yaman", id) || findTask("judy", id);
        if (!task) return;
        const guide = getTaskGuide(task);
        modal(`
          <h2>${esc(task.title)}</h2>
          <p class="muted">${esc(guide.intro)}</p>
          <div class="grid">
            <div class="metric"><strong>${esc(taskTimeRange(task))}</strong><span>من ساعة إلى ساعة</span></div>
            <div class="metric"><strong>${task.done ? "تم ✓" : "بانتظار"}</strong><span>الحالة</span></div>
          </div>
          <div class="guide-box" style="margin-top:14px">
            <h3>${esc(guide.title)}</h3>
            <ol class="guide-steps">${guide.steps.map((step) => `<li>${esc(step)}</li>`).join("")}</ol>
            <p class="muted"><strong>نصيحة Hero:</strong> ${esc(guide.tip)}</p>
            ${task.note ? `<p class="notice"><strong>ملاحظة المهمة:</strong><br>${esc(task.note)}</p>` : ""}
          </div>
          <div class="row" style="margin-top:16px">
            ${Number(task.timerMinutes) > 0 && !task.done ? `<button class="btn btn-soft" data-action="timer" data-minutes="${Number(task.timerMinutes)}" data-title="${esc(task.title)}" type="button">تشغيل المؤقت</button>` : ""}
            ${task.done ? `<span class="btn btn-line">تم الإنجاز ✓</span>` : `<button class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${task.id}" type="button">أنجزتها</button>`}
          </div>
        `);
      }

      function addTaskModal() {
        modal(`<h2>إضافة مهمة</h2><form class="form" id="taskForm"><label>الطفل<select id="taskMember"><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>المهمة<input id="taskTitle" required placeholder="مثال: حل 3 أسئلة رياضيات"></label><label>النوع<select id="taskType">${Object.entries(TYPES).map(([key, value]) => `<option value="${key}">${value[0]} · ${value[1]} نقطة</option>`).join("")}</select></label><label>ملاحظة<input id="taskNote" placeholder="كيف يبدأ؟ ماذا يحتاج؟"></label><label>وقت البداية<input id="taskSuggestedTime" type="time"></label><label>مؤقت بالدقائق — اتركه 0 إذا لا يلزم<input id="taskTimerMinutes" type="number" min="0" max="180" value="0"></label><button class="btn btn-primary" type="submit">حفظ</button></form>`);
      }

      function addEventModal() {
        modal(`<h2>إضافة موعد</h2><form class="form" id="eventForm"><label>لمن؟<select id="eventMember"><option value="family">كل العائلة</option><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>العنوان<input id="eventTitle" required></label><label>التاريخ<input id="eventDate" type="date" value="${today()}" required></label><label>الوقت<input id="eventTime" type="time"></label><button class="btn btn-primary" type="submit">حفظ</button></form>`);
      }

      function aiPlan() {
        modal(`<h2>بناء خطة اليوم</h2><p class="muted">اختر عدد المهام لكل طفل حتى 10، واكتب ما تريد أن تشمل الخطة. اطلب صراحة أوقاتاً: من 16:00 إلى 16:20، ومن 16:30 إلى 16:45. Hero سيعرضها كجدول يومي.</p><form class="form" id="planForm"><label>عدد المهام لكل طفل — حتى 10<input id="planTaskCount" type="number" min="1" max="10" value="3" required></label><label>ماذا يجب أن تشمل الخطة؟<textarea id="planInstructions" maxlength="900" placeholder="مثال: يَمان يحتاج 8 مهام: رياضيات من 16:30 لمدة 20 دقيقة، دبلجة 15 دقيقة، حركة، وترتيب. جودي تحتاج قراءة 15 دقيقة، رسم، ومساعدة بسيطة. ضع أوقاتاً بعد العصر، ولا ألعاب قبل إنهاء الدراسة."></textarea></label><p class="muted">سيظهر لكل طفل: من–إلى، مؤقت، حالة، وشرح عند الضغط على المهمة.</p><button class="btn btn-primary" type="submit">توليد الخطة الآن</button></form>`);
      }

      async function generatePlan(taskCount, instructions) {
        modal(`<h2>Hero يبني خطة اليوم…</h2><p class="muted">سننتظر حتى 12 ثانية فقط. إذا تأخر OpenAI أو TickTick، سيستخدم Hero خطة محلية آمنة حسب عدد المهام، الأوقات، والمؤقتات التي طلبتها.</p><div class="timer-big">⏳</div>`);
        try {
          const result = await api("/api/ai/daily-plan", { method: "POST", body: JSON.stringify({ date: today(), taskCount, instructions }) });
          modal(`<h2>تم إنشاء خطة اليوم</h2><p class="muted">${esc(result.plan.familyMessage)} ${result.warning ? esc(result.warning) : ""}</p><p>أضيفت ${result.inserted.length} مهام جديدة. عدد المهام لكل طفل: ${result.taskCount || taskCount}. المصدر: ${result.source === "openai" ? "OpenAI" : "خطة محلية سريعة"}</p>${instructions ? `<p class="muted"><strong>توجيهاتك:</strong> ${esc(instructions)}</p>` : ""}<button class="btn btn-primary" data-action="reload" type="button">عرض الجدول</button>`);
          await refresh();
        } catch (error) {
          modal(`<h2>تعذر بناء الخطة الآن</h2><p class="muted">${esc(error.message || "حدث خطأ مؤقت.")}</p><p class="muted">جرّب كتابة توجيهات أقصر. Hero لن يترك الشاشة معلّقة.</p><button class="btn btn-primary" data-action="reload" type="button">العودة للوحة</button>`);
        }
      }

      async function endDay(member) {
        const result = await api(`/api/ai/end-day/${member}?date=${today()}`);
        modal(`<h2>تشجيع نهاية اليوم — ${PEOPLE[member].name}</h2><p class="muted">${esc(result.summary.encouragement)}</p><div class="grid"><div class="metric"><strong>${result.summary.points}</strong><span>نقاط اليوم</span></div><div class="metric"><strong>${result.summary.done}/${result.summary.total}</strong><span>المهام</span></div></div><p>${esc(result.summary.nextStep || "")}</p>`);
      }

      async function endDayParent() {
        const yaman = await api(`/api/ai/end-day/yaman?date=${today()}`);
        const judy = await api(`/api/ai/end-day/judy?date=${today()}`);
        modal(`<h2>تشجيع نهاية اليوم</h2><article class="notice ok"><strong>يَمان</strong><br>${esc(yaman.summary.encouragement)}</article><br><article class="notice ok"><strong>جودي</strong><br>${esc(judy.summary.encouragement)}</article>`);
      }

      async function projectsModal() {
        if (!tick.connected) { modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a>`); return; }
        projects = (await api("/api/ticktick/projects")).projects || [];
        chosenProjects = new Set(JSON.parse(localStorage.getItem("hero-projects") || "[]"));
        if (!chosenProjects.size) projects.forEach((project) => chosenProjects.add(project.id));
        drawProjects();
      }

      function drawProjects() {
        modal(`<h2>اختر قوائم TickTick للاستيراد</h2>${projects.map((project) => `<button class="project-row ${chosenProjects.has(project.id) ? "selected" : ""}" data-action="toggle-project" data-id="${project.id}" type="button"><span>${esc(project.name)}</span><strong>${chosenProjects.has(project.id) ? "✓" : ""}</strong></button>`).join("")}<button class="btn btn-primary" data-action="save-projects" type="button">حفظ</button>`);
      }

      async function importModal() {
        if (!tick.connected) { modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a>`); return; }
        const ids = JSON.parse(localStorage.getItem("hero-projects") || "[]");
        const query = ids.length ? `?projectIds=${encodeURIComponent(ids.join(","))}` : "";
        importTasks = (await api(`/api/ticktick/today-tasks${query}`)).tasks || [];
        chosenTasks = new Set();
        drawImport();
      }

      function drawImport() {
        modal(`<h2>اختر مهام اليوم من TickTick</h2>${importTasks.length ? importTasks.map((task) => `<button class="import-row ${chosenTasks.has(task.projectId + ":" + task.id) ? "selected" : ""}" data-action="toggle-import" data-key="${task.projectId}:${task.id}" type="button"><span><strong>${esc(task.title)}</strong><br><small>${esc(task.projectName)}</small></span><b>${chosenTasks.has(task.projectId + ":" + task.id) ? "✓" : ""}</b></button>`).join("") : `<p class="empty">لا توجد مهام بتاريخ اليوم.</p>`}<div class="row"><button class="btn btn-primary" data-action="assign-import" data-member="yaman" type="button">إضافة ليَمان</button><button class="btn btn-primary" data-action="assign-import" data-member="judy" type="button">إضافة لجودي</button></div>`);
      }

      function startTaskTimer(minutes, title) {
        const total = Math.max(1, Math.round(Number(minutes) || 1)) * 60;
        let left = total;
        timerPaused = false;
        if (activeTimer) clearInterval(activeTimer);
        const fmt = (seconds) => `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        modal(`<h2>مؤقت المهمة</h2><p class="muted">${esc(title || "مهمة تركيز")}</p><div class="timer-big" id="timerDisplay">${fmt(left)}</div><p class="muted">عندما ينتهي المؤقت، خذ استراحة قصيرة ثم اضغط أنجزتها إذا أكملت المهمة.</p><div class="row"><button class="btn btn-soft" data-action="pause-timer" type="button">إيقاف مؤقت</button><button class="btn btn-line" data-action="close" type="button">إغلاق</button></div>`);
        activeTimer = setInterval(() => {
          if (timerPaused) return;
          left -= 1;
          const el = document.getElementById("timerDisplay");
          if (el) el.textContent = fmt(Math.max(0, left));
          if (left <= 0) {
            clearInterval(activeTimer);
            activeTimer = null;
            if (el) el.textContent = "انتهى ✓";
          }
        }, 1000);
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-area],[data-action]");
        if (!button) return;

        if (button.dataset.area) {
          area = button.dataset.area;
          localStorage.setItem("hero-area", area);
          history.replaceState(null, "", `?area=${area}`);
          render();
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        const action = button.dataset.action;

        if (action === "close") {
          if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
          close();
          return;
        }
        if (action === "pause-timer") {
          timerPaused = !timerPaused;
          button.textContent = timerPaused ? "متابعة" : "إيقاف مؤقت";
          return;
        }
        if (action === "reload") { close(); await refresh(); return; }
        if (action === "task-guide") { taskGuideModal(button.dataset.member, button.dataset.id); return; }
        if (action === "timer") { startTaskTimer(button.dataset.minutes, button.dataset.title); return; }
        if (action === "ai-plan") { aiPlan(); return; }
        if (action === "end-day") { await endDay(button.dataset.member); return; }
        if (action === "end-day-parent") { await endDayParent(); return; }
        if (action === "add-task") { addTaskModal(); return; }
        if (action === "add-event") { addEventModal(); return; }
        if (action === "projects") { await projectsModal(); return; }
        if (action === "import") { await importModal(); return; }
        if (action === "toggle-project") { chosenProjects.has(button.dataset.id) ? chosenProjects.delete(button.dataset.id) : chosenProjects.add(button.dataset.id); drawProjects(); return; }
        if (action === "save-projects") { localStorage.setItem("hero-projects", JSON.stringify([...chosenProjects])); close(); return; }
        if (action === "toggle-import") { chosenTasks.has(button.dataset.key) ? chosenTasks.delete(button.dataset.key) : chosenTasks.add(button.dataset.key); drawImport(); return; }
        if (action === "assign-import") {
          const member = button.dataset.member;
          for (const key of chosenTasks) {
            const task = importTasks.find((item) => `${item.projectId}:${item.id}` === key);
            if (task) {
              await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: member, title: task.title, type: "other", points: 5, date: today(), note: task.content || "مستورد من TickTick", source: "ticktick", ticktickTaskId: task.id, ticktickProjectId: task.projectId, ticktickProjectName: task.projectName, timerMinutes: 0, suggestedTime: "" }) });
            }
          }
          close();
          await refresh();
          return;
        }
        if (action === "complete") {
          await api(`/api/family/tasks/${button.dataset.id}/complete`, { method: "PATCH", body: JSON.stringify({ assignee: button.dataset.member }) });
          close();
          await refresh();
          return;
        }
        if (action === "delete-task") {
          if (confirm("حذف المهمة؟")) {
            await api(`/api/family/tasks/${button.dataset.id}`, { method: "DELETE" });
            await refresh();
          }
          return;
        }
        if (action === "logout-parent") { await api("/api/family/parent/logout", { method: "POST" }); await refresh(); return; }
        if (action === "logout-child") { await api(`/api/family/child/${button.dataset.member}/logout`, { method: "POST" }); await refresh(); return; }
      });

      document.addEventListener("submit", async (event) => {
        if (event.target.id === "planForm") {
          event.preventDefault();
          const rawCount = Number(document.getElementById("planTaskCount").value);
          const taskCount = Math.min(10, Math.max(1, Number.isFinite(rawCount) ? Math.round(rawCount) : 3));
          const instructions = document.getElementById("planInstructions").value.trim();
          await generatePlan(taskCount, instructions);
          return;
        }

        if (event.target.id === "childLoginForm") {
          event.preventDefault();
          const member = event.target.dataset.member;
          try {
            await api(`/api/family/child/${member}/login`, { method: "POST", body: JSON.stringify({ pin: document.getElementById("childPin").value }) });
            await refresh();
          } catch (error) {
            document.getElementById("childErr").textContent = error.message;
          }
          return;
        }

        if (event.target.id === "taskForm") {
          event.preventDefault();
          const type = document.getElementById("taskType").value;
          await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("taskMember").value, title: document.getElementById("taskTitle").value, type, points: TYPES[type][1], date: today(), note: document.getElementById("taskNote").value, suggestedTime: document.getElementById("taskSuggestedTime").value, timerMinutes: Number(document.getElementById("taskTimerMinutes").value) || 0, source: "parent" }) });
          close();
          await refresh();
          return;
        }

        if (event.target.id === "eventForm") {
          event.preventDefault();
          await api("/api/family/events", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("eventMember").value, title: document.getElementById("eventTitle").value, date: document.getElementById("eventDate").value, time: document.getElementById("eventTime").value }) });
          close();
          await refresh();
        }
      });

      refresh().catch((error) => {
        document.getElementById("root").innerHTML = `<article class="card"><h2>تعذر تشغيل التطبيق</h2><p class="muted">${esc(error.message)}</p></article>`;
      });
    })();
  </script>
</body>
</html>
