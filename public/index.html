<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4d6eea" />
  <title>Hero Family — PIN Login Fix + Empowering Gamification v46</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-0: #f8f6f1;
      --bg-1: #eef5ff;
      --ink: #1f2742;
      --muted: #6d758b;
      --card: rgba(255,255,255,.84);
      --card-solid: #ffffff;
      --line: rgba(73,91,130,.14);
      --brand: #6c7df1;
      --brand-deep: #273466;
      --brand-soft: #eef1ff;
      --amber: #efbd67;
      --rose: #df7aa2;
      --green: #57b99b;
      --cyan: #69cbd4;
      --study: #6a95ee;
      --home: #efbd67;
      --creative: #b88bf1;
      --movement: #69cbd4;
      --social: #df7aa2;
      --routine: #57b99b;
      --prayer: #7c8a9e;
      --other: #9aa7c7;
      --shadow: 0 24px 80px rgba(32, 24, 79, .15);
      --shadow-soft: 0 14px 40px rgba(32, 24, 79, .09);
      --radius-xl: 32px;
      --radius: 22px;
      --font-body: "Tajawal", "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      --font-display: "Noto Kufi Arabic", "Tajawal", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { direction: rtl; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.75;
      text-align: right;
      background:
        radial-gradient(circle at 8% 7%, rgba(108,125,241,.16), transparent 26rem),
        radial-gradient(circle at 90% 4%, rgba(105,203,212,.15), transparent 24rem),
        radial-gradient(circle at 10% 90%, rgba(239,189,103,.18), transparent 24rem),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #fcfdff);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at top, #000 0, transparent 70%);
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    label { display: grid; gap: 7px; font-weight: 800; }

    input, textarea, select {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(55,48,93,.18);
      border-radius: 17px;
      padding: 12px 14px;
      color: var(--ink);
      background: rgba(255,255,255,.92);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      direction: rtl;
      text-align: right;
      outline: none;
    }

    textarea { min-height: 124px; resize: vertical; }
    input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 4px solid rgba(110,86,232,.22);
      border-color: rgba(110,86,232,.6);
      outline-offset: 2px;
    }

    .pin-input {
      position: relative;
      z-index: 5;
      direction: ltr !important;
      text-align: center !important;
      unicode-bidi: plaintext;
      min-height: 68px;
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 6vw, 2.15rem);
      font-weight: 900;
      letter-spacing: .05em;
      border-radius: 22px;
      background: #fff;
      caret-color: var(--brand);
      -webkit-user-select: text;
      user-select: text;
      -webkit-appearance: none;
      appearance: none;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 80px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 18px;
      align-items: center;
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 38px;
      background:
        radial-gradient(circle at 13% 20%, rgba(255,255,255,.22), transparent 14rem),
        radial-gradient(circle at 92% 10%, rgba(105,203,212,.28), transparent 14rem),
        linear-gradient(135deg, #273466, #5668d9 58%, #91a4ff);
      color: white;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -85px -130px auto;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      z-index: -1;
    }

    .brand { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .brand-mark {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 32% 25%, rgba(255,255,255,.95), rgba(255,255,255,.20) 42%, transparent 44%),
        linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.30);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 16px 35px rgba(0,0,0,.13);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 900;
    }

    h1, h2, h3 { font-family: var(--font-display); line-height: 1.45; }
    .hero h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2.35rem); letter-spacing: -.02em; }
    .hero p { margin: 7px 0 0; color: rgba(255,255,255,.82); }

    .hero-tools { display: flex; flex-wrap: wrap; gap: 9px; justify-content: flex-end; }
    .glass-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.19);
      font-weight: 800;
      white-space: nowrap;
    }

    .hero-art {
      width: min(230px, 24vw);
      min-width: 160px;
      opacity: .96;
      filter: drop-shadow(0 24px 40px rgba(12,18,55,.18));
    }
    .hero-art svg { display: block; width: 100%; height: auto; }

    .art-layout {
      display: grid;
      grid-template-columns: 1fr minmax(160px, 250px);
      gap: 18px;
      align-items: center;
    }
    .soft-scene {
      position: relative;
      min-height: 170px;
      border: 1px solid rgba(105,203,212,.20);
      border-radius: 32px;
      background:
        radial-gradient(circle at 20% 25%, rgba(255,255,255,.95), transparent 4.8rem),
        radial-gradient(circle at 82% 24%, rgba(184,139,241,.18), transparent 5.5rem),
        linear-gradient(145deg, #f4fbff, #f6f2ff 55%, #fff8eb);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .soft-scene::before,
    .soft-scene::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(73,91,130,.08);
    }
    .soft-scene::before { width: 84px; height: 84px; left: 24px; bottom: 18px; }
    .soft-scene::after { width: 58px; height: 58px; right: 28px; top: 20px; }
    .scene-icons {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      align-items: center;
      justify-items: center;
      gap: 12px;
      padding: 24px;
      z-index: 1;
    }
    .scene-chip {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 21px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(73,91,130,.12);
      box-shadow: 0 12px 28px rgba(31,39,66,.08);
    }
    .scene-chip svg { width: 30px; height: 30px; stroke: currentColor; }

    .soft-icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 18px;
      border: 1px solid rgba(73,91,130,.10);
      background: var(--icon-bg, #f3f5fb);
      color: var(--icon-color, var(--brand));
      box-shadow: 0 10px 22px rgba(31,39,66,.07);
    }
    .soft-icon svg { width: 25px; height: 25px; stroke: currentColor; }
    .task-main { display: flex; gap: 12px; align-items: flex-start; }
    .task-main > div:last-child { min-width: 0; }
    .type-study { --row-accent: var(--study); --icon-bg: #eef5ff; --icon-color: var(--study); }
    .type-home { --row-accent: var(--home); --icon-bg: #fff7e8; --icon-color: #c4882f; }
    .type-creative { --row-accent: var(--creative); --icon-bg: #f5eeff; --icon-color: var(--creative); }
    .type-movement { --row-accent: var(--movement); --icon-bg: #ecfbfd; --icon-color: #3aaebc; }
    .type-social { --row-accent: var(--social); --icon-bg: #fff0f7; --icon-color: var(--social); }
    .type-routine { --row-accent: var(--routine); --icon-bg: #ebfaf5; --icon-color: var(--routine); }
    .type-prayer { --row-accent: var(--prayer); --icon-bg: #f2f4f8; --icon-color: var(--prayer); }
    .type-other { --row-accent: var(--other); --icon-bg: #f2f4f8; --icon-color: var(--other); }
    .task-row { border-inline-start: 6px solid var(--row-accent, rgba(73,91,130,.12)); }
    .badge .mini-icon { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; }
    .badge .mini-icon svg { width: 15px; height: 15px; stroke: currentColor; }
    .person-yaman { --person-a: #ecfbfd; --person-b: #eef5ff; --person-c: rgba(105,203,212,.22); }
    .person-judy { --person-a: #fff0f7; --person-b: #f5eeff; --person-c: rgba(223,122,162,.18); }
    .person-parent { --person-a: #eef1ff; --person-b: #fff8eb; --person-c: rgba(108,125,241,.18); }
    .person-card { background: linear-gradient(145deg, var(--person-a), var(--person-b)); }
    .person-card .score-orb { background: radial-gradient(circle at 35% 25%, #fff, var(--person-c)); color: var(--brand-deep); }


    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,.66);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
    }

    .tabs.is-hidden { display: none; }
    body.is-login .hero { display: none; }
    .login-gate {
      max-width: 860px;
      margin: 0 auto;
      min-height: calc(100vh - 120px);
      align-content: center;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .login-screen-card {
      position: relative;
      overflow: hidden;
      border-radius: 38px;
      padding: clamp(22px, 5vw, 42px);
      background:
        radial-gradient(circle at 15% 8%, rgba(239,189,103,.14), transparent 12rem),
        radial-gradient(circle at 92% 4%, rgba(105,203,212,.12), transparent 12rem),
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,250,244,.88));
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.66);
    }
    .login-screen-card::before {
      content: "";
      position: absolute;
      inset: auto auto -46px -34px;
      width: 210px;
      height: 110px;
      border-radius: 60% 60% 0 0;
      background: linear-gradient(135deg, rgba(105,203,212,.18), rgba(239,189,103,.16));
      opacity: .75;
      pointer-events: none;
    }
    .login-logo {
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
      margin-bottom: 22px;
    }
    .family-symbol {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      border-radius: 30px;
      color: #b77b22;
      background: radial-gradient(circle at 35% 25%, #fff, #fff4dc 45%, #f5cf84);
      box-shadow: 0 16px 34px rgba(239,189,103,.22);
      font-size: 2rem;
      font-weight: 900;
    }
    .login-logo h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.15rem);
      letter-spacing: .01em;
      color: var(--brand-deep);
    }
    .gold-divider {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #c58a32;
      font-weight: 900;
    }
    .gold-divider::before, .gold-divider::after {
      content: "";
      width: 52px;
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #d6a14a, transparent);
    }
    .account-panel {
      position: relative;
      z-index: 1;
      border-radius: 32px;
      padding: clamp(18px, 4vw, 28px);
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(73,91,130,.10);
      box-shadow: 0 20px 55px rgba(31,39,66,.10);
      backdrop-filter: blur(16px);
    }
    .account-panel h2 { margin: 0 0 16px; text-align: center; }
    .account-choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .account-choice {
      min-height: 174px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 11px;
      border-radius: 24px;
      border: 1px solid rgba(73,91,130,.12);
      background: var(--account-bg, #fff);
      color: var(--ink);
      box-shadow: 0 13px 30px rgba(31,39,66,.08);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .account-choice:hover { transform: translateY(-2px); }
    .account-choice.is-selected {
      border-color: var(--account-color, var(--brand));
      box-shadow: 0 18px 42px rgba(31,39,66,.13);
    }
    .account-choice.parent-account { --account-bg: linear-gradient(180deg,#fff9ec,#fff); --account-color: #c58a32; }
    .account-choice.yaman-account { --account-bg: linear-gradient(180deg,#edf6ff,#fff); --account-color: #6a95ee; }
    .account-choice.judy-account { --account-bg: linear-gradient(180deg,#fff0f7,#fff); --account-color: #df7aa2; }
    .account-avatar {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(73,91,130,.10);
      color: var(--account-color, var(--brand));
      font-size: 2rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 14px 26px rgba(31,39,66,.08);
    }
    .account-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; }
    .account-line { width: 34px; height: 4px; border-radius: 999px; background: var(--account-color, var(--brand)); opacity: .7; }
    .login-pin-area { display: grid; gap: 12px; max-width: 620px; margin: 0 auto; }
    .pin-label { text-align: center; font-family: var(--font-display); font-size: 1.15rem; color: var(--muted); }
    .login-submit { min-height: 66px; border-radius: 24px; font-size: 1.25rem; }
    .switch-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 800;
      margin-top: 8px;
    }

    .tab {
      min-height: 66px;
      border: 0;
      border-radius: 22px;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      transition: .18s ease;
    }
    .tab small { display: block; margin-top: 2px; font-weight: 500; font-size: .78rem; }
    .tab.active {
      color: white;
      background: linear-gradient(135deg, var(--brand-deep), var(--brand));
      box-shadow: 0 12px 26px rgba(110,86,232,.26);
    }

    .stack { display: grid; gap: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
      padding: clamp(18px, 3vw, 25px);
    }
    .card.solid { background: var(--card-solid); }
    .card.art {
      background:
        radial-gradient(circle at 0 0, rgba(243,180,78,.20), transparent 12rem),
        radial-gradient(circle at 100% 30%, rgba(110,86,232,.16), transparent 14rem),
        rgba(255,255,255,.86);
    }
    .card h2 { margin: 0 0 8px; font-size: clamp(1.35rem, 3vw, 1.85rem); }
    .card h3 { margin: 0 0 6px; font-size: 1.08rem; }
    .eyebrow { display: block; color: var(--brand); font-weight: 900; font-size: .82rem; margin-bottom: 7px; }
    .muted { color: var(--muted); }
    .small { font-size: .9rem; }

    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 17px;
      font-weight: 900;
      text-align: center;
      transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary { color: white; background: linear-gradient(135deg, #4d60d6, var(--brand)); box-shadow: 0 12px 26px rgba(108,125,241,.22); }
    .btn-soft { color: var(--brand-deep); background: var(--brand-soft); border-color: rgba(110,86,232,.15); }
    .btn-line { color: var(--ink); background: rgba(255,255,255,.82); border-color: rgba(55,48,93,.16); }
    .btn-ok { color: white; background: var(--green); }
    .btn-danger { color: #9e2045; background: #fff0f5; border-color: rgba(225,86,124,.28); }

    .notice {
      padding: 14px 16px;
      border-radius: 20px;
      border: 1px solid rgba(243,180,78,.38);
      background: #fff7e6;
      color: #79530b;
    }
    .notice.ok { border-color: rgba(19,139,107,.22); background: #eafaf5; color: #0c614e; }
    .notice.bad { border-color: rgba(225,86,124,.24); background: #fff0f5; color: #9e2045; }

    .metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 110px;
      padding: 18px;
      border-radius: 26px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.68);
    }
    .metric strong { display: block; font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.2rem); line-height: 1; color: var(--brand-deep); }
    .score-orb {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      color: #704700;
      background: radial-gradient(circle at 35% 25%, #fff3c8, var(--amber));
      box-shadow: 0 16px 34px rgba(243,180,78,.25);
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.45rem;
    }

    .login { max-width: 640px; margin: 0 auto; }
    .form { display: grid; gap: 13px; }
    .login-copy { display: grid; gap: 10px; margin-bottom: 15px; }
    .login-error { min-height: 24px; color: #9e2045; font-weight: 900; }

    .list { padding: 0; overflow: hidden; }
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .task-row {
      display: grid;
      grid-template-columns: 138px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.62);
    }
    .task-row.done { background: rgba(234,250,245,.72); }
    .time-box {
      display: grid;
      gap: 3px;
      justify-items: center;
      align-content: center;
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      color: var(--brand-deep);
      font-family: var(--font-display);
      font-weight: 900;
      text-align: center;
    }
    .time-box small { color: var(--muted); font-family: var(--font-body); font-weight: 700; }
    .task-open {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: right;
      padding: 0;
    }
    .task-title { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 900; }
    .task-row.done .task-title { color: #1c705a; text-decoration: line-through; text-decoration-thickness: 2px; }
    .task-note { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: .8rem;
      font-weight: 900;
      border: 1px solid rgba(55,48,93,.12);
      background: var(--brand-soft);
      color: var(--brand-deep);
    }
    .badge.status-open { background: #fff7e6; color: #79530b; }
    .badge.status-done { background: #eafaf5; color: #0c614e; }
    .badge.status-progress { background: #eef5ff; color: #273466; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .task-actions .btn { min-height: 42px; padding: 8px 12px; border-radius: 14px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }

    .events { display: grid; gap: 9px; margin-top: 12px; }
    .event { padding: 12px 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.62); }

    .modal-root:empty { display: none; }
    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(20, 15, 51, .58);
      backdrop-filter: blur(12px);
    }
    .modal {
      width: min(820px, 100%);
      max-height: min(88vh, 860px);
      overflow: auto;
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,.24);
      background: #fff;
      box-shadow: 0 35px 110px rgba(0,0,0,.30);
      padding: 24px;
    }
    .modal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .guide-box { padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: #fbfaff; }
    .guide-steps { margin: 10px 0; padding-right: 24px; line-height: 2; }
    .timer-big { font-family: var(--font-display); font-size: clamp(3rem, 16vw, 5rem); text-align: center; color: var(--brand-deep); margin: 12px 0; }

    .choice-row, .project-row, .import-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 62px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      text-align: right;
    }
    .selected { border-color: rgba(110,86,232,.72); background: var(--brand-soft); }


    .checklist-stages {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      gap: 9px;
    }
    .checklist-stage {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.86);
      color: var(--ink);
      padding: 10px 12px;
      text-align: right;
      font-weight: 800;
      transition: .16s ease;
    }
    .checklist-stage .v-mark {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(87,185,155,.35);
      color: rgba(87,185,155,.7);
      background: #fff;
      font-weight: 900;
    }
    .checklist-stage.checked {
      background: #eafaf5;
      color: #0c614e;
      border-color: rgba(87,185,155,.35);
    }
    .checklist-stage.checked .v-mark {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .checklist-stage.checked .stage-text {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(12,97,78,.35);
    }

    .footer { margin-top: 26px; color: var(--muted); text-align: center; font-size: .86rem; }

    .progress-card {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.70);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 900;
    }
    .progress-track {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(39,52,102,.10);
      border: 1px solid rgba(73,91,130,.10);
    }
    .progress-fill {
      height: 100%;
      width: var(--progress, 0%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--brand));
      transition: width .35s ease;
    }
    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff7e6;
      color: #79530b;
      border: 1px solid rgba(243,180,78,.35);
      font-weight: 900;
    }
    .achievement-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .achievement-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(73,91,130,.12);
      font-size: .84rem;
      font-weight: 900;
    }
    .hero-mission {
      border: 1px solid rgba(239,189,103,.35);
      background: linear-gradient(145deg, #fff8eb, #f5eeff);
    }
    .bonus-text {
      color: #0c614e;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      .shell { width: min(100% - 18px, 1180px); padding-top: 10px; padding-bottom: 96px; }
      .hero { grid-template-columns: 1fr; border-radius: 28px; }
      .hero-tools { justify-content: flex-start; }
      .hero-art { display: none; }
      .art-layout { grid-template-columns: 1fr; }
      .soft-scene { min-height: 130px; }
      .grid, .grid.three { grid-template-columns: 1fr; }
      .task-row { grid-template-columns: 1fr; gap: 10px; }
      .time-box { width: 100%; justify-items: start; padding: 12px 14px; text-align: right; }
      .task-actions { display: grid; grid-template-columns: 1fr; }
      .task-actions .btn, .row .btn { width: 100%; }
      .list-head { align-items: stretch; flex-direction: column; }
    }

    @media (max-width: 640px) {
      body { background: linear-gradient(180deg, #fbfbff, #f4f1ff); }
      .shell { width: 100%; padding: 8px 10px 104px; }
      .hero { padding: 18px; border-radius: 24px; }
      .brand { align-items: flex-start; }
      .brand-mark { width: 52px; height: 52px; border-radius: 18px; }
      .hero h1 { font-size: 1.35rem; }
      .hero p { font-size: .92rem; }
      .hero-tools { gap: 7px; }
      .glass-pill { min-height: 36px; font-size: .82rem; }
      .tabs {
        position: fixed;
        inset: auto 10px max(10px, env(safe-area-inset-bottom)) 10px;
        z-index: 40;
        margin: 0;
        border-radius: 26px;
        background: rgba(255,255,255,.84);
      }
      .tab { min-height: 58px; border-radius: 20px; font-size: .9rem; }
      .tab small { display: none; }
      .card { border-radius: 24px; padding: 17px; }
      .card h2 { font-size: 1.32rem; }
      .metric { min-height: 92px; }
      .score-orb { width: 70px; height: 70px; font-size: 1.2rem; }
      .task-row { padding: 14px; }
      .task-main { gap: 10px; }
      .soft-icon { width: 42px; height: 42px; border-radius: 15px; }
      .btn { width: 100%; min-height: 52px; }
      .pin-input { min-height: 70px; font-size: 1.65rem; border-radius: 22px; }
      .modal-root { align-items: end; padding: 0; }
      .modal { width: 100%; max-height: 92vh; border-radius: 28px 28px 0 0; padding: 18px; }
      .modal-top { align-items: stretch; flex-direction: column-reverse; }
    }
    @media (max-width: 640px) {
      .login-gate { padding: 10px; min-height: 100vh; }
      .login-screen-card { border-radius: 30px; padding: 22px 14px 20px; }
      .family-symbol { width: 68px; height: 68px; border-radius: 24px; font-size: 1.55rem; }
      .account-panel { border-radius: 28px; padding: 16px; }
      .account-choices { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .account-choice { min-height: 132px; border-radius: 20px; gap: 7px; padding: 8px 5px; }
      .account-avatar { width: 56px; height: 56px; font-size: 1.45rem; }
      .account-name { font-size: 1rem; }
      .account-line { height: 3px; }
      .login-submit { min-height: 60px; }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">
        <div class="brand-mark" id="brandMark">✦</div>
        <div>
          <h1>Hero Family</h1>
          <p id="heroSubtitle">لوحة عائلية جميلة، هادئة، وذكية لتنظيم اليوم.</p>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 260 170" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="38" y="35" width="166" height="105" rx="34" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.30)"/>
          <circle cx="84" cy="82" r="22" fill="#fff7e8"/>
          <circle cx="134" cy="72" r="27" fill="#ecfbfd"/>
          <circle cx="176" cy="96" r="20" fill="#f5eeff"/>
          <path d="M69 119h105" stroke="rgba(255,255,255,.74)" stroke-width="10" stroke-linecap="round"/>
          <path d="M80 112l15 15 32-38" stroke="#57b99b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M204 36l9 19 20 8-20 8-9 19-9-19-20-8 20-8 9-19z" fill="#fff3c8" opacity=".95"/>
          <path d="M38 24c16 8 34 8 50 0" stroke="rgba(255,255,255,.54)" stroke-width="8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="hero-tools">
        <span class="glass-pill" id="datePill">اليوم</span>
        <span class="glass-pill" id="tickPill">TickTick</span>
      </div>
    </header>

    <nav class="tabs" aria-label="مناطق التطبيق">
      <button class="tab" data-area="parent" type="button">الوالدان<small>إدارة وخطة</small></button>
      <button class="tab" data-area="yaman" type="button">يَمان<small>مهامي وخطواتي</small></button>
      <button class="tab" data-area="judy" type="button">جودي<small>مهامي وخطواتي</small></button>
    </nav>

    <section id="root" class="stack" aria-live="polite"></section>

    <footer class="footer">Hero Family · خطة يومية، نقاط تشجيعية، TickTick، وشرح بسيط لكل مهمة.</footer>
  </main>

  <div class="modal-root" id="modalRoot"></div>

  <script>
    (() => {
      "use strict";

      const PEOPLE = {
        parent: { name: "الوالدان", mark: "✦", sub: "إدارة هادئة وخطة يومية ذكية." },
        yaman: { name: "يَمان", mark: "Y", sub: "خطوة واحدة واضحة في كل مرة." },
        judy: { name: "جودي", mark: "J", sub: "مهام لطيفة، ألوان هادئة، وتشجيع." }
      };

      const TYPES = {
        study: ["دراسة", 15],
        home: ["مسؤولية", 10],
        creative: ["إبداع", 15],
        movement: ["حركة", 10],
        social: ["مهارة اجتماعية", 10],
        routine: ["روتين", 5],
        prayer: ["صلاة", 0],
        other: ["مهمة", 5]
      };

      const TYPE_META = {
        study: { label: "دراسة", icon: "book" },
        home: { label: "مسؤولية", icon: "home" },
        creative: { label: "إبداع", icon: "spark" },
        movement: { label: "حركة", icon: "move" },
        social: { label: "اجتماعي", icon: "chat" },
        routine: { label: "روتين", icon: "clock" },
        prayer: { label: "صلاة", icon: "clock" },
        other: { label: "مهمة", icon: "star" }
      };

      const qs = new URLSearchParams(location.search);

      function normalizePinValue(value) {
        const arabicDigits = "٠١٢٣٤٥٦٧٨٩";
        const persianDigits = "۰۱۲۳۴۵۶۷۸۹";
        return String(value || "")
          .trim()
          .replace(/[٠-٩]/g, (digit) => String(arabicDigits.indexOf(digit)))
          .replace(/[۰-۹]/g, (digit) => String(persianDigits.indexOf(digit)))
          .replace(/[\s\u200e\u200f\u202a-\u202e]/g, "")
          .replace(/^['"]|['"]$/g, "");
      }
      let area = qs.get("area") || localStorage.getItem("hero-area") || "parent";
      if (!["parent", "yaman", "judy"].includes(area)) area = "parent";

      let family = {};
      let tick = {};
      let dashboard = null;
      let child = { yaman: null, judy: null };
      let projects = [];
      let importTasks = [];
      let chosenProjects = new Set(JSON.parse(localStorage.getItem("hero-projects") || "[]"));
      let chosenTasks = new Set();
      let activeTimer = null;
      let timerPaused = false;

      const today = () => {
        const d = new Date();
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
      };

      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[m]));

      function iconSvg(name) {
        const attrs = 'viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
        const icons = {
          book: `<svg ${attrs}><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v15H7.5A2.5 2.5 0 0 0 5 20.5V5.5Z"/><path d="M5 5.5A2.5 2.5 0 0 0 2.5 3H4a3 3 0 0 1 3 3v14"/><path d="M9 7h7M9 11h6"/></svg>`,
          home: `<svg ${attrs}><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>`,
          spark: `<svg ${attrs}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8L18 16Z"/></svg>`,
          move: `<svg ${attrs}><path d="M13 4 7 13h5l-1 7 6-10h-5l1-6Z"/><path d="M4 19h3M17 19h3"/></svg>`,
          chat: `<svg ${attrs}><path d="M5 6.5A6.5 6.5 0 0 1 11.5 0h1A6.5 6.5 0 0 1 19 6.5v2A6.5 6.5 0 0 1 12.5 15H11l-5 4v-5.2A6.5 6.5 0 0 1 5 8.5v-2Z" transform="translate(0 3)"/><path d="M8 11h8M8 14h5"/></svg>`,
          clock: `<svg ${attrs}><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
          star: `<svg ${attrs}><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>`
        };
        return icons[name] || icons.star;
      }

      function typeKey(type) {
        return TYPE_META[type] ? type : "other";
      }

      function typeIcon(type, mini = false) {
        const key = typeKey(type);
        return `<span class="${mini ? "mini-icon" : "soft-icon"}" aria-hidden="true">${iconSvg(TYPE_META[key].icon)}</span>`;
      }

      function sceneIcons(...types) {
        return `<div class="scene-icons">${types.map((type) => `<span class="scene-chip type-${typeKey(type)}">${iconSvg(TYPE_META[typeKey(type)].icon)}</span>`).join("")}</div>`;
      }


      function apiJsonError(url, text) {
        const sample = String(text || "").trim().slice(0, 90);
        const looksLikeMarkup = sample.startsWith("<") || sample.startsWith("<?xml");
        const message = looksLikeMarkup
          ? "الخادم أعاد صفحة HTML/XML بدل JSON. افتح التطبيق من رابط Railway بعد تشغيل server.js، وليس من معاينة index.html فقط."
          : "الخادم أعاد رداً غير صالح بدل JSON.";
        const error = new Error(`${message} (${url})`);
        error.sample = sample;
        return error;
      }

      async function api(url, opts = {}) {
        const response = await fetch(url, {
          ...opts,
          headers: {
            "Content-Type": "application/json",
            ...(opts.headers || {})
          }
        });
        const text = await response.text();
        let body = null;
        let parsed = false;
        try {
          body = text ? JSON.parse(text) : null;
          parsed = Boolean(text);
        } catch {
          if (text) throw apiJsonError(url, text);
        }
        if (!response.ok) {
          const error = new Error(body?.error || "تعذر تنفيذ العملية.");
          error.status = response.status;
          throw error;
        }
        if (text && !parsed) throw apiJsonError(url, text);
        return body;
      }

      async function load() {
        const [status, tickStatus] = await Promise.all([
          api("/api/family/status", { cache: "no-store" }),
          api("/api/ticktick/status", { cache: "no-store" }).catch(() => ({ configured: false, connected: false }))
        ]);
        family = status;
        tick = tickStatus;
        dashboard = null;
        child = { yaman: null, judy: null };

        if (family.parentAuthenticated) {
          const [dash, yaman, judy] = await Promise.all([
            api(`/api/family/dashboard?date=${today()}`),
            api(`/api/family/child/yaman?date=${today()}`),
            api(`/api/family/child/judy?date=${today()}`)
          ]);
          dashboard = dash;
          child.yaman = yaman;
          child.judy = judy;
          return;
        }

        for (const member of ["yaman", "judy"]) {
          if (family[`${member}Authenticated`]) {
            child[member] = await api(`/api/family/child/${member}?date=${today()}`);
          }
        }
      }

      function paintTop() {
        const person = PEOPLE[area] || PEOPLE.parent;
        document.getElementById("brandMark").textContent = person.mark;
        document.getElementById("heroSubtitle").textContent = person.sub;
        document.getElementById("datePill").textContent = new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        document.getElementById("tickPill").textContent = tick.connected ? "TickTick متصل ✓" : tick.configured ? "TickTick جاهز" : "TickTick غير مهيأ";
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.area === area));
      }

      function checklistBonusPoints(task) {
        if (!task?.done || task?.type === "prayer") return 0;
        try {
          const saved = JSON.parse(localStorage.getItem(checklistStorageKey(task.id)) || "[]");
          return Array.isArray(saved) && saved.length >= 3 ? 3 : 0;
        } catch {
          return 0;
        }
      }

      function taskEarnedPoints(task) {
        if (!task?.done || task?.type === "prayer") return 0;
        return Number(task.earnedPoints ?? task.points ?? 0) + checklistBonusPoints(task);
      }

      function score(tasks = []) {
        return tasks.filter((task) => task.done).reduce((sum, task) => sum + taskEarnedPoints(task), 0);
      }

      function levelForPoints(points) {
        const p = Number(points) || 0;
        if (p >= 121) return { label: "قائد يومه", next: 160, pct: Math.min(100, (p / 160) * 100), icon: "👑" };
        if (p >= 81) return { label: "بطل اليوم", next: 120, pct: ((p - 81) / 39) * 100, icon: "🏆" };
        if (p >= 51) return { label: "يوم قوي", next: 80, pct: ((p - 51) / 29) * 100, icon: "💪" };
        if (p >= 21) return { label: "تقدم رائع", next: 50, pct: ((p - 21) / 29) * 100, icon: "🌟" };
        return { label: "بداية جميلة", next: 20, pct: Math.min(100, (p / 20) * 100), icon: "🌱" };
      }

      function progressCard(member, tasks = []) {
        const points = score(tasks);
        const level = levelForPoints(points);
        const done = tasks.filter((task) => task.done).length;
        const total = tasks.length;
        return `<article class="progress-card person-card person-${member}">
          <div class="progress-top"><span>${PEOPLE[member].name}</span><span class="level-pill">${level.icon} ${level.label}</span></div>
          <div class="progress-track" aria-label="تقدم اليوم"><div class="progress-fill" style="--progress:${Math.max(0, Math.min(100, level.pct))}%"></div></div>
          <div class="muted small">${points} نقطة إيجابية · ${done}/${total} مهام منجزة · لا توجد خصومات ولا مقارنة.</div>
        </article>`;
      }

      function heroMissionCard(member, tasks = []) {
        const mission = sortedTasks(tasks).find((task) => !task.done && task.type !== "prayer" && Number(task.points || 0) >= 10) || sortedTasks(tasks).find((task) => !task.done && task.type !== "prayer");
        if (!mission) return "";
        return `<article class="card hero-mission">
          <span class="eyebrow">مهمة البطل اليوم</span>
          <h2>${esc(PEOPLE[member].name)} · ${esc(mission.title)}</h2>
          <p class="muted">هذه ليست إجبارية وليست للمقارنة. فقط تحدٍّ لطيف يعطي شعور إنجاز قوي.</p>
          <div class="badges">${taskBadges(mission)}</div>
        </article>`;
      }

      function badgesHtml(task) {
        const badges = Array.isArray(task?.badges) ? task.badges : [];
        if (!badges.length) return "";
        return `<div class="achievement-grid">${badges.map((badge) => `<span class="achievement-chip">${esc(badge.icon || "🌟")} ${esc(badge.label || "إنجاز")}</span>`).join("")}</div>`;
      }

      function minutesFromTime(time) {
        if (!/^\d{2}:\d{2}$/.test(String(time || ""))) return null;
        const [h, m] = String(time).split(":").map(Number);
        return h * 60 + m;
      }

      function timeFromMinutes(total) {
        const value = ((Number(total) || 0) + 24 * 60) % (24 * 60);
        return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
      }

      function taskEndTime(task) {
        const start = minutesFromTime(task.suggestedTime);
        const duration = Math.max(0, Number(task.timerMinutes || 0));
        if (start === null || !duration) return "";
        return timeFromMinutes(start + duration);
      }

      function taskTimeRange(task) {
        if (!task.suggestedTime) return "بدون وقت";
        const end = taskEndTime(task);
        return end ? `${task.suggestedTime}–${end}` : task.suggestedTime;
      }

      function sortedTasks(tasks = []) {
        return [...tasks].sort((a, b) => {
          const at = minutesFromTime(a.suggestedTime);
          const bt = minutesFromTime(b.suggestedTime);
          if (at !== null && bt !== null) return at - bt;
          if (at !== null) return -1;
          if (bt !== null) return 1;
          return String(a.title || "").localeCompare(String(b.title || ""), "ar");
        });
      }

      function typeLabel(type) {
        const key = typeKey(type);
        return TYPE_META[key]?.label || TYPES[key]?.[0] || "مهمة";
      }

      function isTaskStarted(task) {
        return Boolean(task?.startedAt) && !task?.done;
      }

      function taskStatusLabel(task) {
        if (task.done) return "تم الإنجاز";
        if (isTaskStarted(task)) return "بدأت الآن";
        return "بانتظار";
      }

      function taskStatusClass(task) {
        if (task.done) return "status-done";
        if (isTaskStarted(task)) return "status-progress";
        return "status-open";
      }

      function taskBadges(task) {
        const earned = taskEarnedPoints(task);
        const bonus = Number(task.bonusPoints || 0) + checklistBonusPoints(task);
        return [
          `<span class="badge ${taskStatusClass(task)}">${taskStatusLabel(task)}</span>`,
          `<span class="badge">${typeIcon(task.type, true)}${typeLabel(task.type)}</span>`,
          task.type === "prayer" ? `<span class="badge">وقت روحاني</span>` : `<span class="badge">${Number(task.points || 0)} نقطة أساس</span>`,
          bonus > 0 ? `<span class="badge bonus-text">+${bonus} بونوس</span>` : "",
          task.done && earned > 0 ? `<span class="badge status-done">${earned} نقطة مكتسبة</span>` : "",
          Number(task.timerMinutes) > 0 ? `<span class="badge">مؤقت ${Number(task.timerMinutes)} د</span>` : "",
          task.ticktickTaskId ? `<span class="badge">TickTick</span>` : ""
        ].filter(Boolean).join("") + badgesHtml(task);
      }

      function taskActionButtons(task, member, parentMode = false) {
        const editButton = parentMode
          ? `<button class="btn btn-line" type="button" data-action="edit-task" data-member="${member}" data-id="${task.id}">تعديل</button>`
          : "";
        const deleteButton = parentMode
          ? `<button class="btn btn-danger" type="button" data-action="delete-task" data-id="${task.id}">حذف</button>`
          : "";

        if (task.done) {
          return `<span class="btn btn-line">تم ✓</span>${editButton}${deleteButton}`;
        }

        const minutes = Number(task.timerMinutes || 0);
        const timerAttrs = `data-member="${member}" data-id="${task.id}" data-minutes="${minutes}" data-title="${esc(task.title)}"`;
        const startLabel = minutes > 0 ? "ابدأ المهمة مع المؤقت" : "ابدأ المهمة";
        const primaryAction = isTaskStarted(task)
          ? `<button class="btn btn-ok" type="button" data-action="complete" data-member="${member}" data-id="${task.id}">إنهاء المهمة</button>`
          : `<button class="btn btn-primary" type="button" data-action="start-task" ${timerAttrs}>${startLabel}</button>`;
        const timerButton = isTaskStarted(task) && minutes > 0
          ? `<button class="btn btn-soft" type="button" data-action="timer" ${timerAttrs}>المؤقت</button>`
          : "";
        return `${primaryAction}${timerButton}${editButton}${deleteButton}`;
      }

            steps: ["تأكد من دخول الوقت.", "استعد بهدوء للوضوء والصلاة.", "صلِّ بخشوع دون استعجال.", "ارجع إلى جدولك التالي بهدوء."],
            tip: "الصلاة قيمة وبركة، وليست سباقًا ولا نقطة في اللعبة."
          }
        };
        const guide = byType[type] || {

          tip: "ابدأ فقط. لا تبحث عن الكمال."

      }

      function taskRows(tasks, member, parentMode = false) {
        const ordered = sortedTasks(tasks || []);
        if (!ordered.length) return `<li class="empty">لا توجد مهام بعد. يمكن توليد خطة اليوم أو إضافة مهمة يدويًا.</li>`;
        return ordered.map((task) => `
          <li class="task-row type-${typeKey(task.type)} ${task.done ? "done" : ""}">
            <div class="time-box"><span>${esc(taskTimeRange(task))}</span><small>${Number(task.timerMinutes) > 0 ? `${Number(task.timerMinutes)} دقيقة` : "بدون مؤقت"}</small></div>
            <button class="task-open" type="button" data-action="task-guide" data-member="${member}" data-id="${task.id}">
              <div class="task-main">
                ${typeIcon(task.type)}
                <div>
                  <p class="task-title">${esc(task.title)}</p>
                  <p class="task-note">${esc(task.note || "اضغط لعرض خطوات التنفيذ.")}</p>
                  <div class="badges">${taskBadges(task)}</div>
                </div>
              </div>
            </button>
            <div class="task-actions">
              ${taskActionButtons(task, member, parentMode)}
            </div>
          </li>
        `).join("");
      }

      function tickCard() {
        if (!tick.configured) {
          return `<article class="card solid"><span class="eyebrow">TickTick</span><h2>TickTick غير مهيأ</h2><p class="muted">أضف مفاتيح TickTick في Railway عندما تريد تفعيل المزامنة.</p></article>`;

          return `<article class="card solid"><span class="eyebrow">TickTick</span><h2>جاهز للربط</h2><p class="muted">اربط حسابك مرة واحدة لاستيراد مهام اليوم وإرسال مهام Hero إلى TickTick.</p><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a></article>`;
        }
        return `<article class="card solid"><span class="eyebrow">TickTick</span><h2>متصل ✓</h2><p class="muted">المهام التي تضيفها في Hero يمكن إرسالها إلى قائمة ${esc(tick.projectName || "Hero")}.</p><div class="row"><button class="btn btn-line" data-action="projects" type="button">اختيار القوائم</button><button class="btn btn-soft" data-action="import" type="button">استيراد مهام اليوم</button><button class="btn btn-danger" data-action="disconnect-ticktick" type="button">فصل TickTick</button></div></article>`;
      }

        if (qs.get("parentLogin") === "invalid") return "رمز الوالدين غير صحيح.";

        if (qs.get("childLogin") === "invalid") return "رمز الدخول غير صحيح.";
        if (qs.get("childLogin") === "not_configured") return "رمز هذا الطفل غير مهيأ في Railway.";
        return "";
      }

        const accounts = [
          { id: "judy", name: "جودي", sub: "مهامي فقط", icon: "👧", cls: "judy-account" },
          { id: "yaman", name: "يَمان", sub: "مهامي فقط", icon: "👦", cls: "yaman-account" },
          { id: "parent", name: "الوالدان", sub: "إدارة الجميع", icon: "👪", cls: "parent-account" }

        return `<div class="stack login-gate">
          <article class="login-screen-card">
            <div class="login-logo">
              <div class="family-symbol" aria-hidden="true">👪</div>
              <h1>Hero Family</h1>
              <div class="gold-divider">♥</div>
              <p class="muted" style="margin:0">مرحبًا بكم في هيرو فاميلي</p>
              <p class="muted small" style="margin:0">منصة عائلية هادئة لتنظيم اليوم، التشجيع، والتقدم خطوة بخطوة.</p>
            </div>
            <section class="account-panel">
              <h2>اختر حسابك للمتابعة</h2>
              <div class="account-choices" role="group" aria-label="اختيار الحساب">
                ${accounts.map((account) => `<button class="account-choice ${account.cls} ${selected === account.id ? "is-selected" : ""}" data-action="login-select" data-member="${account.id}" type="button" aria-pressed="${selected === account.id ? "true" : "false"}"><span class="account-avatar" aria-hidden="true">${account.icon}</span><span class="account-name">${account.name}</span><small class="muted">${account.sub}</small><span class="account-line"></span></button>`).join("")}
              </div>
              <form class="form login-pin-area" id="loginChooserForm" action="${actionPath}" method="post" autocomplete="off">
                <input id="loginIdentity" name="identity" type="hidden" value="${selected}">
                <div class="pin-label">أدخل رمز الدخول</div>
                <input class="pin-input" name="pin" type="text" inputmode="numeric" enterkeyhint="go" maxlength="12" required autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="••••" aria-label="رمز الدخول" pattern="[0-9٠-٩۰-۹ ]*" />
                <small class="muted">يمكن إدخال الأرقام العربية أو الإنجليزية — سيتم تحويلها تلقائيًا.</small>
                <button class="btn btn-primary login-submit" type="submit">${loginButtonText}</button>
                <p class="login-error">${err}</p>
              </form>
              <div class="switch-note">تغيير الحساب يتم من البطاقات أعلاه</div>
            </section>
          </article>
        </div>`;
      }

      function parentLogin() {
        return loginGateway("parent");
      }

      function childLogin(member) {
        return loginGateway(member);
      }

        if (!events.length) return `<p class="muted">لا توجد مواعيد قريبة.</p>`;
        return `<div class="events">${events.slice(0, 6).map((event) => `<div class="event"><strong>${esc(event.title)}</strong><br><span class="muted small">${esc(event.date)} ${esc(event.time || "")}</span></div>`).join("")}</div>`;
      }

        if (!family.parentAuthenticated) return parentLogin();
        if (!dashboard || !child.yaman || !child.judy) return `<article class="card"><h2>جاري تحميل لوحة العائلة…</h2></article>`;
        const summary = dashboard.summary || { yaman: { open: 0, done: 0, total: 0 }, judy: { open: 0, done: 0, total: 0 } };
        const yamanTasks = child.yaman.tasks || [];
        const judyTasks = child.judy.tasks || [];
        return `<div class="stack">
          <article class="card art person-card person-parent">
            <div class="art-layout">
              <div>
                <span class="eyebrow">ChatGPT Daily Coach</span>
                <h2>خطة يومية ذكية، جميلة، وقابلة للتنفيذ</h2>
                <p class="muted">اكتب أهداف اليوم، وسيبني Hero خطة كاملة من 06:00 إلى 21:00 لكل طفل، ساعة بساعة، مع مواقيت الصلاة المحدثة تلقائيًا من مصدر مواقيت الصلاة.</p>
                <div class="row"><button class="btn btn-primary" data-action="ai-plan" type="button">توليد خطة اليوم</button><button class="btn btn-soft" data-action="end-day-parent" type="button">تشجيع نهاية اليوم</button></div>
              </div>
              <div class="soft-scene" aria-hidden="true">${sceneIcons("study", "creative", "movement", "routine")}</div>
            </div>
          </article>

          <div class="grid three">
            <article class="metric person-card person-yaman"><div><strong>${summary.yaman.done}/${summary.yaman.total}</strong><span class="muted">يَمان</span></div><span class="score-orb">${score(yamanTasks)}</span></article>
            <article class="metric person-card person-judy"><div><strong>${summary.judy.done}/${summary.judy.total}</strong><span class="muted">جودي</span></div><span class="score-orb">${score(judyTasks)}</span></article>
            <article class="metric"><div><strong>${score(yamanTasks) + score(judyTasks)}</strong><span class="muted">نقاط العائلة اليوم</span></div><span class="score-orb">★</span></article>

          </div>

          <article class="card solid">
            <span class="eyebrow">إدارة سريعة</span>
            <h2>المهام، المواعيد، والمزامنة</h2>
            <div class="row"><button class="btn btn-primary" data-action="add-task" type="button">إضافة مهمة</button><button class="btn btn-soft" data-action="add-event" type="button">إضافة موعد</button><button class="btn btn-line" data-action="reload" type="button">تحديث</button><button class="btn btn-danger" data-action="logout-parent" type="button">خروج الوالدين</button></div>

            <article class="card list"><div class="list-head"><div><span class="eyebrow">جدول جودي</span><h3>من ساعة إلى ساعة</h3></div><span class="score-orb">${score(judyTasks)}</span></div><ul class="timeline">${taskRows(judyTasks, "judy", true)}</ul></article>
          </div>

          <article class="card solid"><span class="eyebrow">مواعيد قريبة</span><h2>تقويم العائلة</h2>${eventList(dashboard.events || [])}</article>
        </div>`;
      }

      function childView(member) {
        if (!family.parentAuthenticated && !family[`${member}Authenticated`]) return childLogin(member);
        const data = child[member];
        if (!data) return `<article class="card"><h2>جاري تحميل منطقة ${PEOPLE[member].name}…</h2></article>`;
        const tasks = data.tasks || [];
        return `<div class="stack">
          <article class="card art person-card person-${member}">
            <div class="art-layout">
              <div>
                <span class="eyebrow">منطقة ${PEOPLE[member].name}</span>
                <h2>جدول مهامي اليوم</h2>
                <p class="muted">اضغط على أي مهمة لتعرف كيف تنفذها خطوة بخطوة. كل إنجاز يضيف نقاطًا إيجابية فقط.</p>
                <div class="row"><span class="score-orb">${score(tasks)}</span><button class="btn btn-soft" data-action="end-day" data-member="${member}" type="button">تشجيع نهاية اليوم</button><button class="btn btn-line" data-action="logout-child" data-member="${member}" type="button">الخروج من الحساب</button></div>

            </div>
          </article>
          ${progressCard(member, tasks)}
          ${heroMissionCard(member, tasks)}
          <article class="card list"><div class="list-head"><h3>المهام من ساعة إلى ساعة</h3><span class="muted">${today()}</span></div><ul class="timeline">${taskRows(tasks, member, false)}</ul></article>
          <article class="card solid"><span class="eyebrow">المواعيد</span><h2>ما يجب الانتباه له</h2>${eventList(data.events || [])}</article>
        </div>`;
      }

      function currentAccount() {
        if (family.parentAuthenticated) return "parent";
        if (family.yamanAuthenticated && area === "yaman") return "yaman";
        if (family.judyAuthenticated && area === "judy") return "judy";
        if (family.yamanAuthenticated) return "yaman";
        if (family.judyAuthenticated) return "judy";
        return "";
      }

      function showTabsFor(account) {
        const tabs = document.querySelector(".tabs");
        if (!tabs) return;
        tabs.classList.toggle("is-hidden", account !== "parent");
      }

      function render() {
        const account = currentAccount();
        document.body.classList.toggle("is-login", !account);
        if (account && account !== "parent") {
          area = account;
          localStorage.setItem("hero-area", account);
        }
        paintTop();
        showTabsFor(account);
        document.getElementById("root").innerHTML = account
          ? (account === "parent" ? parentView() : childView(account))
          : loginGateway(area);

        await load();
        render();
      }

        document.getElementById("modalRoot").innerHTML = `<section class="modal" role="dialog" aria-modal="true"><div class="modal-top"><button class="btn btn-line" data-action="close" type="button">إغلاق</button></div>${html}</section>`;
      }

      function close() {
        if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
        document.getElementById("modalRoot").innerHTML = "";
      }

        return (child[member]?.tasks || []).find((task) => String(task.id) === String(id));

      function taskGuideModal(member, id) {

        const guide = getTaskGuide(task);
        modal(`

          <div class="task-main" style="margin-bottom:10px">${typeIcon(task.type)}<div><h2 style="margin:0">${esc(task.title)}</h2><p class="muted" style="margin:4px 0 0">${esc(guide.intro)}</p></div></div>
          <div class="grid">
            <article class="metric"><div><strong>${esc(taskTimeRange(task))}</strong><span class="muted">من ساعة إلى ساعة</span></div></article>

            <p class="notice ok"><strong>نصيحة Hero:</strong><br>${esc(guide.tip)}</p>

          </div>
          <div class="guide-box" style="margin-top:14px">

      async function importModal() {
        if (!tick.connected) { modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a>`); return; }
        const ids = JSON.parse(localStorage.getItem("hero-projects") || "[]");

        importTasks = (await api(`/api/ticktick/today-tasks${query}`)).tasks || [];

      function drawImport() {
        modal(`<span class="eyebrow">TickTick</span><h2>استيراد مهام اليوم</h2>${importTasks.length ? importTasks.map((task) => `<button class="import-row ${chosenTasks.has(task.projectId + ":" + task.id) ? "selected" : ""}" data-action="toggle-import" data-key="${task.projectId}:${task.id}" type="button"><span><strong>${esc(task.title)}</strong><br><small>${esc(task.projectName)}</small></span><b>${chosenTasks.has(task.projectId + ":" + task.id) ? "✓" : ""}</b></button>`).join("") : `<p class="empty">لا توجد مهام بتاريخ اليوم.</p>`}<div class="row"><button class="btn btn-primary" data-action="assign-import" data-member="yaman" type="button">إضافة ليَمان</button><button class="btn btn-primary" data-action="assign-import" data-member="judy" type="button">إضافة لجودي</button></div>`);
      }

      function checklistStorageKey(taskId) {
        return `hero-checklist:${taskId}`;
      }

      function getChecklistState(taskId) {
        try {
          return new Set(JSON.parse(localStorage.getItem(checklistStorageKey(taskId)) || "[]"));
        } catch {
          return new Set();
        }
      }

      function saveChecklistState(taskId, state) {
        localStorage.setItem(checklistStorageKey(taskId), JSON.stringify([...state].map(Number).filter(Number.isFinite)));
      }

      function renderChecklistStages(items, taskId) {
        const checked = getChecklistState(taskId);
        return `<div class="guide-box" style="margin-top:10px"><h3>Checklist للإنجاز — علّم ✓ لكل مرحلة</h3><p class="muted small">اضغط على كل مرحلة بعد إنجازها. تبقى العلامات محفوظة على هذا الجهاز.</p><div class="checklist-stages">${items.map((item, index) => {
          const done = checked.has(index);
          return `<button class="checklist-stage ${done ? "checked" : ""}" type="button" data-action="toggle-checklist" data-task-id="${esc(taskId)}" data-index="${index}" aria-pressed="${done ? "true" : "false"}"><span class="v-mark">${done ? "✓" : "○"}</span><span class="stage-text">${esc(item)}</span></button>`;
        }).join("")}</div></div>`;
      }

      function toggleChecklistStage(button) {
        const taskId = button.dataset.taskId || "task";
        const index = Number(button.dataset.index);
        const state = getChecklistState(taskId);
        if (state.has(index)) state.delete(index);
        else state.add(index);
        saveChecklistState(taskId, state);
        const done = state.has(index);
        button.classList.toggle("checked", done);
        button.setAttribute("aria-pressed", done ? "true" : "false");
        const mark = button.querySelector(".v-mark");
        if (mark) mark.textContent = done ? "✓" : "○";
      }

      function renderTaskHelpResult(result, member, taskId) {
        const questions = Array.isArray(result.questions) ? result.questions : [];
        const steps = Array.isArray(result.steps) ? result.steps : [];
        const checklist = Array.isArray(result.checklist) ? result.checklist : [];
        const sourceLabel = result.source === "openai" ? "ChatGPT" : "Hero";
        return `
          <span class="eyebrow">${sourceLabel}</span>
          <h3 style="margin-top:0">مساعدة تنفيذ المهمة</h3>
          ${result.intro ? `<p class="notice ok">${esc(result.intro)}</p>` : ""}
          ${questions.length ? `<div class="guide-box" style="margin-top:10px"><h3>أسئلة قصيرة قبل البدء</h3><ol class="guide-steps">${questions.map((item) => `<li>${esc(item)}</li>`).join("")}</ol></div>` : ""}
          ${steps.length ? `<div class="guide-box" style="margin-top:10px"><h3>خطوات التنفيذ</h3><ol class="guide-steps">${steps.map((item) => `<li>${esc(item)}</li>`).join("")}</ol></div>` : ""}
          ${checklist.length ? renderChecklistStages(checklist, taskId || "task") : ""}
          ${result.encouragement ? `<p class="notice ok" style="margin-top:10px"><strong>تشجيع Hero:</strong><br>${esc(result.encouragement)}</p>` : ""}
          ${(!questions.length && !steps.length && !checklist.length) ? `<p class="notice ok" style="white-space:pre-wrap">${esc(result.answer || "ابدأ بخطوة صغيرة واحدة.")}</p>` : ""}
          ${result.warning ? `<p class="notice" style="margin-top:10px">${esc(result.warning)}</p>` : ""}
        `;
      }

      async function askTaskHelp(member, id, quickQuestion = "") {
        const task = findTask(member, id) || findTask("yaman", id) || findTask("judy", id);
        if (!task) return;
        const questionInput = document.getElementById("taskHelpQuestion");
        const output = document.getElementById("taskHelpOutput");
        const question = quickQuestion || questionInput?.value?.trim() || "اسألني أسئلة قصيرة، ثم حضّر checklist، ثم اشرح كيف أنفذ المهمة.";
        if (output) {
          output.style.display = "block";
          output.innerHTML = `<p class="notice ok">Hero يفكر في أسئلة قصيرة و checklist عملي...</p>`;
        }
        try {
          const result = await api("/api/ai/task-help", {
            method: "POST",
            body: JSON.stringify({ assignee: member, task, question })
          });
          if (output) {
            output.style.display = "block";
            output.innerHTML = renderTaskHelpResult(result || {}, member, id);
          }
        } catch (error) {
          if (output) {
            output.style.display = "block";
            output.innerHTML = `<p class="notice bad">تعذر جلب شرح ChatGPT الآن.<br>${esc(error.message)}</p>`;
          }
        }
      }

      function startTimer(minutes, title, member = "", id = "") {
        let left = Math.max(1, Math.round(Number(minutes) || 1)) * 60;
        timerPaused = false;
        if (activeTimer) clearInterval(activeTimer);
        const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        modal(`<span class="eyebrow">مؤقت المهمة</span><h2>${esc(title || "مهمة تركيز")}</h2><div class="timer-big" id="timerDisplay">${fmt(left)}</div><p class="muted">ابدأ الآن. عند الانتهاء اضغط زر إنهاء المهمة ليتم حفظ الإنجاز والنقاط.</p><div class="row"><button class="btn btn-soft" data-action="pause-timer" type="button">إيقاف مؤقت</button>${member && id ? `<button class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${id}" type="button">إنهاء المهمة</button>` : ""}<button class="btn btn-line" data-action="close" type="button">إغلاق</button></div>`);
        activeTimer = setInterval(() => {
          if (timerPaused) return;
          left -= 1;
          const el = document.getElementById("timerDisplay");
          if (el) el.textContent = fmt(Math.max(0, left));
          if (left <= 0) {
            clearInterval(activeTimer);
            activeTimer = null;
            if (el) el.textContent = "انتهى ✓";
          }
        }, 1000);
      }

      async function startTask(member, id, minutes = 0, title = "") {
        const result = await api(`/api/family/tasks/${id}/start`, { method: "PATCH", body: JSON.stringify({ assignee: member }) });
        if (Number(minutes) > 0) {
          startTimer(minutes, title || result.task?.title || "مهمة", member, id);
          await load();
          return;
        }
        await refresh();
      }

      function achievementModal(task, member = "") {
        const earned = taskEarnedPoints(task);
        const bonus = Number(task.bonusPoints || 0) + checklistBonusPoints(task);
        const personName = PEOPLE[member]?.name || "بطل";
        modal(`<span class="eyebrow">إنجاز جديد</span>
          <h2>أحسنت يا ${esc(personName)} ✨</h2>
          <p class="notice ok">أنهيت المهمة: <strong>${esc(task.title || "مهمة")}</strong></p>
          <div class="grid">
            <article class="metric"><div><strong>${earned}</strong><span class="muted">نقطة مكتسبة</span></div></article>
            <article class="metric"><div><strong>${bonus > 0 ? `+${bonus}` : "0"}</strong><span class="muted">بونوس هادئ</span></div></article>
          </div>
          <div class="guide-box" style="margin-top:14px">
            <h3>الأوسمة</h3>
            ${badgesHtml(task) || `<p class="muted">وسام جميل للمحاولة والإنجاز.</p>`}
          </div>
          <p class="muted">الهدف هو التقدم خطوة بخطوة، بدون ضغط وبدون مقارنة.</p>
          <button class="btn btn-primary" data-action="reload" type="button">العودة للمهام</button>`);
      }

      document.addEventListener("click", async (event) => {
        const target = event.target.closest("[data-area],[data-action]");
        if (!target) return;

        if (target.dataset.area) {
          area = target.dataset.area;
          localStorage.setItem("hero-area", area);
          history.replaceState(null, "", `?area=${area}`);
          render();
          return;
        }

        event.preventDefault();
        const action = target.dataset.action;

        try {
          if (action === "login-select") {
            area = target.dataset.member || "parent";
            localStorage.setItem("hero-area", area);
            history.replaceState(null, "", `?area=${area}`);
            render();
            return;
          }
          if (action === "close") { close(); return; }
          if (action === "reload") { close(); await refresh(); return; }
          if (action === "pause-timer") { timerPaused = !timerPaused; target.textContent = timerPaused ? "متابعة" : "إيقاف مؤقت"; return; }
          if (action === "task-guide") { taskGuideModal(target.dataset.member, target.dataset.id); return; }
          if (action === "task-help") { await askTaskHelp(target.dataset.member, target.dataset.id, target.dataset.quick || ""); return; }
          if (action === "toggle-checklist") { toggleChecklistStage(target); return; }
          if (action === "edit-task") { editTaskModal(target.dataset.member, target.dataset.id); return; }
          if (action === "timer") { startTimer(target.dataset.minutes, target.dataset.title, target.dataset.member || "", target.dataset.id || ""); return; }
          if (action === "start-task") { await startTask(target.dataset.member, target.dataset.id, target.dataset.minutes, target.dataset.title); return; }
          if (action === "ai-plan") { aiPlanModal(); return; }
          if (action === "end-day") { await endDay(target.dataset.member); return; }
          if (action === "end-day-parent") { await endDayParent(); return; }
          if (action === "add-task") { addTaskModal(); return; }
          if (action === "add-event") { addEventModal(); return; }
          if (action === "projects") { await projectsModal(); return; }
          if (action === "import") { await importModal(); return; }
          if (action === "disconnect-ticktick") { await api("/api/ticktick/disconnect", { method: "POST" }); await refresh(); return; }
          if (action === "toggle-project") { chosenProjects.has(target.dataset.id) ? chosenProjects.delete(target.dataset.id) : chosenProjects.add(target.dataset.id); drawProjects(); return; }
          if (action === "save-projects") { localStorage.setItem("hero-projects", JSON.stringify([...chosenProjects])); close(); return; }
          if (action === "toggle-import") { chosenTasks.has(target.dataset.key) ? chosenTasks.delete(target.dataset.key) : chosenTasks.add(target.dataset.key); drawImport(); return; }
          if (action === "assign-import") {
            const member = target.dataset.member;
            for (const key of chosenTasks) {
              const task = importTasks.find((item) => `${item.projectId}:${item.id}` === key);
              if (task) {
                await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: member, title: task.title, type: "other", points: 5, date: today(), note: task.content || "مستورد من TickTick", source: "ticktick", ticktickTaskId: task.id, ticktickProjectId: task.projectId, ticktickProjectName: task.projectName, timerMinutes: 0, suggestedTime: "" }) });
              }
            }
            close(); await refresh(); return;
          }
          if (action === "complete") { const result = await api(`/api/family/tasks/${target.dataset.id}/complete`, { method: "PATCH", body: JSON.stringify({ assignee: target.dataset.member }) }); close(); await refresh(); achievementModal(result.task || {}, target.dataset.member); return; }
          if (action === "delete-task") { if (confirm("حذف المهمة؟")) { await api(`/api/family/tasks/${target.dataset.id}`, { method: "DELETE" }); await refresh(); } return; }
          if (action === "logout-parent") { await api("/api/family/parent/logout", { method: "POST" }); area = "parent"; localStorage.setItem("hero-area", "parent"); history.replaceState(null, "", "?area=parent"); await refresh(); return; }
          if (action === "logout-child") { await api(`/api/family/child/${target.dataset.member}/logout`, { method: "POST" }); area = target.dataset.member || "parent"; localStorage.setItem("hero-area", area); history.replaceState(null, "", `?area=${area}`); await refresh(); return; }
        } catch (error) {
          modal(`<span class="eyebrow">تنبيه</span><h2>لم تكتمل العملية</h2><p class="notice bad">${esc(error.message)}</p><button class="btn btn-line" data-action="close" type="button">إغلاق</button>`);
        }
      });

      document.addEventListener("submit", async (event) => {
        if (event.target.id === "loginChooserForm") {
          const identity = document.getElementById("loginIdentity")?.value || "parent";
          const safeIdentity = ["parent", "yaman", "judy"].includes(identity) ? identity : "parent";
          const pinInput = event.target.querySelector('input[name="pin"]');
          if (pinInput) pinInput.value = normalizePinValue(pinInput.value);
          event.target.action = safeIdentity === "parent" ? "/auth/parent/login" : `/auth/child/${safeIdentity}/login`;
          localStorage.setItem("hero-area", safeIdentity);
          return;
        }

        if (event.target.id === "planForm") {
          event.preventDefault();
          await generatePlan({
            startTime: document.getElementById("planStartTime").value || "06:00",
            endTime: document.getElementById("planEndTime").value || "21:00",
            goals: document.getElementById("planGoals").value.trim()
          });
          return;
        }

        if (event.target.id === "taskForm") {
          event.preventDefault();
          const type = document.getElementById("taskType").value;
          await api("/api/family/tasks", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("taskMember").value, title: document.getElementById("taskTitle").value, type, points: TYPES[type][1], date: today(), note: document.getElementById("taskNote").value, suggestedTime: document.getElementById("taskSuggestedTime").value, timerMinutes: Number(document.getElementById("taskTimerMinutes").value) || 0, source: "parent" }) });
          close(); await refresh(); return;
        }

        if (event.target.id === "editTaskForm") {
          event.preventDefault();
          const id = document.getElementById("editTaskId").value;
          await api(`/api/family/tasks/${id}`, { method: "PATCH", body: JSON.stringify({ assignee: document.getElementById("editTaskMember").value, title: document.getElementById("editTaskTitle").value, type: document.getElementById("editTaskType").value, points: Number(document.getElementById("editTaskPoints").value) || 0, date: document.getElementById("editTaskDate").value || today(), note: document.getElementById("editTaskNote").value, suggestedTime: document.getElementById("editTaskSuggestedTime").value, timerMinutes: Number(document.getElementById("editTaskTimerMinutes").value) || 0 }) });
          close(); await refresh(); return;
        }

        if (event.target.id === "eventForm") {
          event.preventDefault();
          await api("/api/family/events", { method: "POST", body: JSON.stringify({ assignee: document.getElementById("eventMember").value, title: document.getElementById("eventTitle").value, date: document.getElementById("eventDate").value, time: document.getElementById("eventTime").value, note: document.getElementById("eventNote").value }) });
          close(); await refresh();
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "loginIdentity") {
          area = event.target.value || "parent";
          localStorage.setItem("hero-area", area);
          paintTop();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.classList?.contains("pin-input")) {
          event.target.value = event.target.value.replace(/[^0-9]/g, "").slice(0, 12);
        }
      });

      function activatePinFields() {
        document.querySelectorAll(".pin-input").forEach((input) => {
          input.removeAttribute("readonly");
          input.disabled = false;
          input.style.pointerEvents = "auto";
          input.addEventListener("pointerdown", () => setTimeout(() => input.focus({ preventScroll: true }), 0));
          input.addEventListener("click", () => input.focus({ preventScroll: true }));
        });
      }

      refresh().catch((error) => {
        paintTop();
        document.getElementById("root").innerHTML = `<article class="card"><span class="eyebrow">خطأ تشغيل</span><h2>تعذر تشغيل التطبيق</h2><p class="notice bad">${esc(error.message)}</p><button class="btn btn-line" data-action="reload" type="button">إعادة المحاولة</button></article>`;
      });
    })();
  </script>
</body>
</html>
