<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Hero Family</title>
  <style>
    :root{--bg:#f7f6ff;--surface:#fff;--ink:#1f2340;--muted:#656980;--line:#dfdcf3;--brand:#5b5bd6;--brand2:#4039ac;--soft:#eeecff;--good:#15846a;--goodsoft:#e9f9f4;--warning:#fff5d9;--danger:#b83059;--r:22px;--shadow:0 14px 34px rgba(43,38,110,.10)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at top left,rgba(120,100,240,.15),transparent 34rem),var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(91,91,214,.35);outline-offset:2px}.app{width:min(100% - 26px,1050px);margin:auto;padding:16px 0 52px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;border-radius:26px;background:linear-gradient(135deg,#2e286f,#554ad1 60%,#6c5df0);color:#fff;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.15);font-weight:900}.head h1{margin:0;font-size:1.45rem}.head p{margin:4px 0 0;color:#e7e6ff;font-size:.88rem}.date{padding:8px 12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.1);font-size:.8rem}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px;margin:16px 0;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 8px 20px rgba(31,35,64,.05)}.tab{min-height:50px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:800}.tab.active{color:#fff;background:var(--brand);box-shadow:0 8px 16px rgba(91,91,214,.22)}.tab small{display:block;margin-top:2px;font-weight:400}.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 6px 18px rgba(31,35,64,.04)}.card.soft{background:linear-gradient(145deg,#fbfaff,#eeecff)}.card.good{background:linear-gradient(145deg,#effbf7,#fff);border-color:#c8eadf}.card.warn{background:linear-gradient(145deg,#fffbf2,#fff);border-color:#f1dca1}.eyebrow{display:block;margin-bottom:6px;color:var(--brand2);font-weight:800;font-size:.78rem}.card h2{margin:0;font-size:1.55rem}.card h3{margin:0;font-size:1.04rem}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border:1px solid transparent;border-radius:15px;text-decoration:none;font-weight:800}.btn-primary{background:var(--brand);color:#fff}.btn-secondary{background:#fff;border-color:#c9cde0;color:var(--ink)}.btn-good{background:var(--good);color:#fff}.btn-danger{background:#fff;border-color:#efbdc9;color:var(--danger)}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.form{display:grid;gap:13px;margin-top:17px}label{display:grid;gap:7px;font-weight:800}input,textarea,select{width:100%;min-height:52px;padding:12px;border:1px solid #cbd0e3;border-radius:14px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.pin{font-size:1.18rem;letter-spacing:.18em;text-align:center;direction:ltr}.pin-help{margin:0;font-size:.84rem;color:var(--muted)}.error{margin:0;color:var(--danger);font-weight:700}.status{padding:13px 15px;border:1px solid #d8d2fb;border-radius:16px;background:var(--soft);color:var(--brand2)}.status.warn{background:var(--warning);border-color:#efd88a;color:#775300}.status.good{background:var(--goodsoft);border-color:#c4e8db;color:#076356}.metric{padding:14px;border:1px solid var(--line);border-radius:17px;background:#fafaff}.metric strong{display:block;font-size:1.45rem}.metric span{color:var(--muted);font-size:.82rem}.list{padding:0;list-style:none;margin:0}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{font-size:1rem}.item p{margin:3px 0 0;color:var(--muted);font-size:.85rem}.badge{padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:.76rem;font-weight:800}.badge.done{background:var(--goodsoft);color:#086556}.hidden{display:none!important}.toast{position:fixed;left:15px;bottom:16px;max-width:min(400px,calc(100% - 30px));padding:13px 15px;border-radius:15px;background:#292356;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(120%);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.footer{margin:24px 0 0;color:var(--muted);font-size:.8rem;text-align:center}@media(max-width:700px){.two{grid-template-columns:1fr}.date{display:none}.app{width:min(100% - 18px,1050px)}.head{padding:16px}.tabs{gap:4px;padding:5px}.tab{font-size:.84rem}.item{grid-template-columns:1fr}.item .row{margin:0}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div class="brand"><div class="mark" id="mark">H</div><div><h1 id="title">Hero Family</h1><p id="subtitle">مساحة هادئة لتنظيم مهام العائلة.</p></div></div><div class="date" id="date"></div></header>
    <nav class="tabs" aria-label="المناطق"><button class="tab" data-area="judy" type="button">جودي<small>مهامي اليوم</small></button><button class="tab" data-area="yaman" type="button">يَمان<small>خطتي وإبداعي</small></button><button class="tab" data-area="parent" type="button">الوالدان<small>إدارة العائلة</small></button></nav>
    <section id="root" class="grid" aria-live="polite"></section>
    <p class="footer">Hero Family · المهام والمواعيد تحفظ في قاعدة بيانات العائلة.</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const TYPES={study:"دراسة",home:"مسؤولية منزلية",creative:"إبداع",movement:"حركة",social:"مهارة اجتماعية",routine:"روتين",other:"مهمة"};
  const state={area:new URLSearchParams(location.search).get("area")||"parent",family:null,tick:null,dashboard:null,children:{yaman:null,judy:null}};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const dateKey=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
  function notify(message){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove("show"),3500)}
  async function api(url,options={}){const response=await fetch(url,{...options,credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})}});const raw=await response.text();let body=null;try{body=raw?JSON.parse(raw):null}catch{}if(!response.ok){const error=new Error(body?.error||"تعذر تنفيذ العملية الآن.");error.status=response.status;throw error}return body}
  function params(){return new URLSearchParams(location.search)}
  function setArea(area){const p=params();p.set("area",area);history.replaceState({},"",`/?${p.toString()}`);state.area=area;render()}
  function updateHeader(){const labels={parent:["⌂","Hero Family","منطقة الوالدين: تنظيم واضح وعدل بين الجميع."],yaman:["Y","Hero — يَمان","خطوة واحدة واضحة في كل مرة."],judy:["J","Hero — جودي","نختار مهمة صغيرة وننجزها بهدوء."]};const [mark,title,subtitle]=labels[state.area];$("mark").textContent=mark;$("title").textContent=title;$("subtitle").textContent=subtitle;$("date").textContent=new Intl.DateTimeFormat("ar",{weekday:"long",day:"numeric",month:"long"}).format(new Date());document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.area===state.area))}
  function loginMessage(kind){const p=params();return p.get(kind)==="invalid"?"الرمز غير صحيح. حاول مرة أخرى.":p.get(kind)==="not_configured"?"رمز الدخول لم يُضف في Railway بعد.":""}
  function tickStatus(){if(!state.tick?.configured)return `<div class="status warn">TickTick غير مهيأ بعد في Railway. هذا لا يمنع دخول الوالدين أو إنشاء المهام.</div>`;if(!state.tick.connected)return `<div class="status">TickTick غير متصل في هذا المتصفح. <a class="btn btn-secondary" style="margin-top:9px" href="/auth/ticktick">ربط TickTick</a></div>`;return `<div class="status good">TickTick متصل في هذا المتصفح.</div>`}
  function parentLogin(){const error=loginMessage("parentLogin");return `<article class="card soft"><span class="eyebrow">منطقة الوالدين</span><h2>إدارة مهام يَمان وجودي</h2><p class="muted">اكتب رمز الوالدين من لوحة المفاتيح، ثم اضغط فتح منطقة الوالدين أو Enter.</p>${tickStatus()}<form class="form" action="/auth/parent/login" method="post"><label>رمز الوالدين<input class="pin" name="pin" type="tel" inputmode="numeric" pattern="[0-9٠-٩۰-۹]*" minlength="4" required autocomplete="one-time-code" enterkeyhint="done" autofocus placeholder="اكتب الرمز هنا"></label><p class="pin-help">הזנה מהמקלדת בלבד. אין לוח מספרים במסך.</p>${error?`<p class="error">${error}</p>`:""}<button class="btn btn-primary" type="submit">فتح منطقة الوالدين</button></form></article>`}
  function childLogin(member){const person=member==="yaman"?"يَمان":"جودي";const enabled=state.family?.[`${member}PinConfigured`];const error=loginMessage("childLogin");if(!enabled)return `<article class="card warn"><span class="eyebrow">رمز غير مهيأ</span><h2>منطقة ${person} غير جاهزة بعد</h2><p class="muted">على الوالدين إضافة ${member.toUpperCase()}_PIN في Railway.</p></article>`;return `<article class="card soft"><span class="eyebrow">منطقة ${person}</span><h2>أدخل رمز الدخول الخاص بك</h2><form class="form" action="/auth/child/${member}/login" method="post"><label>رمز ${person}<input class="pin" name="pin" type="tel" inputmode="numeric" pattern="[0-9٠-٩۰-۹]*" minlength="4" required autocomplete="one-time-code" enterkeyhint="done" autofocus placeholder="اكتب الرمز هنا"></label><p class="pin-help">اكتب الرمز من لوحة المفاتيح ثم اضغط Enter.</p>${error?`<p class="error">${error}</p>`:""}<button class="btn btn-primary" type="submit">فتح منطقتي</button></form></article>`}
  function tasksHtml(tasks,member,parent=false){if(!tasks?.length)return `<li class="item"><div><h3>لا توجد مهام لهذا اليوم</h3><p>خذ وقتاً للراحة أو أضف مهمة واضحة.</p></div></li>`;return tasks.map(task=>`<li class="item"><div><h3>${esc(task.title)}</h3><p>${esc(TYPES[task.type]||"مهمة")} · ${task.points} نقطة${task.note?` · ${esc(task.note)}`:""}</p></div><div class="row">${task.done?`<span class="badge done">تم ✓</span>`:`<button class="btn btn-good" data-action="complete" data-id="${task.id}" data-member="${member}" type="button">أنجزتها</button>`}${parent?`<button class="btn btn-danger" data-action="delete-task" data-id="${task.id}" type="button">حذف</button>`:""}</div></li>`).join("")}
  function eventsHtml(events,parent=false){if(!events?.length)return `<li class="item"><div><h3>لا توجد مواعيد اليوم</h3></div></li>`;return events.map(event=>`<li class="item"><div><h3>${esc(event.title)}</h3><p>${esc(event.date)} ${esc(event.time||"")} ${event.note?`· ${esc(event.note)}`:""}</p></div>${parent?`<button class="btn btn-danger" data-action="delete-event" data-id="${event.id}" type="button">حذف</button>`:""}</li>`).join("")}
  function childView(member){const authed=state.family?.parentAuthenticated||state.family?.[`${member}Authenticated`];if(!authed)return childLogin(member);const d=state.children[member];if(!d)return `<article class="card warn"><h2>تعذر تحميل الخطة</h2><p class="muted">اضغط إعادة المحاولة.</p><button class="btn btn-primary" data-action="reload" type="button">إعادة المحاولة</button></article>`;const done=d.tasks.filter(t=>t.done).length;const next=d.tasks.find(t=>!t.done);return `<div class="grid two"><div class="grid"><article class="card soft"><span class="eyebrow">المهمة التالية</span><h2>${next?esc(next.title):"أحسنت، أنهيت مهام اليوم."}</h2><p class="muted">${next?esc(next.note||"ابدأ بخمس دقائق فقط."):"الراحة جزء مهم من الخطة."}</p>${next?`<button class="btn btn-good" data-action="complete" data-id="${next.id}" data-member="${member}" type="button">أنجزتها</button>`:""}</article><article class="card"><span class="eyebrow">خطة اليوم</span><ul class="list">${tasksHtml(d.tasks,member)}</ul></article></div><div class="grid"><article class="card good"><span class="eyebrow">تقدمي اليوم</span><div class="grid two"><div class="metric"><strong>${done}/${d.tasks.length}</strong><span>مهام مكتملة</span></div><div class="metric"><strong>${d.tasks.filter(t=>!t.done).length}</strong><span>متبقي</span></div></div></article><article class="card"><span class="eyebrow">مواعيدي</span><ul class="list">${eventsHtml(d.events)}</ul></article><form action="/auth/logout/${member}" method="post"><button class="btn btn-secondary" type="submit">قفل المنطقة</button></form></div></div>`}
  function parentDashboard(){if(!state.dashboard)return `<article class="card warn"><h2>تم قبول الرمز، لكن تعذر تحميل لوحة العائلة</h2><p class="muted">تأكد أن DATABASE_URL يشير إلى Postgres ثم اضغط إعادة المحاولة.</p><button class="btn btn-primary" data-action="reload" type="button">إعادة المحاولة</button></article>`;const s=state.dashboard.summary;return `<div class="grid"><article class="card soft"><span class="eyebrow">لوحة العائلة</span><h2>نظرة سريعة على اليوم</h2>${tickStatus()}<div class="grid two" style="margin-top:14px"><div class="metric"><strong>${s.yaman.done}/${s.yaman.total}</strong><span>يَمان — مهام مكتملة</span></div><div class="metric"><strong>${s.judy.done}/${s.judy.total}</strong><span>جودي — مهام مكتملة</span></div></div><div class="row"><button class="btn btn-primary" data-action="show-task" type="button">إضافة مهمة</button><button class="btn btn-secondary" data-action="show-event" type="button">إضافة موعد</button><a class="btn btn-secondary" href="/auth/ticktick">ربط TickTick</a><form action="/auth/logout/parent" method="post"><button class="btn btn-danger" type="submit">خروج</button></form></div></article><div class="grid two"><article class="card"><span class="eyebrow">يَمان</span><ul class="list">${tasksHtml(state.children.yaman?.tasks||[],"yaman",true)}</ul></article><article class="card"><span class="eyebrow">جودي</span><ul class="list">${tasksHtml(state.children.judy?.tasks||[],"judy",true)}</ul></article></div><article class="card"><span class="eyebrow">مواعيد قادمة</span><ul class="list">${eventsHtml(state.dashboard.events,true)}</ul></article><div id="forms"></div></div>`}
  function parentView(){return state.family?.parentAuthenticated?parentDashboard():parentLogin()}
  function render(){updateHeader();$("root").innerHTML=state.area==="parent"?parentView():childView(state.area)}
  async function load(){state.family=await api("/api/family/status").catch(()=>null);state.tick=await api("/api/ticktick/status").catch(()=>({configured:false,connected:false}));const parent=state.family?.parentAuthenticated;const y=parent||state.family?.yamanAuthenticated;const j=parent||state.family?.judyAuthenticated;state.children.yaman=y?await api(`/api/family/child/yaman?date=${dateKey()}`).catch(()=>null):null;state.children.judy=j?await api(`/api/family/child/judy?date=${dateKey()}`).catch(()=>null):null;state.dashboard=parent?await api(`/api/family/dashboard?date=${dateKey()}`).catch(()=>null):null;render()}
  function formTask(){const host=$("forms");if(!host)return;host.innerHTML=`<article class="card"><span class="eyebrow">مهمة جديدة</span><form class="form" id="task-form"><label>لمن؟<select name="assignee"><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>اسم المهمة<input name="title" required maxlength="160" placeholder="مثال: حل 3 أسئلة رياضيات"></label><div class="grid two"><label>نوع المهمة<select name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><label>النقاط<input name="points" type="number" min="0" max="50" value="10"></label></div><label>ملاحظة<input name="note" maxlength="400" placeholder="ابدأ بالسؤال الأسهل"></label><div class="row"><button class="btn btn-primary" type="submit">حفظ المهمة</button><button class="btn btn-secondary" data-action="close-form" type="button">إلغاء</button></div></form></article>`}
  function formEvent(){const host=$("forms");if(!host)return;host.innerHTML=`<article class="card"><span class="eyebrow">موعد جديد</span><form class="form" id="event-form"><label>لمن؟<select name="assignee"><option value="family">كل العائلة</option><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>اسم الموعد<input name="title" required maxlength="140" placeholder="مثال: رياضة أو زيارة"></label><div class="grid two"><label>التاريخ<input name="date" type="date" value="${dateKey()}" required></label><label>الوقت<input name="time" type="time"></label></div><label>ملاحظة<input name="note" maxlength="350"></label><div class="row"><button class="btn btn-primary" type="submit">حفظ الموعد</button><button class="btn btn-secondary" data-action="close-form" type="button">إلغاء</button></div></form></article>`}
  document.addEventListener("click",async event=>{const tab=event.target.closest("[data-area]");if(tab){setArea(tab.dataset.area);return}const b=event.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="reload"){await load();return}if(a==="show-task"){formTask();return}if(a==="show-event"){formEvent();return}if(a==="close-form"){const host=$("forms");if(host)host.innerHTML="";return}if(a==="complete"){try{await api(`/api/family/tasks/${encodeURIComponent(b.dataset.id)}/complete`,{method:"PATCH",body:JSON.stringify({assignee:b.dataset.member})});notify("أحسنت. تم تسجيل الإنجاز.");await load()}catch(e){notify(e.message)}return}if(a==="delete-task"){if(!confirm("حذف المهمة؟"))return;try{await api(`/api/family/tasks/${encodeURIComponent(b.dataset.id)}`,{method:"DELETE"});await load()}catch(e){notify(e.message)}return}if(a==="delete-event"){if(!confirm("حذف الموعد؟"))return;try{await api(`/api/family/events/${encodeURIComponent(b.dataset.id)}`,{method:"DELETE"});await load()}catch(e){notify(e.message)}}});
  document.addEventListener("submit",async event=>{if(event.target.id==="task-form"){event.preventDefault();const f=new FormData(event.target);try{await api("/api/family/tasks",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});notify("تمت إضافة المهمة.");await load()}catch(e){notify(e.message)}}if(event.target.id==="event-form"){event.preventDefault();const f=new FormData(event.target);try{await api("/api/family/events",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});notify("تم حفظ الموعد.");await load()}catch(e){notify(e.message)}}});
  load().catch(()=>{render()});
})();
</script>
</body>
</html>
