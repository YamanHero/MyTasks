<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Hero Family — Daily Coach</title>
  <style>
    :root{--bg:#f7f4ff;--card:#ffffff;--ink:#14162f;--muted:#687089;--line:#ded8ff;--brand:#5b5bd6;--brand2:#372c8e;--gold:#f6bb50;--ok:#16856a;--danger:#b63258;--soft:#efedff;--shadow:0 22px 60px rgba(55,44,142,.14);--radius:28px}
    body[data-area="judy"]{--bg:#fff7fb;--brand:#c74478;--brand2:#7e1e50;--soft:#ffe8f1;--line:#f0cad8;--ink:#34172a}
    *{box-sizing:border-box}html{direction:rtl}body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7;text-align:right;background:radial-gradient(circle at top left,rgba(91,91,214,.20),transparent 32rem),radial-gradient(circle at bottom right,rgba(246,187,80,.16),transparent 34rem),var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}input,select,textarea{width:100%;min-height:54px;border:1px solid #cdd2e7;border-radius:16px;padding:12px 14px;background:white;color:var(--ink);direction:rtl;text-align:right}textarea{min-height:94px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(91,91,214,.25);outline-offset:2px}.app{width:min(100% - 24px,1120px);margin:0 auto;padding:16px 0 64px}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px;border-radius:34px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:white;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;inset:auto -60px -100px auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}.hero>*{position:relative}.brand{display:flex;gap:14px;align-items:center}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:22px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-size:1.35rem;font-weight:900}.hero h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}.hero p{margin:5px 0 0;color:#efedff}.status-pill{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0;padding:8px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 12px 28px rgba(55,44,142,.07)}.tab{min-height:62px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-weight:900}.tab.active{background:var(--brand);color:white}.tab small{display:block;font-weight:500}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{position:relative;overflow:hidden;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 26px rgba(31,35,64,.06);padding:22px}.card.glow{background:linear-gradient(145deg,#fff,var(--soft))}.card h2{margin:0 0 8px;font-size:1.55rem}.card h3{margin:0 0 6px}.eyebrow{display:block;color:var(--brand);font-size:.82rem;font-weight:900;margin-bottom:6px}.muted{color:var(--muted)}.small{font-size:.88rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;border:1px solid transparent;border-radius:16px;padding:10px 16px;font-weight:900;text-align:center}.btn-primary{background:var(--brand);color:white}.btn-soft{background:var(--soft);color:var(--brand2)}.btn-ok{background:var(--ok);color:white}.btn-line{background:white;border-color:#cbd0e4;color:var(--ink)}.btn-danger{background:#fff0f4;color:var(--danger);border-color:#ecc2cd}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{padding:15px 17px;border:1px solid #f1dda6;background:#fff7dc;border-radius:20px;color:#7a560e}.notice.ok{background:#ecfbf6;border-color:#bee9dd;color:#0d614f}.metric{padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#fff,var(--soft))}.metric strong{display:block;font-size:2rem;line-height:1}.list{padding:0}.list-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.task-list{margin:0;padding:0;list-style:none}.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}.task.done{background:#f1fbf7}.task h3{margin:0}.task p{margin:4px 0 0;color:var(--muted);font-size:.9rem}.empty{padding:26px;text-align:center;color:var(--muted)}.form{display:grid;gap:13px}.login{max-width:620px;margin:0 auto}.login-error{color:var(--danger);font-weight:800}.modal-root:empty{display:none}.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:14px;background:rgba(18,16,44,.58)}.modal{width:min(100%,720px);max-height:calc(100vh - 28px);overflow:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 35px 100px rgba(0,0,0,.28)}.close{float:left}.project-row,.import-row{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;min-height:60px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:right}.selected{background:var(--soft);border-color:var(--brand)}.ai-banner{border:1px solid rgba(246,187,80,.45);background:linear-gradient(135deg,#fff8e7,#fff,#efedff)}.score-orb{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#ffe2a3);font-size:2rem;font-weight:900;color:#6b4400;box-shadow:0 18px 34px rgba(246,187,80,.24)}.footer{margin-top:22px;color:var(--muted);text-align:center;font-size:.83rem}@media(max-width:760px){.hero{grid-template-columns:1fr}.tabs,.grid{grid-template-columns:1fr}.task{grid-template-columns:1fr}.row .btn{width:100%}}
  </style>
</head>
<body data-area="parent">
  <main class="app">
    <header class="hero"><div class="brand"><div class="mark" id="mark">✦</div><div><h1>Hero Family</h1><p id="subtitle">منظومة يومية جميلة، هادئة، ومشجعة.</p></div></div><div class="status-pill" id="datePill"></div></header>
    <nav class="tabs"><button class="tab" data-area="parent">الوالدان<small>القيادة الهادئة</small></button><button class="tab" data-area="yaman">يَمان<small>خطة اليوم</small></button><button class="tab" data-area="judy">جودي<small>خطوات جميلة</small></button></nav>
    <section id="root" class="stack"></section>
    <p class="footer">Hero يحفّز الجهد، لا يضغط. النقاط للتشجيع فقط.</p>
  </main>
  <div class="modal-root" id="modalRoot"></div>
  <script>
  (()=>{const PEOPLE={parent:{name:"الوالدان",mark:"✦",sub:"لوحة قيادة هادئة وخطة يومية ذكية."},yaman:{name:"يَمان",mark:"Y",sub:"خطوة واحدة واضحة في كل مرة."},judy:{name:"جودي",mark:"J",sub:"ألوان لطيفة وخطوات مشجعة."}};const TYPES={study:["دراسة",15],home:["مسؤولية",10],creative:["إبداع",15],movement:["حركة",10],social:["مهارة اجتماعية",10],routine:["روتين",5],other:["مهمة",5]};const qs=new URLSearchParams(location.search);let area=qs.get("area")||localStorage.getItem("hero-area")||"parent";let family={},tick={},dashboard=null,child={yaman:null,judy:null},projects=[],chosenProjects=new Set(),importTasks=[],chosenTasks=new Set();const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));async function api(url,opts={}){const r=await fetch(url,{...opts,credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json",...(opts.headers||{})}});const text=await r.text();let body=null;try{body=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(body?.error||"تعذر تنفيذ العملية.");return body}async function load(){const [f,t]=await Promise.all([api("/api/family/status").catch(()=>({})),api("/api/ticktick/status").catch(()=>({configured:false,connected:false}))]);family=f;tick=t;dashboard=null;child={yaman:null,judy:null};if(f.parentAuthenticated)dashboard=await api(`/api/family/dashboard?date=${today()}`).catch(()=>null);for(const m of ["yaman","judy"]){if(f.parentAuthenticated||f[`${m}Authenticated`])child[m]=await api(`/api/family/child/${m}?date=${today()}`).catch(()=>null)}}function paintTop(){document.body.dataset.area=area;document.getElementById("mark").textContent=PEOPLE[area].mark;document.getElementById("subtitle").textContent=PEOPLE[area].sub;document.getElementById("datePill").textContent=new Intl.DateTimeFormat("ar",{weekday:"long",day:"numeric",month:"long"}).format(new Date());document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.area===area))}function tickCard(){if(!tick.configured)return `<article class="notice">TickTick غير مهيأ في Railway. الواجهة تعمل، لكن المزامنة لن تعمل حتى تكتمل المتغيرات.</article>`;if(!tick.connected)return `<article class="card"><span class="eyebrow">TickTick</span><h3>غير متصل في هذا المتصفح</h3><p class="muted">بعد الربط: نستورد من TickTick ونرسل مهام Hero الجديدة إليه.</p><div class="row"><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a></div></article>`;return `<article class="notice ok">TickTick متصل ✓ — الاستيراد والإرسال والإكمال تعمل من هذا المتصفح.</article>`}function parentLogin(){const err=qs.get("parentLogin")==="invalid"?"رمز الوالدين غير صحيح.":qs.get("parentLogin")==="not_configured"?"PARENT_PIN غير مهيأ في Railway.":"";return `<div class="stack">${tickCard()}<article class="card login glow"><span class="eyebrow">منطقة الوالدين</span><h2>إدارة مهام يَمان وجودي</h2><p class="muted">اكتب رمز الوالدين من لوحة المفاتيح. الاتجاه RTL مضبوط.</p><form class="form" action="/auth/parent/login" method="post"><label>رمز الوالدين<input name="pin" type="tel" inputmode="numeric" minlength="4" required autocomplete="one-time-code" placeholder="اكتب الرمز هنا" autofocus></label><button class="btn btn-primary" type="submit">فتح منطقة الوالدين</button><p class="login-error">${err}</p></form></article></div>`}function childLogin(member){const key=member==="yaman"?"YAMAN_PIN":"JUDY_PIN";if(!family[`${member}PinConfigured`])return `<article class="card"><span class="eyebrow">${PEOPLE[member].name}</span><h2>رمز الدخول غير مهيأ</h2><p class="muted">أضف ${key} في Railway أولاً.</p></article>`;return `<article class="card login glow"><span class="eyebrow">${PEOPLE[member].name}</span><h2>أدخل رمز الدخول</h2><form class="form" id="childLoginForm" data-member="${member}"><label>رمز ${PEOPLE[member].name}<input id="childPin" type="tel" inputmode="numeric" minlength="4" required placeholder="اكتب الرمز هنا" autofocus></label><button class="btn btn-primary" type="submit">فتح منطقتي</button><p id="childErr" class="login-error"></p></form></article>`}function score(tasks=[]){return tasks.filter(t=>t.done).reduce((s,t)=>s+Number(t.points||0),0)}function taskRows(tasks,member,parent=false){if(!tasks?.length)return `<li class="empty">لا توجد مهام اليوم. اطلب من الوالدين توليد خطة AI.</li>`;return tasks.map(t=>`<li class="task ${t.done?"done":""}"><div><h3>${esc(t.title)}</h3><p>${esc(TYPES[t.type]?.[0]||"مهمة")} · ${t.points} نقطة ${t.source==="chatgpt"?"· ChatGPT":""} ${t.ticktickTaskId?"· TickTick":""}</p>${t.note?`<p>${esc(t.note)}</p>`:""}</div><div class="row">${t.done?`<span class="btn btn-line">تم ✓</span>`:`<button class="btn btn-ok" data-action="complete" data-member="${member}" data-id="${t.id}">أنجزتها</button>`}${parent?`<button class="btn btn-danger" data-action="delete-task" data-id="${t.id}">حذف</button>`:""}</div></li>`).join("")}function parentView(){if(!family.parentAuthenticated)return parentLogin();if(!dashboard)return `<article class="card"><h2>تعذر تحميل لوحة العائلة</h2><button class="btn btn-primary" data-action="reload">إعادة المحاولة</button></article>`;const s=dashboard.summary;return `<div class="stack">${tickCard()}<article class="card ai-banner"><span class="eyebrow">ChatGPT Daily Coach</span><h2>خطة يومية ذكية ومشجعة</h2><p class="muted">ينشئ Hero مهام اليوم ليَمان وجودي، يرسلها إلى TickTick عند الاتصال، ويعرض تشجيع نهاية اليوم بالنقاط.</p><div class="row"><button class="btn btn-primary" data-action="ai-plan">توليد خطة اليوم</button><button class="btn btn-soft" data-action="end-day-parent">تشجيع نهاية اليوم</button></div></article><article class="card"><span class="eyebrow">لوحة العائلة</span><h2>إدارة مهام يَمان وجودي</h2><div class="grid"><div class="metric"><strong>${s.yaman.done}/${s.yaman.total}</strong><span>يَمان · ${score(child.yaman?.tasks||[])} نقطة</span></div><div class="metric"><strong>${s.judy.done}/${s.judy.total}</strong><span>جودي · ${score(child.judy?.tasks||[])} نقطة</span></div></div><div class="row" style="margin-top:14px"><button class="btn btn-primary" data-action="add-task">إضافة مهمة</button><button class="btn btn-soft" data-action="add-event">إضافة موعد</button><button class="btn btn-line" data-action="projects">قوائم TickTick</button><button class="btn btn-line" data-action="import">استيراد اليوم من TickTick</button><button class="btn btn-danger" data-action="logout-parent">خروج</button></div></article><div class="grid"><article class="card list"><div class="list-head"><h3>مهام يَمان</h3><span class="score-orb">${score(child.yaman?.tasks||[])}</span></div><ul class="task-list">${taskRows(child.yaman?.tasks||[],"yaman",true)}</ul></article><article class="card list"><div class="list-head"><h3>مهام جودي</h3><span class="score-orb">${score(child.judy?.tasks||[])}</span></div><ul class="task-list">${taskRows(child.judy?.tasks||[],"judy",true)}</ul></article></div></div>`}function childView(member){if(!family.parentAuthenticated&&!family[`${member}Authenticated`])return childLogin(member);const d=child[member];if(!d)return `<article class="card"><h2>جاري تحميل المنطقة…</h2></article>`;return `<div class="stack"><article class="card ai-banner"><span class="eyebrow">منطقة ${PEOPLE[member].name}</span><h2>مهامي اليوم</h2><div class="row"><span class="score-orb">${score(d.tasks)}</span><button class="btn btn-soft" data-action="end-day" data-member="${member}">تشجيع نهاية اليوم</button><button class="btn btn-line" data-action="logout-child" data-member="${member}">قفل المنطقة</button></div></article><article class="card list"><ul class="task-list">${taskRows(d.tasks,member,false)}</ul></article></div>`}function render(){paintTop();document.getElementById("root").innerHTML=area==="parent"?parentView():childView(area)}async function refresh(){await load();render()}function modal(html){document.getElementById("modalRoot").innerHTML=`<section class="modal"><button class="btn btn-line close" data-action="close">إغلاق</button>${html}</section>`}function close(){document.getElementById("modalRoot").innerHTML=""}function addTaskModal(){modal(`<h2>إضافة مهمة</h2><form class="form" id="taskForm"><label>الطفل<select id="taskMember"><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>المهمة<input id="taskTitle" required placeholder="مثال: حل 3 أسئلة رياضيات"></label><label>النوع<select id="taskType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]} · ${v[1]} نقطة</option>`).join("")}</select></label><label>ملاحظة<input id="taskNote"></label><button class="btn btn-primary" type="submit">حفظ</button></form>`)}function addEventModal(){modal(`<h2>إضافة موعد</h2><form class="form" id="eventForm"><label>لمن؟<select id="eventMember"><option value="family">كل العائلة</option><option value="yaman">يَمان</option><option value="judy">جودي</option></select></label><label>العنوان<input id="eventTitle" required></label><label>التاريخ<input id="eventDate" type="date" value="${today()}" required></label><label>الوقت<input id="eventTime" type="time"></label><button class="btn btn-primary" type="submit">حفظ</button></form>`)}async function aiPlan(){modal(`<h2>ChatGPT يبني خطة اليوم…</h2><p class="muted">انتظر لحظة. سنضيف المهام إلى Hero ونرسلها إلى TickTick إذا كان متصلاً.</p>`);const r=await api("/api/ai/daily-plan",{method:"POST",body:JSON.stringify({date:today()})});modal(`<h2>تم إنشاء خطة اليوم</h2><p class="muted">${esc(r.plan.familyMessage)} ${r.warning?esc(r.warning):""}</p><p>أضيفت ${r.inserted.length} مهام جديدة.</p><button class="btn btn-primary" data-action="reload">عرض الخطة</button>`);await refresh()}async function endDay(member){const r=await api(`/api/ai/end-day/${member}?date=${today()}`);modal(`<h2>تشجيع نهاية اليوم — ${PEOPLE[member].name}</h2><p class="muted">${esc(r.summary.encouragement)}</p><div class="grid"><div class="metric"><strong>${r.summary.points}</strong><span>نقاط اليوم</span></div><div class="metric"><strong>${r.summary.done}/${r.summary.total}</strong><span>المهام</span></div></div><p>${esc(r.summary.nextStep||"")}</p>`)}async function endDayParent(){const y=await api(`/api/ai/end-day/yaman?date=${today()}`);const j=await api(`/api/ai/end-day/judy?date=${today()}`);modal(`<h2>تشجيع نهاية اليوم</h2><article class="notice ok"><strong>يَمان</strong><br>${esc(y.summary.encouragement)}</article><br><article class="notice ok"><strong>جودي</strong><br>${esc(j.summary.encouragement)}</article>`)}async function projectsModal(){if(!tick.connected){modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a>`);return}projects=(await api("/api/ticktick/projects")).projects||[];chosenProjects=new Set(JSON.parse(localStorage.getItem("hero-projects")||"[]"));if(!chosenProjects.size)projects.forEach(p=>chosenProjects.add(p.id));drawProjects()}function drawProjects(){modal(`<h2>اختر قوائم TickTick للاستيراد</h2>${projects.map(p=>`<button class="project-row ${chosenProjects.has(p.id)?"selected":""}" data-action="toggle-project" data-id="${p.id}"><span>${esc(p.name)}</span><strong>${chosenProjects.has(p.id)?"✓":""}</strong></button>`).join("")}<button class="btn btn-primary" data-action="save-projects">حفظ</button>`)}async function importModal(){if(!tick.connected){modal(`<h2>TickTick غير متصل</h2><a class="btn btn-primary" href="/auth/ticktick">ربط TickTick</a>`);return}const ids=JSON.parse(localStorage.getItem("hero-projects")||"[]");const q=ids.length?`?projectIds=${encodeURIComponent(ids.join(","))}`:"";importTasks=(await api(`/api/ticktick/today-tasks${q}`)).tasks||[];chosenTasks=new Set();drawImport()}function drawImport(){modal(`<h2>اختر مهام اليوم من TickTick</h2>${importTasks.length?importTasks.map(t=>`<button class="import-row ${chosenTasks.has(t.projectId+":"+t.id)?"selected":""}" data-action="toggle-import" data-key="${t.projectId}:${t.id}"><span><strong>${esc(t.title)}</strong><br><small>${esc(t.projectName)}</small></span><b>${chosenTasks.has(t.projectId+":"+t.id)?"✓":""}</b></button>`).join(""):`<p class="empty">لا توجد مهام بتاريخ اليوم.</p>`}<div class="row"><button class="btn btn-primary" data-action="assign-import" data-member="yaman">إضافة ليَمان</button><button class="btn btn-primary" data-action="assign-import" data-member="judy">إضافة لجودي</button></div>`)}document.addEventListener("click",async e=>{const b=e.target.closest("[data-area],[data-action]");if(!b)return;if(b.dataset.area){area=b.dataset.area;localStorage.setItem("hero-area",area);history.replaceState(null,"",`?area=${area}`);render();return}const a=b.dataset.action;if(a==="close")return close();if(a==="reload"){close();return refresh()}if(a==="ai-plan")return aiPlan();if(a==="end-day")return endDay(b.dataset.member);if(a==="end-day-parent")return endDayParent();if(a==="add-task")return addTaskModal();if(a==="add-event")return addEventModal();if(a==="projects")return projectsModal();if(a==="import")return importModal();if(a==="toggle-project"){chosenProjects.has(b.dataset.id)?chosenProjects.delete(b.dataset.id):chosenProjects.add(b.dataset.id);return drawProjects()}if(a==="save-projects"){localStorage.setItem("hero-projects",JSON.stringify([...chosenProjects]));close();return}if(a==="toggle-import"){chosenTasks.has(b.dataset.key)?chosenTasks.delete(b.dataset.key):chosenTasks.add(b.dataset.key);return drawImport()}if(a==="assign-import"){const member=b.dataset.member;for(const k of chosenTasks){const t=importTasks.find(x=>`${x.projectId}:${x.id}`===k);if(t)await api("/api/family/tasks",{method:"POST",body:JSON.stringify({assignee:member,title:t.title,type:"other",points:5,date:today(),note:t.content||"مستورد من TickTick",source:"ticktick",ticktickTaskId:t.id,ticktickProjectId:t.projectId,ticktickProjectName:t.projectName})})}close();await refresh();return}if(a==="complete"){await api(`/api/family/tasks/${b.dataset.id}/complete`,{method:"PATCH",body:JSON.stringify({assignee:b.dataset.member})});await refresh();return}if(a==="delete-task"){if(confirm("حذف المهمة؟")){await api(`/api/family/tasks/${b.dataset.id}`,{method:"DELETE"});await refresh()}return}if(a==="logout-parent"){await api("/api/family/parent/logout",{method:"POST"});await refresh();return}if(a==="logout-child"){await api(`/api/family/child/${b.dataset.member}/logout`,{method:"POST"});await refresh();return}});document.addEventListener("submit",async e=>{if(e.target.id==="childLoginForm"){e.preventDefault();const member=e.target.dataset.member;try{await api(`/api/family/child/${member}/login`,{method:"POST",body:JSON.stringify({pin:document.getElementById("childPin").value})});await refresh()}catch(err){document.getElementById("childErr").textContent=err.message}}if(e.target.id==="taskForm"){e.preventDefault();const type=document.getElementById("taskType").value;await api("/api/family/tasks",{method:"POST",body:JSON.stringify({assignee:document.getElementById("taskMember").value,title:document.getElementById("taskTitle").value,type,points:TYPES[type][1],date:today(),note:document.getElementById("taskNote").value,source:"parent"})});close();await refresh()}if(e.target.id==="eventForm"){e.preventDefault();await api("/api/family/events",{method:"POST",body:JSON.stringify({assignee:document.getElementById("eventMember").value,title:document.getElementById("eventTitle").value,date:document.getElementById("eventDate").value,time:document.getElementById("eventTime").value})});close();await refresh()}});refresh().catch(err=>{document.getElementById("root").innerHTML=`<article class="card"><h2>تعذر تشغيل التطبيق</h2><p class="muted">${esc(err.message)}</p></article>`})})();
  </script>
