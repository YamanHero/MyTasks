<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18233d" />
  <title>Hero — يوم يَمان</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --ink: #14213d;
      --muted: #5d6b82;
      --line: #dce4ef;
      --brand: #2457e6;
      --brand-strong: #173b9e;
      --brand-soft: #e9efff;
      --teal: #087c73;
      --teal-soft: #e6f8f4;
      --amber: #9a6300;
      --amber-soft: #fff4d9;
      --danger: #b53946;
      --danger-soft: #fff0f1;
      --navy: #18233d;
      --shadow: 0 14px 34px rgba(22, 35, 61, 0.10);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --tap: 48px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #eef3fb 0, var(--bg) 280px);
      font-family: "Tajawal", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.55;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .52; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(36, 87, 230, .35);
      outline-offset: 2px;
    }

    .app {
      width: min(100% - 28px, 840px);
      margin: 0 auto;
      padding: 16px 0 102px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 86px;
      padding: 16px 18px;
      border-radius: var(--radius-xl);
      color: #fff;
      background: var(--navy);
      box-shadow: var(--shadow);
    }

    .identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 47px;
      height: 47px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 16px;
      background: rgba(255,255,255,.10);
      color: #fff;
      font-size: 1.12rem;
      font-weight: 900;
    }

    .identity h1 { margin: 0; font-size: clamp(1.13rem, 4vw, 1.4rem); line-height: 1.25; }
    .identity p { margin: 3px 0 0; color: #d9e2ff; font-size: .86rem; }

    .icon-button {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: var(--tap);
      height: var(--tap);
      padding: 0;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 1.22rem;
    }

    .main-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 16px 0 22px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 8px 22px rgba(22,35,61,.05);
    }

    .nav-button {
      min-height: 48px;
      padding: 8px 6px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: .87rem;
      font-weight: 800;
    }

    .nav-button[aria-current="page"] {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 5px 12px rgba(36,87,230,.22);
    }

    .screen { display: none; animation: appear .18s ease; }
    .screen.active { display: block; }

    @keyframes appear {
      from { opacity: .01; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: var(--brand-strong);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .02em;
    }

    h2, h3, p { overflow-wrap: anywhere; }
    h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 1.8rem); line-height: 1.28; }
    h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }

    .card {
      padding: 20px;
      border: 1px solid rgba(220,228,239,.95);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 7px 18px rgba(22,35,61,.04);
    }

    .stack { display: grid; gap: 15px; }

    .now-card {
      position: relative;
      overflow: hidden;
      padding: 23px;
      border: 1px solid #cbd7ff;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, #ffffff 0%, #f2f5ff 100%);
      box-shadow: var(--shadow);
    }

    .now-card::after {
      content: "";
      position: absolute;
      left: -64px;
      bottom: -64px;
      width: 170px;
      height: 170px;
      border: 24px solid rgba(36,87,230,.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .now-content { position: relative; z-index: 1; }
    .now-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-size: .78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-pill.done { background: var(--teal-soft); color: #076057; }
    .status-pill.warn { background: var(--amber-soft); color: #765000; }

    .now-title { max-width: 590px; margin: 17px 0 9px; }
    .now-step { margin: 0 0 19px; color: #3e4d67; font-size: 1rem; }

    .action-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-weight: 900;
      text-align: center;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--brand-strong); }
    .btn-secondary { background: #fff; border-color: #bec9dc; color: var(--ink); }
    .btn-soft { background: var(--brand-soft); color: var(--brand-strong); }
    .btn-success { background: var(--teal); color: #fff; }
    .btn-danger { background: #fff; border-color: #e9bcc1; color: var(--danger); }
    .btn-link { min-height: 0; padding: 4px 0; border: 0; background: transparent; color: var(--brand); }

    .progress-panel {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
    }

    .progress-number {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5ebf3;
    }

    .progress-value {
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
      transition: width .25s ease;
    }

    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mini-card {
      padding: 13px 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-soft);
      text-align: center;
    }
    .mini-card strong { display: block; color: var(--ink); font-size: 1.15rem; }
    .mini-card span { display: block; margin-top: 2px; color: var(--muted); font-size: .76rem; }

    .quiet-card {
      border-color: #c9e9e2;
      background: linear-gradient(145deg, #f3fcfa, #fff);
    }
    .quiet-card p { margin: 7px 0 0; color: #32645c; }

    .list-card { padding: 0; overflow: hidden; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 19px 14px;
      border-bottom: 1px solid var(--line);
    }

    .task-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .task-row {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row.active { background: #f2f5ff; }
    .task-row.done { background: #f2fbf8; }

    .task-index {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 1px solid #ccd8f0;
      border-radius: 50%;
      background: #fff;
      color: var(--brand-strong);
      font-size: .82rem;
      font-weight: 900;
    }
    .task-row.done .task-index { border-color: #a9ddd2; background: var(--teal); color: #fff; }
    .task-copy { min-width: 0; }
    .task-copy h3 { font-size: .96rem; }
    .task-copy p { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
    .task-actions { display: flex; align-items: center; gap: 7px; }
    .task-icon-btn {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #c9d4e6;
      border-radius: 11px;
      background: #fff;
      color: var(--brand-strong);
      font-size: .9rem;
      font-weight: 900;
    }
    .task-icon-btn.danger { color: var(--danger); border-color: #f0ccd0; }
    .task-icon-btn.success { color: #fff; background: var(--teal); border-color: var(--teal); }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state p { margin: 6px 0 16px; }

    .timer-card { border-color: #bad6ff; background: linear-gradient(145deg, #eff6ff, #fff); }
    .timer-value {
      direction: ltr;
      margin: 13px 0 4px;
      color: var(--navy);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(2.5rem, 11vw, 4rem);
      font-weight: 900;
      letter-spacing: -.05em;
      text-align: center;
    }
    .timer-note { margin: 0 0 17px; color: var(--muted); text-align: center; }

    .intro-card { padding: 25px; border-color: #c9d6ff; background: linear-gradient(140deg, #edf2ff, #fff); }
    .intro-card h2 { max-width: 540px; }
    .intro-card p { max-width: 590px; margin: 10px 0 19px; color: #41506b; }

    .steps-indicator { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 15px 0 22px; }
    .step-dot {
      height: 8px;
      border-radius: 999px;
      background: #dce4ef;
    }
    .step-dot.active { background: var(--brand); }
    .step-dot.complete { background: var(--teal); }

    .option-grid { display: grid; gap: 10px; }
    .option-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 12px 15px;
      border: 1px solid #cbd5e5;
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      text-align: right;
    }
    .option-button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
    .option-button .sub { display: block; margin-top: 2px; color: var(--muted); font-size: .8rem; font-weight: 700; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .choice-button {
      min-height: 72px;
      padding: 11px;
      border: 1px solid #cbd5e5;
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      text-align: right;
    }
    .choice-button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }

    .form-grid { display: grid; gap: 13px; }
    label { display: grid; gap: 7px; color: var(--ink); font-weight: 900; }
    input, textarea, select {
      width: 100%;
      min-height: var(--tap);
      padding: 11px 12px;
      border: 1px solid #c8d3e2;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 98px; resize: vertical; }

    .idea-card {
      min-height: 220px;
      padding: 23px;
      border: 1px solid #cddcff;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, #f3f6ff, #fff);
    }
    .idea-card p { margin: 9px 0 0; color: #40516d; }

    .script-box {
      padding: 15px;
      border-right: 4px solid var(--brand);
      border-radius: 12px;
      background: var(--surface-soft);
      color: #384861;
    }

    .review-card { border-color: #f0dba8; background: #fffdf8; }
    .review-card p { margin-top: 6px; }

    .modal-root:empty { display: none; }
    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(15, 25, 45, .62);
    }
    .modal {
      position: relative;
      width: min(100%, 590px);
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 84px rgba(10,18,35,.35);
    }
    .modal-close {
      position: absolute;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 1.2rem;
    }
    .modal-head { padding-left: 46px; }
    .modal-head h2 { font-size: 1.35rem; }
    .modal-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

    .toast {
      position: fixed;
      left: 16px;
      bottom: 17px;
      z-index: 70;
      max-width: min(420px, calc(100% - 32px));
      padding: 13px 15px;
      border-radius: 14px;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow);
      transform: translateY(150%);
      opacity: 0;
      transition: .22s ease;
      font-weight: 700;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .footer-note { margin: 20px 0 0; color: var(--muted); font-size: .78rem; text-align: center; }

    @media (min-width: 700px) {
      .app { padding-top: 28px; }
      .content-grid { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(260px,.85fr); gap: 16px; align-items: start; }
      .mini-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 840px); padding-top: 10px; }
      .topbar { border-radius: 20px; padding: 14px; }
      .identity p { display: none; }
      .main-nav { gap: 3px; padding: 5px; }
      .nav-button { font-size: .78rem; }
      .now-card, .intro-card, .idea-card { padding: 19px; border-radius: 20px; }
      .task-row { grid-template-columns: 30px minmax(0,1fr) auto; padding: 13px; gap: 8px; }
      .task-actions { gap: 4px; }
      .task-icon-btn { width: 35px; height: 35px; }
      .modal { padding: 20px 17px 17px; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">Y</div>
        <div>
          <h1>Hero <span aria-hidden="true">—</span> يوم يَمان</h1>
          <p id="headerDate">خطوة واحدة واضحة في كل مرة.</p>
        </div>
      </div>
      <button class="icon-button" type="button" id="settingsBtn" aria-label="إعدادات التطبيق">⚙</button>
    </header>

    <nav class="main-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button" type="button" data-screen="now" aria-current="page">الآن</button>
      <button class="nav-button" type="button" data-screen="plan">خطتي</button>
      <button class="nav-button" type="button" data-screen="creative">الإبداع</button>
      <button class="nav-button" type="button" data-screen="progress">تقدمي</button>
    </nav>

    <main>
      <section class="screen active" id="screenNow" aria-labelledby="nowTitle"></section>
      <section class="screen" id="screenPlan" aria-labelledby="planTitle"></section>
      <section class="screen" id="screenCreative" aria-labelledby="creativeTitle"></section>
      <section class="screen" id="screenProgress" aria-labelledby="progressTitle"></section>
    </main>

    <p class="footer-note">Hero يحفظ الخطة على هذا الجهاز. ربط TickTick اختياري ومخصص لمهام Hero فقط.</p>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "hero-yaman-app-v3";
      const LEGACY_KEYS = ["hero-yaman-app-v2", "hero-yaman-app-v1", "yamanHeroTasks"];
      const MAX_TASKS = 3;
      const FOCUS_MINUTES = 20;

      const TASK_TEMPLATES = {
        study: { label: "دراسة", points: 15, duration: "20 دقيقة" },
        home: { label: "مسؤولية منزلية", points: 10, duration: "10 دقائق" },
        creative: { label: "إبداع", points: 15, duration: "15 دقيقة" },
        movement: { label: "حركة", points: 10, duration: "15 دقيقة" },
        social: { label: "مهارة اجتماعية", points: 10, duration: "5 دقائق" },
        routine: { label: "روتين", points: 5, duration: "5 دقائق" },
        other: { label: "مهمة أخرى", points: 5, duration: "10 دقائق" }
      };

      const GUIDES = {
        study: {
          intro: "ليس المطلوب إنهاء كل الدرس. المطلوب أن تبدأ بجزء صغير وواضح.",
          steps: ["حضّر الدفتر والقلم والكتاب.", "اختر سؤالاً واحداً أو فقرة قصيرة.", "ركّز حتى ينتهي المؤقت.", "ضع علامة على الشيء الصعب لتسأل عنه لاحقاً."],
          tip: "ابدأ بالسؤال الأسهل؛ البداية أهم من الكمال."
        },
        home: {
          intro: "المسؤولية أسهل عندما نعرف أول خطوة فقط.",
          steps: ["حدد شيئاً واحداً مطلوباً الآن.", "حضّر ما تحتاجه.", "أنجز الجزء الصغير بهدوء.", "رتّب المكان وأخبر أحد الوالدين عند الانتهاء."],
          tip: "اطلب المساعدة في أي جهاز أو مادة لست متأكداً منها."
        },
        creative: {
          intro: "المطلوب تجربة قصيرة، لا نتيجة كاملة من أول مرة.",
          steps: ["اختر شخصية أو فكرة واحدة.", "جرّب جملة واحدة بصوت عادي.", "قل الجملة بصوت الشخصية مرتين أو ثلاثاً.", "سجّل نسخة قصيرة واستمع لشيء أعجبك فيها."],
          tip: "لا تحذف المحاولة الأولى بسرعة؛ قد تسمع فيها فكرة جميلة."
        },
        movement: {
          intro: "الحركة القصيرة تساعد الجسم والذهن على العودة للتركيز.",
          steps: ["اشرب قليلاً من الماء.", "ابدأ بحركة خفيفة لدقيقتين.", "اختر تمريناً تحبه.", "خذ نفساً هادئاً عند الانتهاء."],
          tip: "المهم أن تتحرك، وليس أن تكون الأسرع."
        },
        social: {
          intro: "نتدرّب على جملة واحدة فقط. هذا يكفي اليوم.",
          steps: ["اختر الجملة التي ستقولها.", "قلها ببطء.", "جرّبها مع شخص تثق به.", "لاحظ ما نجح."],
          tip: "التحية أو سؤال بسيط بداية ممتازة."
        },
        routine: {
          intro: "روتين قصير يساعدك أن تبدأ اليوم بهدوء.",
          steps: ["اختر أول شيء فقط.", "حضّر ما تحتاجه.", "أنجزه بهدوء.", "تأكد أن المكان مرتب."],
          tip: "خمس دقائق بداية ممتازة."
        },
        other: {
          intro: "نقسم المهمة إلى خطوات صغيرة حتى تكون سهلة للبدء.",
          steps: ["حدد المطلوب بدقة.", "ابدأ أول خطوة لمدة خمس دقائق.", "خذ استراحة قصيرة إن احتجت.", "ارجع لإكمال الجزء التالي."],
          tip: "قل لنفسك: سأبدأ فقط بخمس دقائق."
        }
      };

      const CREATIVE_IDEAS = [
        ["روبوت يتعلم المشاعر", "روبوت مضحك يكتشف أن الناس لا يقولون دائماً ما يشعرون به، فيتعلم أن يسأل: «هل أنت بخير؟»"],
        ["آلة تبديل الأصوات", "مخترع صغير يصنع آلة تغيّر الأصوات، ثم تصبح أصوات الحيوانات غريبة ومضحكة."],
        ["مدرسة الكواكب", "كوكب صغير يبدأ في مدرسة خيالية ويكتشف طريقة سهلة للتعرّف إلى صديق جديد."],
        ["القطة المحققة", "قطة متكلمة تبحث عن الصوت المفقود من مدينة الأصوات، وكل شخصية تعطيها دليلاً."],
        ["البطل الهادئ", "شخصية تساعد صديقين مختلفين على الحديث بهدوء وفهم كل واحد للآخر."]
      ];

      const SOCIAL_SCRIPTS = [
        ["بدء محادثة", "مرحباً، ما الشخصية التي تحبها أكثر؟"],
        ["طلب المساعدة", "هل يمكنك أن تساعدني في هذه الخطوة؟ أنا لا أفهمها بعد."],
        ["استراحة محترمة", "أحتاج استراحة قصيرة، ثم أعود وأكمل."],
        ["الانضمام إلى نشاط", "هل يمكن أن أنضم إليكم؟ أحب أن أشارك."]
      ];

      let state = loadState();
      let activeScreen = "now";
      let wizard = null;
      let timerInterval = null;
      let ticktickState = { configured: false, connected: false, projectName: "Hero – Yaman" };

      function dateKey(date = new Date()) {
        return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
      }

      function newId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function defaultState() {
        return {
          date: dateKey(),
          profile: { ready: false, energy: "", commitments: [], focus: "" },
          tasks: [],
          activeTaskId: null,
          timer: { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null },
          pointsByDate: {},
          activeStrengths: [],
          review: null,
          creativeIdeaIndex: 0,
          socialSkillIndex: 0
        };
      }

      function normalizeType(value) {
        const map = {
          studySession: "study",
          studyStart: "study",
          home: "home",
          creative: "creative",
          movement: "movement",
          social: "social",
          routine: "routine",
          tomorrow: "routine",
          video: "creative"
        };
        return TASK_TEMPLATES[value] ? value : (map[value] || "other");
      }

      function normalizeTask(task) {
        const type = normalizeType(task.type || task.category || "other");
        return {
          id: task.id || newId(),
          title: String(task.title || "مهمة قصيرة"),
          type,
          points: Number(task.points) || TASK_TEMPLATES[type].points,
          done: Boolean(task.done || task.completed),
          ticktickTaskId: task.ticktickTaskId || null,
          ticktickProjectId: task.ticktickProjectId || null,
          ticktickCompleted: Boolean(task.ticktickCompleted)
        };
      }

      function loadState() {
        let raw = null;
        try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch {}

        if (!raw) {
          for (const key of LEGACY_KEYS) {
            try {
              const previous = JSON.parse(localStorage.getItem(key) || "null");
              if (Array.isArray(previous)) { raw = { tasks: previous }; break; }
              if (previous && typeof previous === "object") { raw = previous; break; }
            } catch {}
          }
        }

        const base = defaultState();
        if (!raw || typeof raw !== "object") return base;

        return {
          ...base,
          ...raw,
          profile: { ...base.profile, ...(raw.profile || {}) },
          timer: { ...base.timer, ...(raw.timer || {}) },
          tasks: Array.isArray(raw.tasks) ? raw.tasks.map(normalizeTask) : [],
          activeStrengths: Array.isArray(raw.activeStrengths) ? raw.activeStrengths : [],
          pointsByDate: raw.pointsByDate || {}
        };
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate() {
        return new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timeout);
        showToast.timeout = setTimeout(() => toast.classList.remove("show"), 3300);
      }

      function carryForward() {
        if (state.date === dateKey()) return;
        const carry = {
          pointsByDate: state.pointsByDate || {},
          activeStrengths: state.activeStrengths || [],
          creativeIdeaIndex: state.creativeIdeaIndex || 0,
          socialSkillIndex: state.socialSkillIndex || 0
        };
        state = { ...defaultState(), ...carry };
        saveState();
      }

      function completedTasks() {
        return state.tasks.filter(task => task.done);
      }

      function dailyPoints() {
        return completedTasks().reduce((sum, task) => sum + Number(task.points || 0), 0);
      }

      function saveDailyPoints() {
        state.pointsByDate[state.date] = dailyPoints();
        saveState();
      }

      function weekPoints() {
        const start = new Date();
        const day = start.getDay();
        start.setDate(start.getDate() + (day === 0 ? -6 : 1 - day));
        start.setHours(12, 0, 0, 0);
        let total = 0;
        for (let i = 0; i < 7; i += 1) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          total += Number(state.pointsByDate[dateKey(date)] || 0);
        }
        return total;
      }

      function findTask(id) {
        return state.tasks.find(task => String(task.id) === String(id));
      }

      function nextTask() {
        return state.tasks.find(task => !task.done) || null;
      }

      function taskGuide(task) {
        const title = String(task.title || "");
        if (/غسيل|ملابس|نشافة/.test(title)) {
          return {
            intro: "نرتب الغسيل خطوة خطوة حتى تبقى المهمة قصيرة وواضحة.",
            steps: ["اجمع الملابس المطلوبة في سلة واحدة.", "افصل الأبيض عن الملوّن إذا طلب منك ذلك.", "ضع الملابس في المكان الصحيح حسب تعليمات الأهل.", "رتّب المكان وأخبر أحد الوالدين عند الانتهاء."],
            tip: "اسأل قبل تشغيل جهاز لم تتعلم استخدامه."
          };
        }
        if (/زبالة|نفايات/.test(title)) {
          return {
            intro: "هذه مسؤولية مهمة تساعد العائلة.",
            steps: ["أغلق الكيس جيداً.", "تأكد أن الطريق آمن.", "خذ المفتاح إن احتجت.", "ضع الكيس في الحاوية ثم عد مباشرة."],
            tip: "لا تحمل كيساً ثقيلاً جداً وحدك."
          };
        }
        return GUIDES[task.type] || GUIDES.other;
      }

      function taskMeta(task) {
        return `${TASK_TEMPLATES[task.type]?.label || "مهمة"} · +${task.points} نقطة`;
      }

      function updateHeader() {
        document.getElementById("headerDate").textContent = `اليوم ${formatDate()} · خطوة واحدة واضحة في كل مرة.`;
      }

      function setScreen(screen) {
        activeScreen = screen;
        document.querySelectorAll(".screen").forEach(el => el.classList.toggle("active", el.id === `screen${screen[0].toUpperCase()}${screen.slice(1)}`));
        document.querySelectorAll("[data-screen]").forEach(button => {
          button.setAttribute("aria-current", button.dataset.screen === screen ? "page" : "false");
        });
        if (screen !== "now") stopVisualTimer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderAll() {
        carryForward();
        updateHeader();
        renderNow();
        renderPlan();
        renderCreative();
        renderProgress();
        renderTickTickStatus();
        setScreen(activeScreen);
      }

      function renderNow() {
        const root = document.getElementById("screenNow");
        const task = nextTask();
        const complete = completedTasks().length;
        const total = state.tasks.length;
        const progress = total ? Math.round((complete / total) * 100) : 0;
        const active = state.activeTaskId ? findTask(state.activeTaskId) : null;

        if (!state.profile.ready) {
          root.innerHTML = `
            <article class="intro-card">
              <span class="eyebrow">ابدأ بهدوء</span>
              <h2 id="nowTitle">ما الذي نفعله الآن؟ نبني خطة قصيرة لليوم.</h2>
              <p>ثلاثة اختيارات بسيطة فقط، ثم تظهر لك مهمة واحدة واضحة لتبدأ بها. لا يوجد ضغط ولا خصم نقاط.</p>
              <button class="btn btn-primary" type="button" data-action="open-wizard">بناء خطة اليوم</button>
            </article>
            <article class="card quiet-card" style="margin-top:15px">
              <h3>تذكير هادئ للصلاة</h3>
              <p>قبل الصلاة: أوقف الشاشة قليلاً، توضأ إن احتجت، وخذ نفسين هادئين.</p>
            </article>`;
          return;
        }

        if (!task) {
          root.innerHTML = `
            <article class="now-card">
              <div class="now-content">
                <span class="eyebrow">اكتمل اليوم</span>
                <h2 id="nowTitle" class="now-title">أحسنت يا يَمان. أنهيت مهامك الرئيسية.</h2>
                <p class="now-step">الآن اختر راحة حقيقية، أو افتح “تقدمي” واكتب شيئاً واحداً تفخر به.</p>
                <div class="action-row">
                  <button class="btn btn-primary" type="button" data-screen="progress">فتح تقدمي</button>
                  <button class="btn btn-secondary" type="button" data-action="open-plan">عرض الخطة</button>
                </div>
              </div>
            </article>
            ${renderSummary(progress, complete, total)}
            <article class="card quiet-card">
              <h3>وقت هادئ</h3><p>أنت لا تحتاج أن تضيف مهمة جديدة الآن. الراحة جزء مهم من اليوم.</p>
            </article>`;
          return;
        }

        const guide = taskGuide(task);
        const isActive = active && active.id === task.id;
        const mainCard = isActive
          ? `
            <article class="card timer-card">
              <span class="eyebrow">أنت تعمل الآن على</span>
              <h2 id="nowTitle">${escapeHTML(task.title)}</h2>
              <div class="timer-value" id="timerValue">${formatTime(currentTimerRemaining())}</div>
              <p class="timer-note">${state.timer.running ? "المؤقت يعمل. ركّز على الخطوة الحالية فقط." : "يمكنك بدء المؤقت أو أخذ استراحة قصيرة."}</p>
              <div class="action-row">
                <button class="btn btn-primary" type="button" data-action="toggle-timer">${state.timer.running ? "إيقاف مؤقت" : "بدء مؤقت 20 دقيقة"}</button>
                <button class="btn btn-success" type="button" data-action="complete-task" data-task-id="${task.id}">أنجزتها</button>
                <button class="btn btn-secondary" type="button" data-action="open-guide" data-task-id="${task.id}">عرض الخطوات</button>
              </div>
            </article>`
          : `
            <article class="now-card">
              <div class="now-content">
                <div class="now-top">
                  <span class="eyebrow" style="margin:0">المهمة التالية</span>
                  <span class="status-pill">${escapeHTML(TASK_TEMPLATES[task.type]?.label || "مهمة")}</span>
                </div>
                <h2 id="nowTitle" class="now-title">${escapeHTML(task.title)}</h2>
                <p class="now-step"><strong>ابدأ بهذا فقط:</strong> ${escapeHTML(guide.steps[0])}</p>
                <div class="action-row">
                  <button class="btn btn-primary" type="button" data-action="start-task" data-task-id="${task.id}">ابدأ الآن</button>
                  <button class="btn btn-secondary" type="button" data-action="open-guide" data-task-id="${task.id}">شاهد الخطوات</button>
                </div>
              </div>
            </article>`;

        root.innerHTML = `
          <div class="content-grid">
            <div class="stack">
              ${mainCard}
              <article class="card quiet-card">
                <h3>تذكير هادئ للصلاة</h3>
                <p>قبل الصلاة: أوقف الشاشة قليلاً، توضأ إن احتجت، وخذ نفسين هادئين.</p>
              </article>
            </div>
            <div class="stack">
              ${renderSummary(progress, complete, total)}
              <article class="card">
                <span class="eyebrow">خطة اليوم</span>
                <h3>${total - complete} مهمة متبقية</h3>
                <p class="muted small">لا تحتاج للتفكير في كل المهام. سنعرض واحدة فقط في كل مرة.</p>
                <button class="btn btn-soft" type="button" data-action="open-plan" style="margin-top:8px">فتح الخطة</button>
              </article>
            </div>

        if (isActive) startVisualTimer();

        return `
          <article class="card">

                <div class="progress-track" aria-label="تقدم اليوم"><div class="progress-value" style="width:${progress}%"></div></div>
              </div>
            </div>
          </article>`;
      }

          root.innerHTML = `
            <article class="intro-card">

            </article>`;

          ? state.tasks.map((task, index) => {

                <li class="task-row ${task.done ? "done" : ""} ${isActive ? "active" : ""}">

                        <button class="task-icon-btn success" type="button" data-action="start-task" data-task-id="${task.id}" aria-label="بدء المهمة">▶</button>

          : `<li class="empty-state"><h3>لا توجد مهام بعد</h3><p>لنضيف مهمة واحدة واضحة فقط.</p></li>`;

              </div>
            </article>
            <article class="card list-card">
              <div class="section-head">
                <div><h3>مهام اليوم</h3><span class="muted small">${state.tasks.length} من ${MAX_TASKS} مستخدمة</span></div>

            </article>
          </div>`;

              <p class="muted">هذه النقاط تقيس الجهد والمسؤولية والإبداع. لا توجد خصومات أبداً، ولا ترتبط بالصلاة.</p>

                </label>

      function openModal(content) {
        const root = document.getElementById("modalRoot");
        root.innerHTML = `<section class="modal" role="dialog" aria-modal="true">${content}<button class="modal-close" type="button" data-action="close-modal" aria-label="إغلاق">×</button></section>`;
        root.querySelector(".modal-close").focus();
      }

      function closeModal() {
        document.getElementById("modalRoot").innerHTML = "";
      }

      function openGuide(task) {
        const guide = taskGuide(task);
        openModal(`
          <div class="modal-head">
            <span class="eyebrow">خطة التنفيذ</span>
            <h2>${escapeHTML(task.title)}</h2>
            <p class="muted">${escapeHTML(guide.intro)}</p>
          </div>
          <ol class="stack" style="margin:20px 0;padding:0;list-style:none">
            ${guide.steps.map((step, index) => `<li class="card" style="padding:13px"><strong>${index + 1}.</strong> ${escapeHTML(step)}</li>`).join("")}
          </ol>
          <div class="card" style="padding:14px;background:#fff8e7;border-color:#f2d68c"><strong>نصيحة Hero:</strong> ${escapeHTML(guide.tip)}</div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="close-modal">لاحقاً</button>
            <button class="btn btn-primary" type="button" data-action="start-task" data-task-id="${task.id}">ابدأ هذه المهمة</button>
          </div>`);
      }

      function openAddTask() {
        const options = Object.entries(TASK_TEMPLATES).map(([key, item]) => `<option value="${key}">${item.label} · +${item.points} نقطة</option>`).join("");
        openModal(`
          <div class="modal-head">
            <span class="eyebrow">مهمة واحدة واضحة</span>
            <h2>أضف مهمة لليوم</h2>
            <p class="muted">اكتبها قصيرة، بحيث تعرف ما تبدأ به فوراً.</p>
          </div>
          <form class="form-grid" id="addTaskForm" style="margin-top:18px">
            <label>ماذا ستفعل؟
              <input id="newTaskTitle" required maxlength="90" placeholder="مثال: أحل 3 أسئلة رياضيات">
            </label>
            <label>نوع المهمة
              <select id="newTaskType">${options}</select>
            </label>
            <div class="modal-foot">
              <button class="btn btn-secondary" type="button" data-action="close-modal">إلغاء</button>
              <button class="btn btn-primary" type="submit">أضف إلى الخطة</button>
            </div>
          </form>`);
      }

      function openSettings() {
        const status = ticktickState.connected
          ? `متصل بقائمة ${escapeHTML(ticktickState.projectName)}`
          : ticktickState.configured ? "غير متصل" : "غير مفعّل على الخادم";
        openModal(`
          <div class="modal-head">
            <span class="eyebrow">إعدادات</span>
            <h2>إدارة اليوم والربط</h2>
          </div>
          <div class="stack" style="margin-top:18px">
            <article class="card" style="padding:15px">
              <h3>TickTick</h3>
              <p class="muted small">${status}</p>
              <div class="action-row" style="margin-top:10px">
                ${ticktickState.connected
                  ? `<button class="btn btn-soft" type="button" data-action="sync-ticktick">مزامنة الآن</button>
                     <button class="btn btn-danger" type="button" data-action="disconnect-ticktick">فصل الاتصال</button>`
                  : `<button class="btn btn-primary" type="button" data-action="connect-ticktick" ${ticktickState.configured ? "" : "disabled"}>ربط TickTick</button>`}
              </div>
            </article>
            <article class="card" style="padding:15px">
              <h3>بداية يوم جديد</h3>
              <p class="muted small">يحفظ التطبيق نقاط اليوم ثم يبدأ صفحة نظيفة وخطة جديدة.</p>
              <button class="btn btn-secondary" type="button" data-action="reset-day">بداية يوم جديد</button>
            </article>
          </div>`);
      }

      function openMorningWizard() {
        wizard = {
          step: 0,
          answers: {
            energy: state.profile.energy || "",
            commitments: state.profile.commitments || [],
            focus: state.profile.focus || ""
          }
        };
        renderWizard();
      }

      function renderWizard() {
        const questions = [
          { key: "energy", title: "كيف هي طاقتك اليوم؟", copy: "هذا يساعدنا أن نجعل الخطة مناسبة ليومك.", type: "single", options: [["منخفضة", "نختار مهاماً أقصر"], ["متوسطة", "خطة متوازنة"], ["عالية", "يمكنك اختيار تحدٍّ لطيف"]] },
          { key: "commitments", title: "هل يوجد موعد ثابت اليوم؟", copy: "يمكنك اختيار أكثر من شيء، أو تخطي الخطوة.", type: "multi", options: ["مدرسة", "رياضة", "علاج", "خروج عائلي", "لا يوجد موعد مهم"] },
          { key: "focus", title: "ما المجال الذي تريد أن تبدأ به؟", copy: "ليس التزاماً كبيراً؛ فقط بداية اليوم.", type: "single", options: [["دراسة", "رياضيات أو علوم"], ["مسؤولية", "مهمة قصيرة في البيت"], ["إبداع", "دبلجة أو رسوم"], ["توازن", "حركة وهدوء"]] }
        ];
        const question = questions[wizard.step];
        const last = wizard.step === questions.length - 1;
        const selected = wizard.answers[question.key];

        const options = question.type === "multi"
          ? `<div class="choice-grid">${question.options.map(option => `<button class="choice-button" type="button" data-wizard-multi="${escapeHTML(option)}" aria-pressed="${(selected || []).includes(option)}">${(selected || []).includes(option) ? "✓ " : ""}${escapeHTML(option)}</button>`).join("")}</div>`
          : `<div class="option-grid">${question.options.map(([title, sub]) => `<button class="option-button" type="button" data-wizard-single="${escapeHTML(title)}" aria-pressed="${selected === title}"><span>${escapeHTML(title)}<span class="sub">${escapeHTML(sub)}</span></span><span aria-hidden="true">${selected === title ? "✓" : ""}</span></button>`).join("")}</div>`;

        openModal(`
          <div class="modal-head">
            <span class="eyebrow">إعداد الخطة · ${wizard.step + 1} من 3</span>
            <div class="steps-indicator" aria-hidden="true">
              ${[0,1,2].map(i => `<span class="step-dot ${i < wizard.step ? "complete" : i === wizard.step ? "active" : ""}"></span>`).join("")}
            </div>
            <h2>${question.title}</h2>
            <p class="muted">${question.copy}</p>
          </div>
          <div style="margin-top:19px">${options}</div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="wizard-back" ${wizard.step === 0 ? "disabled" : ""}>رجوع</button>
            <button class="btn btn-primary" type="button" data-action="wizard-next">${last ? "أنشئ الخطة" : "التالي"}</button>
          </div>`);
      }

      function createPlan() {
        const energy = wizard.answers.energy || "متوسطة";
        const focus = wizard.answers.focus || "دراسة";
        const studyDuration = energy === "منخفضة" ? "15" : "20";
        const first = {
          "دراسة": { type: "study", title: `دراسة لمدة ${studyDuration} دقيقة: ابدأ بسؤال واحد` },
          "مسؤولية": { type: "home", title: "مسؤولية منزلية قصيرة: ترتيب المكتب أو الملابس" },
          "إبداع": { type: "creative", title: "تدريب دبلجة: جملة واحدة بثلاث نبرات" },
          "توازن": { type: "movement", title: "حركة خفيفة أو مشي لمدة 15 دقيقة" }
        }[focus];

        const candidates = [
          first,
          { type: "home", title: "مسؤولية منزلية قصيرة: ترتيب المكتب أو الملابس" },
          { type: "creative", title: "نشاط إبداعي: دبلجة أو رسم لمدة 15 دقيقة" },
          { type: "study", title: `دراسة لمدة ${studyDuration} دقيقة: جزء صغير وواضح` },
          { type: "movement", title: "حركة خفيفة أو مشي لمدة 15 دقيقة" }
        ];

        const tasks = [];
        for (const item of candidates) {
          if (tasks.length === MAX_TASKS) break;
          if (!tasks.some(task => task.type === item.type)) {
            tasks.push({ id: newId(), ...item, points: TASK_TEMPLATES[item.type].points, done: false });
          }
        }

        state.profile = { ready: true, energy, commitments: wizard.answers.commitments || [], focus };
        state.tasks = tasks;
        state.activeTaskId = null;
        state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
        state.review = null;
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        showToast("أحسنت يا يَمان. أمامك الآن مهمة واحدة فقط.");
        if (ticktickState.connected) syncAllTasks();
      }

      function startTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        state.activeTaskId = task.id;
        state.timer = { taskId: task.id, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        showToast("ابدأ فقط بالخطوة الأولى. هذا يكفي الآن.");
      }

      function currentTimerRemaining() {
        if (!state.timer.running || !state.timer.startedAt) return Math.max(0, Number(state.timer.remaining) || 0);
        const elapsed = Math.floor((Date.now() - state.timer.startedAt) / 1000);
        return Math.max(0, Number(state.timer.remaining) - elapsed);
      }

      function formatTime(seconds) {
        const safe = Math.max(0, Number(seconds) || 0);
        const min = Math.floor(safe / 60);
        const sec = safe % 60;
        return `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      }

      function startVisualTimer() {
        stopVisualTimer();
        timerInterval = setInterval(() => {
          const remaining = currentTimerRemaining();
          const display = document.getElementById("timerValue");
          if (display) display.textContent = formatTime(remaining);
          if (remaining === 0 && state.timer.running) {
            state.timer.remaining = 0;
            state.timer.running = false;
            state.timer.startedAt = null;
            saveState();
            stopVisualTimer();
            renderNow();
            showToast("انتهى الوقت. اختر: استراحة قصيرة أو إكمال المهمة.");
          }
        }, 1000);
      }

      function stopVisualTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
      }

      function toggleTimer() {
        const remaining = currentTimerRemaining();
        if (remaining === 0) {
          state.timer.remaining = FOCUS_MINUTES * 60;
          state.timer.running = true;
          state.timer.startedAt = Date.now();
        } else if (state.timer.running) {
          state.timer.remaining = remaining;
          state.timer.running = false;
          state.timer.startedAt = null;
        } else {
          state.timer.remaining = remaining;
          state.timer.running = true;
          state.timer.startedAt = Date.now();
        }
        saveState();
        renderNow();
      }

      async function completeTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        task.done = true;
        if (state.activeTaskId === task.id) {
          state.activeTaskId = null;
          state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
          stopVisualTimer();
        }
        saveDailyPoints();
        renderAll();
        if (ticktickState.connected) {
          try { await syncTask(task.id); } catch {}
        }
        showToast(`أحسنت يا يَمان. أنهيت المهمة وحصلت على ${task.points} نقطة.`);
      }

      function deleteTask(taskId) {
        const task = findTask(taskId);
        if (!task || task.done) return;
        state.tasks = state.tasks.filter(item => item.id !== task.id);
        if (state.activeTaskId === task.id) {
          state.activeTaskId = null;
          state.timer = { taskId: null, remaining: FOCUS_MINUTES * 60, running: false, startedAt: null };
          stopVisualTimer();
        }
        saveState();
        renderAll();
        showToast("تم حذف المهمة غير المكتملة.");
      }

      function resetDay() {
        const carry = { pointsByDate: state.pointsByDate || {}, activeStrengths: state.activeStrengths || [], creativeIdeaIndex: state.creativeIdeaIndex || 0, socialSkillIndex: state.socialSkillIndex || 0 };
        state = { ...defaultState(), ...carry };
        saveState();
        closeModal();
        activeScreen = "now";
        renderAll();
        openMorningWizard();
      }

      function addCreativeTask() {
        if (state.tasks.length >= MAX_TASKS) {
          showToast("لديك ثلاث مهام رئيسية. لا نضيف أكثر اليوم.");
          return;
        }
        const task = {
          id: newId(),
          type: "creative",
          title: "تدريب دبلجة: جملة واحدة بثلاث نبرات",
          points: TASK_TEMPLATES.creative.points,
          done: false
        };
        state.tasks.push(task);
        saveState();
        renderAll();
        showToast("أضفنا تدريب الدبلجة إلى الخطة.");
        if (ticktickState.connected) syncTask(task.id);
      }

      async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) }
        });
        const text = await response.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch {}
        if (!response.ok) {
          const error = new Error(body?.error || "تعذر الاتصال بـ TickTick.");
          error.status = response.status;
          throw error;
        }
        return body;
      }

      async function refreshTickTickStatus() {
        try {
          const response = await fetch("/api/ticktick/status", { cache: "no-store" });
          if (!response.ok) throw new Error();
          ticktickState = await response.json();
        } catch {
          ticktickState = { configured: false, connected: false, projectName: "Hero – Yaman" };
        }
      }

      function renderTickTickStatus() {
        // Status is rendered in the settings sheet, where it belongs; it does not compete with the daily task.
      }

      async function sendTaskToTickTick(task) {
        if (!ticktickState.connected || task.ticktickTaskId) return task;
        const result = await apiRequest("/api/ticktick/task", {
          method: "POST",
          body: JSON.stringify({ title: task.title, category: task.type, points: task.points, completed: task.done })
        });
        task.ticktickTaskId = result.task.id;
        task.ticktickProjectId = result.task.projectId;
        task.ticktickCompleted = Boolean(result.task.completed);
        saveState();
        return task;
      }

      async function completeTaskInTickTick(task) {
        if (!ticktickState.connected || !task.done || task.ticktickCompleted) return task;
        const current = task.ticktickTaskId ? task : await sendTaskToTickTick(task);
        if (current.ticktickCompleted) return current;
        await apiRequest("/api/ticktick/task/complete", {
          method: "POST",
          body: JSON.stringify({ projectId: current.ticktickProjectId, taskId: current.ticktickTaskId })
        });
        current.ticktickCompleted = true;
        saveState();
        return current;
      }

      async function syncTask(taskId) {
        let task = findTask(taskId);
        if (!task) return;
        if (!task.ticktickTaskId) task = await sendTaskToTickTick(task);
        if (task.done && !task.ticktickCompleted) await completeTaskInTickTick(task);
      }

      async function syncAllTasks() {
        if (!ticktickState.connected) {
          showToast("اربط TickTick أولاً.");
          return;
        }
        let synced = 0;
        for (const task of [...state.tasks]) {
          try { await syncTask(task.id); synced += 1; } catch {}
        }
        showToast(`تمت مزامنة ${synced} مهام مع TickTick.`);
      }

      function connectTickTick() {
        if (!ticktickState.configured) {
          showToast("يجب إعداد TickTick في Railway أولاً.");
          return;
        }
        window.location.assign("/auth/ticktick");
      }

      async function disconnectTickTick() {
        try {
          await apiRequest("/api/ticktick/disconnect", { method: "POST" });
          await refreshTickTickStatus();
          openSettings();
          showToast("تم فصل TickTick من هذا المتصفح.");
        } catch {
          showToast("تعذر فصل TickTick الآن.");
        }
      }

      function toggleStrength(strength) {
        state.activeStrengths = state.activeStrengths.includes(strength)
          ? state.activeStrengths.filter(item => item !== strength)
          : [...state.activeStrengths, strength];
        saveState();
        renderProgress();
      }

      function bindEvents() {
        document.addEventListener("click", async event => {
          const button = event.target.closest("[data-action], [data-screen]");
          if (!button) return;

          if (button.dataset.screen) {
            setScreen(button.dataset.screen);
            return;
          }

          const action = button.dataset.action;
          const taskId = button.dataset.taskId;

          if (action === "open-wizard") openMorningWizard();
          if (action === "open-plan") setScreen("plan");
          if (action === "open-guide") {
            const task = findTask(taskId);
            if (task) openGuide(task);
          }
          if (action === "close-modal") closeModal();
          if (action === "start-task") startTask(taskId);
          if (action === "toggle-timer") toggleTimer();
          if (action === "complete-task") completeTask(taskId);
          if (action === "delete-task") deleteTask(taskId);
          if (action === "add-task") openAddTask();
          if (action === "add-creative-task") addCreativeTask();
          if (action === "next-idea") {
            state.creativeIdeaIndex = (state.creativeIdeaIndex + 1) % CREATIVE_IDEAS.length;
            saveState(); renderCreative();
          }
          if (action === "next-social") {
            state.socialSkillIndex = (state.socialSkillIndex + 1) % SOCIAL_SCRIPTS.length;
            saveState(); renderCreative();
          }
          if (action === "toggle-strength") toggleStrength(button.dataset.strength);
          if (action === "reset-day") resetDay();
          if (action === "connect-ticktick") connectTickTick();
          if (action === "sync-ticktick") syncAllTasks();
          if (action === "disconnect-ticktick") disconnectTickTick();

          if (action === "wizard-back") {
            wizard.step = Math.max(0, wizard.step - 1);
            renderWizard();
          }

          if (action === "wizard-next") {
            const isMulti = wizard.step === 1;
            if (wizard.step === 0 && !wizard.answers.energy) {
              showToast("اختر مستوى طاقتك، ثم نكمل.");
              return;
            }
            if (wizard.step === 2 && !wizard.answers.focus) {
              showToast("اختر مجالاً واحداً لتبدأ به.");
              return;
            }
            if (isMulti && !wizard.answers.commitments.length) wizard.answers.commitments = ["لا يوجد موعد مهم"];
            if (wizard.step === 2) createPlan();
            else { wizard.step += 1; renderWizard(); }
          }

          if (button.dataset.wizardSingle) {
            const key = wizard.step === 0 ? "energy" : "focus";
            wizard.answers[key] = button.dataset.wizardSingle;
            renderWizard();
          }

          if (button.dataset.wizardMulti) {
            const value = button.dataset.wizardMulti;
            let selected = [...(wizard.answers.commitments || [])];
            if (value === "لا يوجد موعد مهم") {
              selected = selected.includes(value) ? [] : [value];
            } else {
              selected = selected.filter(item => item !== "لا يوجد موعد مهم");
              selected = selected.includes(value) ? selected.filter(item => item !== value) : [...selected, value];
            }
            wizard.answers.commitments = selected;
            renderWizard();
          }
        });

        document.addEventListener("submit", event => {
          if (event.target.id === "addTaskForm") {
            event.preventDefault();
            const title = document.getElementById("newTaskTitle").value.trim();
            const type = document.getElementById("newTaskType").value;
            if (!title) {
              showToast("اكتب المهمة بجملة قصيرة وواضحة.");
              return;
            }
            if (state.tasks.length >= MAX_TASKS) {
              showToast("لديك ثلاث مهام رئيسية اليوم.");
              return;
            }
            const task = { id: newId(), title, type, points: TASK_TEMPLATES[type].points, done: false };
            state.tasks.push(task);
            saveState();
            closeModal();
            renderAll();
            showToast("أُضيفت المهمة. اخترها من شاشة “الآن” عندما تصبح جاهزاً.");
            if (ticktickState.connected) syncTask(task.id);
          }

          if (event.target.id === "reviewForm") {
            event.preventDefault();
            state.review = {
              proud: document.getElementById("reviewProud").value.trim(),
              tomorrow: document.getElementById("reviewTomorrow").value.trim()
            };
            saveState();
            showToast("تم حفظ الملاحظة. يومك لا يحتاج أن يكون مثالياً حتى يكون جيداً.");
          }
        });

        document.getElementById("settingsBtn").addEventListener("click", openSettings);
        document.getElementById("modalRoot").addEventListener("click", event => {
          if (event.target === event.currentTarget) closeModal();
        });
      }

      function getTickTickNotice() {
        const url = new URL(window.location.href);
        const notice = url.searchParams.get("ticktick");
        if (!notice) return null;
        url.searchParams.delete("ticktick");
        window.history.replaceState({}, document.title, url.pathname + url.search);
        return notice;
      }

      bindEvents();
      renderAll();

      (async () => {
        const notice = getTickTickNotice();
        await refreshTickTickStatus();
        if (notice === "connected") showToast("تم ربط TickTick بنجاح.");
        if (notice === "denied") showToast("لم يتم منح Hero إذن الوصول إلى TickTick.");
        if (notice === "state_error") showToast("انتهت جلسة الربط. حاول مرة أخرى.");
      })();
    })();
  </script>
</body>
</html>
